<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CompTIA A+ Core 1 Practice Exam</title>
<style>
:root{--bg:#071021;--card:#0b1220;--accent:#06b6d4;--accent2:#7c3aed;--muted:#94a3b8;--good:#16a34a;--bad:#ef4444;--line:rgba(255,255,255,0.08)}
*{box-sizing:border-box}
body{font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,#04111a 0%,#071021 100%);color:#e6eef6;margin:0;padding:24px;min-height:100vh}
.wrap{max-width:900px;margin:0 auto}
h1{margin:0 0 4px 0;font-size:22px}
h2{margin:0 0 12px 0;font-size:18px}
.sub{color:var(--muted);font-size:14px;margin-bottom:20px}
.card{background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));padding:22px;border-radius:14px;box-shadow:0 8px 32px rgba(2,6,23,0.6);border:1px solid var(--line);margin-bottom:16px}
button{background:var(--accent);color:#042027;border:0;padding:11px 18px;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px}
button:hover{filter:brightness(1.08)}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
button.ghost:hover{color:#e6eef6;border-color:var(--accent)}
button.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:10px}
.tile{border-radius:18px;padding:22px 18px;color:#fff;cursor:pointer;border:none;text-align:left;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 10px 24px rgba(2,6,23,0.4);transition:transform .12s ease, box-shadow .12s ease;font-family:inherit}
.tile:hover{transform:translateY(-4px);box-shadow:0 16px 32px rgba(2,6,23,0.55)}
.tile .icon{font-size:34px;line-height:1}
.tile .ttitle{font-size:17px;font-weight:800;margin-top:10px}
.tile .tsub{font-size:12.5px;opacity:.92;margin-top:4px}
.tile.lightning{background:linear-gradient(135deg,#a78bfa,#4c1d95)}
.tile.fire{background:linear-gradient(135deg,#fb923c,#dc2626)}
.tile.storm{background:linear-gradient(135deg,#475569,#1e293b)}
.tile.sun{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#4a2c00}
.tile.sun .tsub{color:#5c3a00}
.tile.green{background:linear-gradient(135deg,#34d399,#059669)}
.domain-group{margin-bottom:16px}
.domain-group h3{font-size:14px;margin:0 0 8px;color:var(--accent);border-bottom:1px solid var(--line);padding-bottom:6px}
.domain-list{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.domain-item{display:flex;align-items:center;gap:10px;background:#071022;padding:12px 14px;border-radius:10px;border:1px solid var(--line)}
.domain-item label{flex:1;cursor:pointer;font-size:14px}
.domain-count{color:var(--muted);font-size:13px}
.domain-item input{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.count-row{display:flex;align-items:center;gap:14px;margin:16px 0}
.count-row input[type=number]{width:90px;background:#071022;border:1px solid var(--line);color:#e6eef6;padding:9px 10px;border-radius:8px;font-size:15px}
.count-row input[type=range]{flex:1;accent-color:var(--accent)}
.note{color:var(--muted);font-size:13px;margin-top:6px}
.resume-banner{background:rgba(124,58,237,0.12);border:1px solid rgba(124,58,237,0.4);padding:14px 16px;border-radius:10px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.progress{height:8px;background:rgba(255,255,255,0.06);border-radius:999px;overflow:hidden;margin:14px 0}
.bar{height:8px;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:width .3s ease}
.qmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:10px}
.qtext{font-weight:700;font-size:17px;line-height:1.5;margin-bottom:16px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{background:#071022;padding:13px 14px;border-radius:10px;border:1px solid var(--line);cursor:pointer;transition:transform .12s ease,border-color .12s ease;font-size:14.5px;line-height:1.4}
.choice:hover:not(.locked){transform:translateY(-2px);border-color:var(--accent)}
.choice.locked{cursor:default}
.choice.selected-correct{border-color:var(--good);background:rgba(22,163,74,0.1)}
.choice.selected-wrong{border-color:var(--bad);background:rgba(239,68,68,0.1)}
.choice.reveal-correct{border-color:var(--good);background:rgba(22,163,74,0.06)}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;margin-right:8px}
.tag.good{background:rgba(22,163,74,0.2);color:#4ade80}
.tag.bad{background:rgba(239,68,68,0.2);color:#f87171}
.explain-box{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);color:var(--muted);font-size:13.5px;line-height:1.5}
.controls{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px}
.score-big{font-size:48px;font-weight:800;line-height:1}
.score-sub{color:var(--muted);font-size:14px;margin-top:4px}
.domain-score{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.domain-score:last-child{border-bottom:0}
.review-item{padding:14px 0;border-bottom:1px solid var(--line)}
.review-item:last-child{border-bottom:0}
.review-q{font-weight:700;font-size:14.5px;margin-bottom:8px}
.pill{display:inline-block;background:rgba(6,182,212,0.15);color:var(--accent);font-size:11px;padding:2px 8px;border-radius:999px;margin-bottom:8px}
.hidden{display:none}
a.silent{color:var(--accent);text-decoration:none}
@media(max-width:640px){.score-big{font-size:38px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script id="question-data" type="application/json">[{"id":"q0001","domain":"Hardware and Network Troubleshooting","q":"What is the first step in the CompTIA troubleshooting methodology?","choices":["Establish a theory of probable cause","Document findings","Identify the problem","Test the theory to determine cause"],"correct":2,"explain":"Identifying the problem comes first (ask questions, gather info).","wrongExplain":["Establishing a theory of probable cause is the second step, which only makes sense once the problem itself has been identified.","Documenting findings is the final step in the methodology, done after the issue has been resolved, not before it is even identified.","","Testing the theory happens after a theory has been formed, which itself happens after the problem is identified."],"sub":"5.1"},{"id":"q0002","domain":"Hardware and Network Troubleshooting","q":"Which action is part of 'establish a theory' step?","choices":["Create a baseline","Check for recent changes","Apply a permanent fix","Close ticket"],"correct":1,"explain":"Checking recent changes helps form a theory of cause.","wrongExplain":["Creating a baseline is a performance-monitoring activity used for future comparison, not a way of forming a theory about a current problem.","","Applying a permanent fix belongs to the implement-solution step, which comes only after a theory has been tested and confirmed.","Closing the ticket happens at the very end of the process, well after a cause has been theorized, tested, and fixed."],"sub":"5.1"},{"id":"q0003","domain":"Hardware and Network Troubleshooting","q":"When should you implement a solution to confirm functionality?","choices":["Before establishing theory","After testing in a non-production environment if possible","Without documentation","Only after replacement"],"correct":1,"explain":"Test solutions in a controlled environment before permanent deployment when possible.","wrongExplain":["You cannot meaningfully implement a fix before you even have a theory of what is causing the problem; theory must come first.","","Skipping documentation removes the record of what was tried and found, which undermines both accountability and future troubleshooting.","Many valid fixes (configuration changes, driver updates, settings) don't require replacing any hardware at all, so this isn't a general rule."],"sub":"5.1"},{"id":"q0004","domain":"Hardware and Network Troubleshooting","q":"Which is a non-technical skill important for IT specialists?","choices":["Soldering","Active listening","Overclocking","PCB repair"],"correct":1,"explain":"Active listening is crucial for accurate info gathering and customer service.","wrongExplain":["Soldering is a hands-on physical repair skill involving tools and heat, not an interpersonal or communication skill.","","Overclocking is a technical performance-tuning practice for hardware, unrelated to how a technician communicates with users.","PCB repair is a hardware-level technical skill, not a soft skill used in customer interaction."],"sub":"5.1"},{"id":"q0005","domain":"Hardware and Network Troubleshooting","q":"What does MTTR stand for in troubleshooting metrics?","choices":["Mean Time To Repair","Maximum Time To Respond","Mean Time To Reboot","Minimum Time To Resolve"],"correct":0,"explain":"MTTR = Mean Time To Repair, a reliability metric.","wrongExplain":["","MTTR measures repair duration, not response time, and uses 'Mean' rather than 'Maximum' in its definition.","Rebooting a device is not the same as repairing it, and this is not the standard expansion of the acronym.","The acronym uses 'Mean' (average), not 'Minimum', and refers specifically to repair time, not general resolution."],"sub":"5.1"},{"id":"q0006","domain":"Mobile Devices","q":"If a mobile device won't power on, what's a basic early check?","choices":["Replace screen","Verify battery charge and power button","Reinstall OS","Replace antenna"],"correct":1,"explain":"Always check power/charging before deeper diagnostics.","wrongExplain":["A cracked or malfunctioning screen doesn't prevent a device from powering on, so replacing it wouldn't address this symptom.","","If the device won't power on at all, you cannot even boot into an OS to reinstall it, making this step impossible until power issues are ruled out.","Antenna problems affect signal reception, not the device's ability to power on."],"sub":"1.1"},{"id":"q0007","domain":"Networking","q":"Which wireless standard operates in the 2.4GHz band and is common for mobile hotspots?","choices":["802.11ac","802.11ax","802.11b/g/n","802.11ad"],"correct":2,"explain":"802.11b/g/n operate in 2.4GHz; n can use both 2.4 and 5GHz.","wrongExplain":["802.11ac operates exclusively in the 5GHz band, not 2.4GHz.","802.11ax (Wi-Fi 6) is a newer high-throughput standard primarily associated with 5GHz/6GHz operation, not the classic 2.4GHz standard tested here.","","802.11ad operates in the 60GHz band for very short-range, high-speed links, not the 2.4GHz band."],"sub":"2.3"},{"id":"q0008","domain":"Mobile Devices","q":"What is IMEI used for on mobile devices?","choices":["Identifying device on cellular networks","Encrypting storage","Managing apps","Controlling brightness"],"correct":0,"explain":"IMEI uniquely identifies a cellular device on networks.","wrongExplain":["","The IMEI is simply an identifier number; it plays no role in encrypting data on the device.","App management is handled by the OS and app stores, not by the device's IMEI.","Screen brightness is a display setting unrelated to the hardware identifier used by cellular carriers."],"sub":"1.3"},{"id":"q0009","domain":"Mobile Devices","q":"Which mobile OS is open-source and widely forked by manufacturers?","choices":["iOS","Android","Windows Mobile","BlackBerry OS"],"correct":1,"explain":"Android is based on open-source AOSP and often customized.","wrongExplain":["iOS is Apple's closed-source, proprietary operating system and is not available for other manufacturers to fork.","","Windows Mobile was a proprietary, closed platform from Microsoft and is no longer actively developed.","BlackBerry OS was a proprietary operating system tied specifically to BlackBerry hardware, not an open platform for other vendors."],"sub":"1.1"},{"id":"q0010","domain":"Mobile Devices","q":"What should you do before replacing hardware on a laptop?","choices":["Skip documentation","Back up user data and create recovery media","Immediately power down without notice","Remove warranty stickers"],"correct":1,"explain":"Backup data and prepare recovery media to prevent data loss.","wrongExplain":["Skipping documentation removes the record of what work was planned and performed, which is poor practice before any repair.","","Powering down abruptly and without warning risks data corruption and gives the user no chance to save unsaved work.","Removing warranty stickers can void the manufacturer's warranty and has nothing to do with protecting the user's data."],"sub":"1.1"},{"id":"q0011","domain":"Mobile Devices","q":"Which tool helps view live logs on Android devices for troubleshooting?","choices":["iTunes","ADB (Android Debug Bridge)","Xcode","Device Manager"],"correct":1,"explain":"ADB provides access to logs and shell on Android devices.","wrongExplain":["iTunes is Apple's software for managing and syncing iOS devices; it has no functionality for Android logs.","","Xcode is Apple's development environment for building iOS/macOS apps, not a tool for viewing Android logs.","Device Manager is a Windows utility for managing PC hardware drivers, not Android device logs."],"sub":"1.1"},{"id":"q0012","domain":"Hardware","q":"A user reports slow performance after installing new software. Best initial step?","choices":["Reimage machine","Check resource usage (Task Manager) and recent changes","Replace HDD","Reinstall OS"],"correct":1,"explain":"Check resource usage and recent installs to find cause.","wrongExplain":["Reimaging the machine is an extreme, time-consuming step that wipes the system before simpler causes have even been checked.","","Replacing the HDD assumes a hardware failure without evidence, when the timing points to the newly installed software instead.","Reinstalling the OS is a heavy-handed action that should only be considered after lighter diagnostic steps are exhausted."],"sub":"3.3"},{"id":"q0013","domain":"Mobile Devices","q":"What is a common cause of app crashes on mobile devices?","choices":["Outdated app or OS incompatibility","Broken screen","Bad Wi-Fi cable","Low monitor brightness"],"correct":0,"explain":"Version mismatches and bugs often cause crashes.","wrongExplain":["","A physical display problem doesn't affect the software logic that causes an app to crash.","Mobile devices connect to Wi-Fi wirelessly and don't use a physical Wi-Fi cable, making this option nonsensical.","Screen brightness is a cosmetic display setting with no bearing on application stability."],"sub":"1.3"},{"id":"q0014","domain":"Mobile Devices","q":"Which security technique helps prevent unauthorized access if a mobile device is lost?","choices":["Disable lock screen","Remote wipe and strong authentication","Keep Bluetooth on","Store passwords in plain text"],"correct":1,"explain":"Remote wipe and strong auth protect data on lost devices.","wrongExplain":["Disabling the lock screen removes a basic layer of protection, making unauthorized access easier, not harder.","","Leaving Bluetooth enabled increases the device's attack surface rather than protecting it.","Storing passwords in plain text is a serious security weakness that exposes credentials rather than protecting them."],"sub":"1.3"},{"id":"q0015","domain":"Hardware and Network Troubleshooting","q":"When documenting a troubleshooting session, you should:","choices":["Only save the final result","Record steps taken, findings, and resolution","Erase logs","Only note the time"],"correct":1,"explain":"Complete documentation helps future troubleshooting and auditing.","wrongExplain":["Recording only the final result omits the steps and context that make documentation useful for future reference.","","Erasing logs destroys the very history that documentation is meant to preserve.","Noting only the time provides no useful detail about what actually happened during the session."],"sub":"5.1"},{"id":"q0016","domain":"Hardware and Network Troubleshooting","q":"What does 'isolation' mean in troubleshooting?","choices":["Adding more users","Separating variables to identify cause","Deleting system files","Increasing network speed"],"correct":1,"explain":"Isolate components to determine which causes the issue.","wrongExplain":["Adding more users has nothing to do with narrowing down which component or variable is causing a problem.","","Deleting system files is a destructive action, not a diagnostic technique for isolating a cause.","Increasing network speed is a performance change, not a method of separating variables to find a root cause."],"sub":"5.1"},{"id":"q0017","domain":"Networking","q":"A mobile device connects to Wi‑Fi but has no internet. First check:","choices":["Replace screen","Verify network gateway and DNS settings","Reset display brightness","Update BIOS"],"correct":1,"explain":"Check router/gateway and DNS to confirm upstream connectivity.","wrongExplain":["Replacing the screen is an unrelated hardware fix; a display issue has no effect on network connectivity.","","Resetting display brightness is a cosmetic setting that has no impact on internet access.","Mobile devices don't have a user-accessible BIOS, and firmware updates aren't the appropriate first step for a gateway/DNS issue."],"sub":"2.2"},{"id":"q0018","domain":"Hardware","q":"Which backup method saves only changed blocks since last backup?","choices":["Full backup","Differential backup","Incremental (or block-level incremental)","Manual copy"],"correct":2,"explain":"Incremental backups save changed blocks for efficiency.","wrongExplain":["A full backup copies all data every time, regardless of what has changed, making it far larger than an incremental backup.","A differential backup saves all changes since the last full backup (a cumulative set), not just changes since the most recent backup.","","A manual copy is an ad hoc action performed by a user, not an automated method that tracks changed blocks."],"sub":"3.4"},{"id":"q0019","domain":"Hardware","q":"What is the purpose of a service tag or serial number?","choices":["To identify device for support and warranty","To speed up CPU","To control screen brightness","To encrypt disk"],"correct":0,"explain":"Service tags help vendors identify device model/config for support.","wrongExplain":["","A serial number is just an identifier; it has no effect on CPU performance.","Screen brightness is a display setting, unrelated to a device's identifying serial number.","Disk encryption is a separate security feature and is not the function of a service tag."],"sub":"3.4"},{"id":"q0020","domain":"Mobile Devices","q":"Which mobile network technology offers the highest data rates among these?","choices":["2G","3G","4G LTE","GSM"],"correct":2,"explain":"4G LTE provides high-speed mobile data compared to 3G/2G.","wrongExplain":["2G is the oldest generation listed, offering primarily voice and very basic, slow data service.","3G improved on 2G but still offers significantly lower data rates than 4G LTE.","","GSM is a 2G-era cellular standard, not a high-speed data generation like LTE."],"sub":"1.1"},{"id":"q0021","domain":"Hardware and Network Troubleshooting","q":"Which step should you take if a user's data may be lost during troubleshooting?","choices":["Proceed without warning","Back up the data and get consent","Ignore backups","Replace hardware immediately"],"correct":1,"explain":"Always back up and inform the user before risky actions.","wrongExplain":["Proceeding without warning risks data loss and denies the user a chance to consent to a risky action.","","Ignoring backups leaves the user's data unprotected against the exact risk the scenario describes.","Jumping straight to hardware replacement is premature and does nothing to protect the user's existing data first."],"sub":"5.1"},{"id":"q0022","domain":"Mobile Devices","q":"A tablet's touchscreen is unresponsive. Which is a reasonable first step?","choices":["Replace touchscreen","Restart the device and check for debris or screen protectors","Reflash firmware","Replace battery"],"correct":1,"explain":"Soft reset and physical inspection are non-invasive first steps.","wrongExplain":["Replacing the touchscreen is an invasive, costly repair that should only be considered after simpler checks are ruled out.","","Reflashing firmware is a more advanced and risky procedure that isn't warranted before basic troubleshooting is attempted.","Battery replacement addresses power/runtime problems, not touch input responsiveness."],"sub":"1.1"},{"id":"q0023","domain":"Hardware and Network Troubleshooting","q":"What does escalation mean in IT support?","choices":["Closing the ticket","Handing issue to higher-level support or vendor","Ignoring user","Formatting drive"],"correct":1,"explain":"Escalation routes complex issues to more experienced teams.","wrongExplain":["Closing the ticket implies the issue is resolved, which is the opposite of escalating an unresolved problem.","","Ignoring the user is poor practice and is not what escalation means; escalation actively seeks additional help.","Formatting a drive is a destructive technical action unrelated to routing an issue to another support tier."],"sub":"5.1"},{"id":"q0024","domain":"Mobile Devices","q":"Which battery maintenance tip improves mobile device longevity?","choices":["Keep battery at 100% constantly","Avoid extreme temperatures and use proper charging habits","Fully discharge daily","Use only unbranded chargers"],"correct":1,"explain":"Avoid extremes and follow recommended charging practices.","wrongExplain":["Keeping a lithium battery constantly at 100% charge accelerates chemical wear and shortens its usable lifespan.","","Regularly fully discharging a lithium battery stresses the cells and degrades capacity faster over time.","Uncertified, unbranded chargers can deliver inconsistent power and potentially damage the battery or device."],"sub":"1.1"},{"id":"q0025","domain":"Hardware","q":"What is a common symptom of insufficient RAM on a workstation?","choices":["Excessive paging and slow multitasking","Faster boot times","Brighter monitor","No network"],"correct":0,"explain":"Low RAM causes swapping and degraded performance.","wrongExplain":["","Insufficient RAM degrades performance and typically slows boot times rather than speeding them up.","RAM capacity has no relationship to monitor brightness.","Insufficient RAM does not directly disconnect a system from the network; that is unrelated to memory availability."],"sub":"3.2"},{"id":"q0026","domain":"Hardware and Network Troubleshooting","q":"When troubleshooting intermittent problems, a useful approach is to:","choices":["Wait for it to stop","Attempt to reproduce the issue and capture logs during occurrence","Reset to factory defaults immediately","Replace all hardware"],"correct":1,"explain":"Reproducing and logging helps identify intermittent causes.","wrongExplain":["Simply waiting is a passive approach that does nothing to help diagnose the underlying cause.","","Resetting to factory defaults immediately is overly drastic and erases configuration and data before the cause is even understood.","Replacing all hardware is costly and unfocused, and doesn't confirm which component, if any, is actually at fault."],"sub":"5.1"},{"id":"q0027","domain":"Networking","q":"Which protocol is commonly used to sync email on mobile devices?","choices":["FTP","SMTP/IMAP/POP (IMAP is common for sync)","SSH","SNMP"],"correct":1,"explain":"IMAP is used for syncing mail; SMTP handles sending.","wrongExplain":["FTP is used for transferring files between systems, not for syncing email messages.","","SSH provides secure remote command-line access to systems and has no role in email retrieval or sync.","SNMP is used to monitor and manage network devices, not to synchronize email."],"sub":"2.1"},{"id":"q0028","domain":"Mobile Devices","q":"What should you verify when a mobile device cannot send MMS?","choices":["Screen resolution","Cellular data and APN settings","Battery health","Bluetooth pairing"],"correct":1,"explain":"MMS requires cellular data and correct APN configuration.","wrongExplain":["Screen resolution is a display characteristic and has no bearing on whether MMS messages can be sent.","","Battery health affects charging and runtime, not the ability to establish a cellular data connection for MMS.","Bluetooth handles short-range device pairing, which is unrelated to cellular MMS transmission."],"sub":"1.3"},{"id":"q0029","domain":"Mobile Devices","q":"A peer-to-peer connectivity issue between phones (e.g., AirDrop) — first step?","choices":["Replace device","Check Bluetooth/Wi-Fi and visibility settings","Update BIOS","Replace SIM"],"correct":1,"explain":"These services require wireless radios and visibility enabled.","wrongExplain":["Replacing the device is an extreme step that skips checking simple wireless and visibility settings first.","","Mobile devices don't have a user-facing BIOS, and this wouldn't resolve a Bluetooth/Wi-Fi visibility problem.","The SIM card handles cellular carrier service, not Bluetooth or Wi-Fi peer-to-peer transfers."],"sub":"1.3"},{"id":"q0030","domain":"Hardware and Network Troubleshooting","q":"Which action is part of 'implement the solution' in methodology?","choices":["Document only","Apply the fix and verify operation","Escalate without trying","Delete user account"],"correct":1,"explain":"Apply the fix, then test to ensure issue resolved.","wrongExplain":["Documentation is a separate, later step in the methodology, not the act of implementing a solution itself.","","Escalating without attempting a fix skips implementation entirely, which contradicts this step of the methodology.","Deleting a user account is a destructive, unrelated action that isn't part of applying and verifying a fix."],"sub":"5.1"},{"id":"q0031","domain":"Hardware and Network Troubleshooting","q":"Why is maintaining a knowledge base important?","choices":["To store music","To preserve tribal knowledge and speed future fixes","To slow down support","To encrypt data"],"correct":1,"explain":"Knowledge bases capture solutions for reuse and training.","wrongExplain":["Storing music is an unrelated personal use case, not the purpose of an IT knowledge base.","","A knowledge base is meant to speed up support by reusing known solutions, the opposite of slowing it down.","A knowledge base is a documentation repository, not a security or encryption tool."],"sub":"5.1"},{"id":"q0032","domain":"Mobile Devices","q":"If a mobile device overheats, what should you advise the user to do first?","choices":["Place in freezer","Close apps, remove case, stop charging, and move to cool area","Update firmware","Replace battery immediately"],"correct":1,"explain":"Non-invasive steps reduce heat safely.","wrongExplain":["Placing a device in a freezer causes extreme temperature shock and condensation that can damage internal components.","","Updating firmware won't provide immediate relief from physical overheating and isn't the first response.","Replacing the battery immediately is a drastic, premature step before trying simple cooling measures first."],"sub":"1.1"},{"id":"q0033","domain":"Mobile Devices","q":"Which mobile troubleshooting tool can provide battery health and usage data on iOS?","choices":["Android Studio","iTunes","iOS Settings battery section","Task Manager"],"correct":2,"explain":"iOS Settings show battery usage and health metrics.","wrongExplain":["Android Studio is a development tool for building Android apps and has no access to iOS battery data.","iTunes is mainly used for media syncing and device backups, not for viewing detailed on-device battery health metrics.","","Task Manager is a Windows utility for monitoring PC processes and is not available on iOS devices."],"sub":"1.1"},{"id":"q0034","domain":"Hardware and Network Troubleshooting","q":"Final step in troubleshooting methodology after verifying resolution is:","choices":["Document findings and close the ticket","Ignore the issue","Reopen the ticket","Replace hardware"],"correct":0,"explain":"Documenting and closing the loop is essential for records and learning.","wrongExplain":["","Ignoring the issue contradicts proper resolution and leaves the problem effectively unaddressed.","Reopening the ticket is only appropriate if the issue recurs, not as the standard final step after verified resolution.","Replacing hardware, if needed, would have happened earlier in the implementation step, not as the final closing action."],"sub":"5.1"},{"id":"q0035","domain":"Hardware","q":"Which storage device uses magnetic platters?","choices":["SSD","HDD","NVMe","Flash drive"],"correct":1,"explain":"Hard disk drives (HDDs) store data on spinning magnetic platters, unlike SSDs which use flash memory.","wrongExplain":["SSDs store data in flash memory chips with no spinning platters involved.","","NVMe is an interface/protocol used to connect flash-based SSDs, not a storage medium with magnetic platters.","Flash drives use solid-state flash memory, not magnetic platters."],"sub":"3.3"},{"id":"q0036","domain":"Hardware","q":"Which storage type has no moving parts?","choices":["HDD","SSD","Tape drive","Optical disc"],"correct":1,"explain":"Solid-state drives (SSDs) use flash memory and have no moving parts, improving durability and performance.","wrongExplain":["HDDs contain spinning magnetic platters and a moving read/write head, both mechanical moving parts.","","Tape drives use reels and a moving tape mechanism to read and write data.","Optical discs rely on a spinning disc and a moving laser assembly to read data."],"sub":"3.3"},{"id":"q0037","domain":"Hardware","q":"Which interface provides the fastest performance for SSDs?","choices":["SATA","NVMe (PCIe)","IDE","SCSI"],"correct":1,"explain":"NVMe over PCIe offers much higher throughput and lower latency than SATA-based SSDs.","wrongExplain":["SATA has a much lower bandwidth ceiling than PCIe-based NVMe, limiting SSD performance.","","IDE is an older, much slower parallel interface that is largely obsolete for modern storage.","SCSI is used in some other storage contexts but is slower than modern NVMe for SSD performance."],"sub":"3.3"},{"id":"q0038","domain":"Hardware","q":"Which optical disc holds the largest capacity?","choices":["CD","DVD","Blu-ray","CD-RW"],"correct":2,"explain":"Blu-ray discs support significantly higher capacities than CDs or DVDs, making them ideal for HD content.","wrongExplain":["A standard CD holds around 700MB, the smallest capacity of the options listed.","A DVD holds more than a CD but far less than Blu-ray (roughly 4.7GB single-layer versus 25GB+ for Blu-ray).","","CD-RW is simply a rewritable variant of a CD and shares the same low capacity as standard CDs."],"sub":"3.4"},{"id":"q0039","domain":"Hardware","q":"Which RAID level provides mirroring?","choices":["RAID 0","RAID 1","RAID 5","RAID 10"],"correct":1,"explain":"RAID 1 mirrors data across two or more drives, providing redundancy if one drive fails.","wrongExplain":["RAID 0 stripes data across drives to boost performance but provides no redundancy or mirroring at all.","","RAID 5 uses striping with distributed parity for redundancy, not simple drive mirroring.","RAID 10 combines mirroring and striping, but the pure mirroring level being asked about is RAID 1."],"sub":"3.3"},{"id":"q0040","domain":"Hardware","q":"Which RAID level provides striping with parity?","choices":["RAID 0","RAID 1","RAID 5","RAID 6"],"correct":2,"explain":"RAID 5 stripes data with distributed parity, allowing recovery from a single drive failure.","wrongExplain":["RAID 0 provides striping only, with no parity or redundancy.","RAID 1 provides mirroring, not striping with parity.","","RAID 6 uses striping with double distributed parity, tolerating two drive failures, which is different from the single-parity RAID 5."],"sub":"3.3"},{"id":"q0041","domain":"Hardware","q":"Which storage device is sequential access only?","choices":["HDD","SSD","Tape drive","Blu-ray"],"correct":2,"explain":"Tape drives are sequential access devices, meaning data must be read in order along the tape.","wrongExplain":["An HDD's read/write head can move directly to any location on the platters, allowing random access, not sequential-only access.","SSDs use flash memory that allows random access to any data location almost instantly.","","Optical discs like Blu-ray allow the laser to jump to different points on the disc, enabling random access rather than strictly sequential reading."],"sub":"3.3"},{"id":"q0042","domain":"Hardware","q":"Which connector is used for external SATA drives?","choices":["eSATA","USB-C","FireWire","Thunderbolt"],"correct":0,"explain":"eSATA is the external version of SATA, designed specifically for external SATA storage devices.","wrongExplain":["","USB-C is a general-purpose connector used across many device types and is not specifically the external form of SATA.","FireWire is a legacy Apple-developed interface unrelated to the SATA standard.","Thunderbolt is a general high-speed interface, not one built specifically as an external extension of SATA."],"sub":"3.3"},{"id":"q0043","domain":"Hardware","q":"Which storage type is most common in enterprise servers for speed?","choices":["NVMe SSD","Tape drive","Optical disc","Floppy disk"],"correct":0,"explain":"NVMe SSDs provide very high I/O performance and are widely used in modern enterprise servers.","wrongExplain":["","Tape drives are used for archival and backup purposes and are far too slow for high-performance server storage needs.","Optical discs have very low capacity and speed, making them unsuitable for enterprise server storage.","Floppy disks are obsolete, extremely low-capacity media entirely unsuited to server workloads."],"sub":"3.3"},{"id":"q0044","domain":"Hardware","q":"Which storage device uses laser technology?","choices":["HDD","SSD","Optical disc","Tape drive"],"correct":2,"explain":"Optical discs such as CDs, DVDs, and Blu-ray use lasers to read and write data.","wrongExplain":["HDDs use magnetic read/write heads to access data on spinning platters, not lasers.","SSDs use flash memory chips accessed electrically, with no laser involved.","","Tape drives read and write using magnetic heads on the tape, not laser technology."],"sub":"3.3"},{"id":"q0045","domain":"Hardware","q":"Which type of memory is volatile?","choices":["ROM","RAM","Flash","SSD"],"correct":1,"explain":"RAM is volatile memory, meaning its contents are lost when power is removed.","wrongExplain":["ROM is non-volatile and retains its stored data even without power.","","Flash memory is non-volatile, keeping its contents intact when power is removed.","SSDs use non-volatile flash storage, so data persists after the power is cut."],"sub":"3.3"},{"id":"q0046","domain":"Hardware","q":"Which memory type is used for BIOS firmware?","choices":["DRAM","SRAM","ROM/Flash","DDR"],"correct":2,"explain":"BIOS/UEFI firmware is stored in non-volatile ROM or flash memory so it persists without power.","wrongExplain":["DRAM is volatile memory used for general system RAM, not for storing persistent firmware.","SRAM is volatile, fast memory typically used for CPU cache, not for storing firmware that must survive power loss.","","DDR is a type of volatile DRAM used as system main memory, not a medium for storing persistent firmware."],"sub":"3.4"},{"id":"q0047","domain":"Hardware","q":"Which memory type is faster but more expensive?","choices":["DRAM","SRAM","DDR","VRAM"],"correct":1,"explain":"SRAM is faster and more expensive than DRAM and is commonly used for cache memory.","wrongExplain":["DRAM is slower and cheaper than SRAM, and it requires periodic refresh cycles that SRAM does not need.","","DDR is a type of DRAM used as general system memory, not the faster, pricier cache-oriented memory being described here.","VRAM is specialized memory optimized for graphics bandwidth, not generally characterized as the faster/pricier cache alternative to DRAM in this comparison."],"sub":"3.4"},{"id":"q0048","domain":"Hardware","q":"Which DDR version has the highest transfer rate?","choices":["DDR2","DDR3","DDR4","DDR5"],"correct":3,"explain":"DDR5 is the latest generation in the list and offers the highest transfer rates.","wrongExplain":["DDR2 is the oldest generation listed and has much lower transfer rates than DDR5.","DDR3 improved on DDR2 but is still significantly slower than DDR4 and DDR5.","DDR4 is faster than DDR3 but has a lower maximum transfer rate than DDR5.",""],"sub":"3.2"},{"id":"q0049","domain":"Hardware","q":"Which memory type is used in graphics cards?","choices":["VRAM","DRAM","SRAM","ROM"],"correct":0,"explain":"Graphics cards use specialized video RAM (VRAM) optimized for high-bandwidth graphics operations.","wrongExplain":["","DRAM is standard system memory and isn't optimized for the high-bandwidth needs of a graphics card.","SRAM is mainly used for small, fast cache memory, not as the primary memory on a graphics card.","ROM stores non-volatile firmware and isn't used as working memory for rendering graphics."],"sub":"3.2"},{"id":"q0050","domain":"Hardware","q":"Which memory type requires refresh cycles?","choices":["SRAM","DRAM","ROM","Flash"],"correct":1,"explain":"DRAM cells must be periodically refreshed to maintain their stored bits, unlike SRAM.","wrongExplain":["SRAM uses flip-flop circuits that hold their state without needing periodic refreshing, unlike DRAM.","","ROM is non-volatile and doesn't store data as a dynamically decaying charge, so it needs no refresh cycles.","Flash memory is non-volatile and retains its data without requiring periodic refresh cycles."],"sub":"3.4"},{"id":"q0051","domain":"Hardware","q":"Which memory type is non-volatile?","choices":["DRAM","SRAM","ROM","DDR"],"correct":2,"explain":"ROM is non-volatile, retaining its contents even when power is removed.","wrongExplain":["DRAM is volatile memory that loses its contents and requires constant refreshing to retain data while powered.","SRAM is volatile memory that loses its stored data as soon as power is removed.","","DDR is a type of volatile DRAM used as system memory, not persistent, non-volatile storage."],"sub":"3.4"},{"id":"q0052","domain":"Mobile Devices","q":"Which memory module is used in laptops?","choices":["DIMM","SODIMM","SIMM","VRAM"],"correct":1,"explain":"Laptops typically use smaller SODIMM modules due to space constraints.","wrongExplain":["DIMM is the full-size desktop memory module and is too large to fit in a laptop's chassis.","","SIMM is an obsolete single inline memory module used in very old desktop systems, not in laptops.","VRAM refers to memory dedicated to a graphics card's frame buffer, not the system RAM module type used in laptops."],"sub":"1.1"},{"id":"q0053","domain":"Hardware","q":"Which memory type is used for cache?","choices":["DRAM","SRAM","ROM","Flash"],"correct":1,"explain":"CPU cache is built from SRAM because of its very low latency and high speed.","wrongExplain":["DRAM is slower and requires constant refreshing, making it suitable for main system memory rather than cache.","","ROM is read-only and used to store firmware, not for the fast read/write access cache requires.","Flash memory is non-volatile storage used in devices like SSDs and USB drives, far too slow for CPU cache."],"sub":"3.4"},{"id":"q0054","domain":"Hardware","q":"Which memory type is embedded in CPUs for speed?","choices":["L1/L2 Cache (SRAM)","DRAM","ROM","Flash"],"correct":0,"explain":"L1 and L2 caches are SRAM-based and integrated into the CPU for extremely fast access.","wrongExplain":["","DRAM is the system's main memory, mounted on modules outside the CPU die, not embedded cache.","ROM stores firmware for initialization, not fast-access data used by the processor during execution.","Flash is non-volatile storage used for things like BIOS chips or drives, not embedded CPU cache."],"sub":"3.4"},{"id":"q0055","domain":"Hardware","q":"Which connector was used for older hard drives before SATA?","choices":["IDE/PATA","SCSI","USB","NVMe"],"correct":0,"explain":"IDE/PATA ribbon cables were used for older parallel ATA hard drives before SATA became standard.","wrongExplain":["","SCSI was mainly used in servers and workstations for internal/external drive chains, not the mainstream consumer HDD interface before SATA.","USB is an external peripheral interface and was not the internal drive connector that SATA replaced.","NVMe is a modern high-speed protocol for SSDs that came after SATA, not a predecessor to it."],"sub":"3.3"},{"id":"q0056","domain":"Hardware","q":"Which connector was used for older printers?","choices":["Parallel (DB-25)","Serial (DB-9)","USB","RJ-45"],"correct":0,"explain":"Legacy printers often used a DB-25 parallel port connection.","wrongExplain":["","Serial DB-9 ports were commonly used for devices like mice and modems, not the standard printer connection.","USB became the common printer connector only after the legacy parallel port era this question refers to.","RJ-45 is a networking connector used for Ethernet, not a local printer cable connector."],"sub":"3.1"},{"id":"q0057","domain":"Hardware","q":"Which connector was used for older mice/keyboards?","choices":["PS/2","USB","Serial","RJ-11"],"correct":0,"explain":"PS/2 round connectors were commonly used for older mice and keyboards.","wrongExplain":["","USB later replaced PS/2 as the standard, so it is not the legacy connector being described.","Serial ports were used by some very early mice, but PS/2 became the dedicated standard connector for mice and keyboards.","RJ-11 is a telephone line connector and was never used for mice or keyboards."],"sub":"3.1"},{"id":"q0058","domain":"Networking","q":"Which connector was used for dial-up modems?","choices":["RJ-45","RJ-11","USB","Coax"],"correct":1,"explain":"Dial-up modems used RJ-11 telephone connectors for analog phone lines.","wrongExplain":["RJ-45 is a larger connector used for Ethernet networking, not analog telephone lines.","","USB is a general peripheral data interface and was not used to connect a modem to the phone line itself.","Coax is used for cable broadband or TV signal, not for standard analog telephone dial-up connections."],"sub":"2.6"},{"id":"q0059","domain":"Hardware","q":"Which connector was used for older SCSI devices?","choices":["50-pin Centronics","SATA","USB-C","HDMI"],"correct":0,"explain":"Older SCSI devices often used 50-pin Centronics-style connectors.","wrongExplain":["","SATA is a later, serial storage interface unrelated to the older parallel SCSI connector style.","USB-C is a modern connector and far too recent to have been used with legacy SCSI devices.","HDMI is a digital video interface, not a data storage connector used by SCSI devices."],"sub":"3.3"},{"id":"q0060","domain":"Hardware","q":"Which connector was used for older VGA monitors?","choices":["DB-15","HDMI","DisplayPort","DVI"],"correct":0,"explain":"VGA monitors used a 15-pin D-sub (DB-15) connector for analog video.","wrongExplain":["","HDMI is a digital interface used by modern displays, not the analog connector used by VGA monitors.","DisplayPort is a modern digital display standard and was not used with legacy VGA monitors.","DVI came after VGA and can carry a digital signal, so it is not the connector found on classic VGA monitors."],"sub":"3.1"},{"id":"q0061","domain":"Hardware","q":"Which connector was used for older audio devices?","choices":["3.5mm TRS","RCA","Optical TOSLINK","USB"],"correct":1,"explain":"RCA connectors were widely used for analog audio and composite video connections.","wrongExplain":["3.5mm TRS is a common headphone/line jack, but it is not the classic connector used for composite audio/video device connections referenced here.","","TOSLINK is a digital optical audio connector, distinct from the analog connectors traditionally used on older audio equipment.","USB is a digital data interface, not an analog audio/video connector used by legacy audio devices."],"sub":"3.1"},{"id":"q0062","domain":"Hardware","q":"Which connector was used for older serial communication?","choices":["DB-9","DB-25","RJ-45","USB"],"correct":0,"explain":"DB-9 connectors were common for RS-232 serial communication on PCs.","wrongExplain":["","DB-25 was an earlier, larger connector also used for serial/parallel signaling, but DB-9 became the more common PC serial port.","RJ-45 is used for networking, not RS-232 serial communication.","USB replaced serial ports over time and is not the classic RS-232 serial connector."],"sub":"3.1"},{"id":"q0063","domain":"Hardware","q":"Which connector was used for older floppy drives?","choices":["34-pin ribbon cable","SATA","USB","RJ-11"],"correct":0,"explain":"Floppy drives used a 34-pin ribbon cable for data connection.","wrongExplain":["","SATA is a modern thin serial cable used for hard drives and optical drives, not floppy drives.","USB is an external interface; floppy drives connected internally via ribbon cable, not USB.","RJ-11 is a phone line connector and has no relation to floppy drive data cabling."],"sub":"3.3"},{"id":"q0064","domain":"Hardware","q":"Which connector was used for older parallel ATA drives?","choices":["40-pin ribbon cable","SATA","USB","RJ-45"],"correct":0,"explain":"Parallel ATA (PATA) hard drives used a 40-pin ribbon cable.","wrongExplain":["","SATA is the modern serial interface that eventually replaced PATA's ribbon cable design.","USB is an external peripheral interface, not the internal parallel ATA data cable.","RJ-45 is a networking connector and is unrelated to ATA drive data cabling."],"sub":"3.3"},{"id":"q0065","domain":"Networking","q":"Which connector was used for older coaxial networking?","choices":["BNC","RJ-45","RJ-11","USB"],"correct":0,"explain":"10BASE2 and similar coaxial Ethernet used BNC connectors.","wrongExplain":["","RJ-45 is used for twisted-pair Ethernet (like 10BASE-T and later), not coaxial cabling.","RJ-11 is a telephone connector and was never used for coaxial network cabling.","USB is unrelated to legacy coaxial Ethernet networking."],"sub":"2.6"},{"id":"q0066","domain":"Hardware","q":"Which connector was used for older Apple devices?","choices":["FireWire (IEEE 1394)","USB-C","Lightning","Thunderbolt"],"correct":0,"explain":"FireWire (IEEE 1394) was widely used on older Apple systems for high-speed peripherals.","wrongExplain":["","USB-C is a modern connector found on current Apple devices, not the legacy high-speed peripheral interface referenced here.","Lightning is Apple's proprietary connector for iPhones and iPads, not a general peripheral bus used on older Macs.","Thunderbolt is a newer, faster successor technology, not the original legacy connector described here."],"sub":"3.1"},{"id":"q0067","domain":"Hardware","q":"Which connector was used for older game controllers?","choices":["DA-15 (Game port)","USB","RJ-45","PS/2"],"correct":0,"explain":"Legacy game controllers often used a 15-pin DA-15 game port on sound cards.","wrongExplain":["","USB later replaced the dedicated game port, so it is not the legacy connector in question.","RJ-45 is a network connector and was never used for game controllers.","PS/2 was used for mice and keyboards, not game controllers."],"sub":"3.1"},{"id":"q0068","domain":"Networking","q":"Which connector was used for older networking hubs?","choices":["RJ-45","BNC","RJ-11","USB"],"correct":0,"explain":"Older Ethernet hubs typically used RJ-45 connectors for twisted-pair cabling.","wrongExplain":["","BNC connectors were used for coaxial Ethernet (10BASE2), not twisted-pair hub connections.","RJ-11 is a smaller phone line connector and is not compatible with Ethernet hub ports.","USB is not used for connecting devices to an Ethernet hub."],"sub":"2.6"},{"id":"q0069","domain":"Hardware","q":"Which connector was used for older TV connections?","choices":["Coaxial (F-type)","HDMI","RCA","DisplayPort"],"correct":0,"explain":"Traditional TV connections commonly used F-type coaxial connectors for antenna or cable input.","wrongExplain":["","HDMI is a modern digital audio/video interface, not the traditional antenna/cable feed connector.","RCA connectors carried composite audio/video signals, not the threaded coax connector used for antenna or cable input.","DisplayPort is a modern computer display standard and is unrelated to legacy TV antenna/cable connections."],"sub":"3.1"},{"id":"q0070","domain":"Hardware","q":"What component on the motherboard holds the CPU?","choices":["PCIe slot","CPU socket","RAM slot","SATA port"],"correct":1,"explain":"The CPU socket is the physical interface where the processor is installed.","wrongExplain":["A PCIe slot holds expansion cards such as graphics or capture cards, not the processor.","","A RAM slot holds memory modules, not the processor.","A SATA port connects storage drives, not the CPU."],"sub":"3.4"},{"id":"q0071","domain":"Hardware","q":"Which chipset component traditionally handled lower-speed I/O (older architecture)?","choices":["Northbridge","Southbridge","VRM","BIOS chip"],"correct":1,"explain":"The southbridge managed lower-speed peripherals in older two-chip chipset designs.","wrongExplain":["The northbridge handled high-speed communication with the CPU, RAM, and graphics, not lower-speed I/O.","","The VRM regulates voltage delivered to the CPU; it is not a chipset I/O component.","The BIOS chip stores firmware code; it does not manage peripheral I/O traffic."],"sub":"3.4"},{"id":"q0072","domain":"Hardware","q":"What does BIOS stand for?","choices":["Basic Input/Output System","Binary Internal Operating System","Basic Internal Output System","Base IO Sequence"],"correct":0,"explain":"BIOS stands for Basic Input/Output System and provides firmware-level initialization.","wrongExplain":["","\"Binary Internal Operating System\" is not a real expansion of the BIOS acronym.","This phrase misstates the acronym; BIOS handles both input and output, not just output.","\"Base IO Sequence\" is not what the BIOS acronym stands for."],"sub":"3.4"},{"id":"q0073","domain":"Hardware","q":"What is UEFI primarily used for?","choices":["Providing a modern firmware interface and boot services","Cooling the CPU","Routing network packets","Rendering graphics"],"correct":0,"explain":"UEFI replaces legacy BIOS, offering modern features like GUI menus and GPT support.","wrongExplain":["","Cooling the CPU is handled by fans, heatsinks, or liquid cooling, not by firmware.","Routing network packets is a function of routers and switches, not motherboard firmware.","Rendering graphics is handled by the GPU, not by UEFI firmware."],"sub":"3.4"},{"id":"q0074","domain":"Hardware","q":"Which slot is commonly used for modern discrete graphics cards?","choices":["PCIe x16","AGP","PCI","ISA"],"correct":0,"explain":"PCI Express x16 is the standard slot for modern GPUs.","wrongExplain":["","AGP was a legacy single-purpose graphics slot that has been replaced by PCIe on modern boards.","PCI is an older, much slower general-purpose expansion slot, not used for modern GPUs.","ISA is a very old legacy slot, far too slow and obsolete for graphics cards."],"sub":"3.4"},{"id":"q0075","domain":"Hardware","q":"What does CMOS battery keep powered when the PC is off?","choices":["CPU cores","BIOS settings and real-time clock","RAM contents","GPU firmware"],"correct":1,"explain":"The CMOS battery preserves BIOS/UEFI settings and the real-time clock when the system is powered off.","wrongExplain":["CPU cores hold no state when powered off; the CMOS battery does not keep them running.","","RAM is volatile and loses its contents immediately without power; the CMOS battery does not preserve RAM.","GPU firmware is stored in its own non-volatile memory and does not depend on the motherboard's CMOS battery."],"sub":"3.4"},{"id":"q0076","domain":"Hardware","q":"What is the purpose of the motherboard's VRM?","choices":["Regulate and deliver power to the CPU","Store BIOS settings","Control fan speed","Manage SATA ports"],"correct":0,"explain":"VRMs convert PSU power to the voltages the CPU and other components need.","wrongExplain":["","Storing BIOS settings is the role of the CMOS/NVRAM chip, not the VRM.","Fan speed is controlled through motherboard fan headers and firmware, not the VRM.","SATA ports are managed by the chipset, not the VRM."],"sub":"3.5"},{"id":"q0077","domain":"Hardware","q":"Which socket type is associated with many AMD mainstream desktop CPUs (recent generations)?","choices":["LGA 1151","AM4","LGA 1700","TR4"],"correct":1,"explain":"AM4 is AMD's mainstream socket for many Ryzen generations.","wrongExplain":["LGA 1151 is an Intel socket used with Intel Core processors, not AMD.","","LGA 1700 is Intel's socket for recent Core desktop CPUs, not AMD.","TR4 is AMD's socket for high-end desktop Threadripper CPUs, not mainstream Ryzen chips."],"sub":"3.4"},{"id":"q0078","domain":"Hardware","q":"What is POST?","choices":["Power-On Self Test — hardware checks at boot","Primary Output Sequence","Peripheral Operating System Test","Power Off Suspend Test"],"correct":0,"explain":"POST runs hardware checks and initializations during system startup.","wrongExplain":["","\"Primary Output Sequence\" is not a real term and does not describe what POST does.","\"Peripheral Operating System Test\" is not what POST stands for.","\"Power Off Suspend Test\" is incorrect; POST runs during startup, not power-off or suspend."],"sub":"3.4"},{"id":"q0079","domain":"Hardware","q":"Which BIOS/UEFI feature helps prevent unsigned OS loaders from booting?","choices":["Fast Boot","Secure Boot","VT-x","XMP"],"correct":1,"explain":"Secure Boot verifies signatures to block unauthorized bootloaders.","wrongExplain":["Fast Boot speeds up startup by skipping certain checks; it does not verify bootloader signatures.","","VT-x is Intel's hardware virtualization extension and is unrelated to boot loader signature verification.","XMP is a memory overclocking profile feature and has nothing to do with boot security."],"sub":"3.4"},{"id":"q0080","domain":"Hardware","q":"Which CPU feature lets a core handle two threads simultaneously (Intel branding)?","choices":["Turbo Boost","Hyper-Threading","Cool'n'Quiet","SpeedStep"],"correct":1,"explain":"Hyper-Threading exposes logical cores to the OS, allowing simultaneous multithreading.","wrongExplain":["Turbo Boost dynamically increases clock speed; it does not create additional logical threads per core.","","Cool'n'Quiet is AMD's power-saving technology, not an Intel simultaneous multithreading feature.","SpeedStep is Intel's dynamic frequency and power scaling feature, not a multithreading technology."],"sub":"3.4"},{"id":"q0081","domain":"Hardware","q":"What is the smallest and fastest level of CPU cache?","choices":["L3","L2","L1","L4"],"correct":2,"explain":"L1 cache is closest to the core and is the smallest and fastest.","wrongExplain":["L3 cache is the largest and slowest of the common CPU cache levels, not the smallest/fastest.","L2 is larger and slower than L1, even though it is faster than L3.","","L4 cache, when present, is larger and slower than L1, not the smallest or fastest level."],"sub":"3.4"},{"id":"q0082","domain":"Hardware","q":"If upgrading a CPU, what is essential to check for compatibility?","choices":["Case color","CPU socket type and supported chipset/BIOS","Monitor size","Keyboard layout"],"correct":1,"explain":"CPU socket type and chipset/BIOS compatibility determine whether a CPU will work on a board.","wrongExplain":["Case color is purely cosmetic and has no effect on CPU compatibility.","","Monitor size is unrelated to whether a CPU is electrically and physically compatible with a motherboard.","Keyboard layout has no bearing on CPU or socket compatibility."],"sub":"3.4"},{"id":"q0083","domain":"Hardware","q":"What does \"flashing the BIOS\" mean?","choices":["Updating the motherboard firmware stored in flash memory","Replacing the CMOS battery","Removing the BIOS chip","Formatting the boot drive"],"correct":0,"explain":"Flashing updates firmware to add features or CPU support or fix bugs.","wrongExplain":["","Replacing the CMOS battery is a physical battery swap, not a firmware update.","Physically removing the BIOS chip does not update its firmware; it's an unrelated hardware action.","Formatting the boot drive erases stored data and is unrelated to updating motherboard firmware."],"sub":"3.4"},{"id":"q0084","domain":"Hardware","q":"Which UEFI capability supports large drives and modern partitioning?","choices":["MBR","GPT","FAT16","NTFS"],"correct":1,"explain":"GPT allows drives >2TB and more partitions; UEFI supports GPT.","wrongExplain":["MBR is the older partitioning scheme limited to smaller drive sizes and fewer primary partitions.","","FAT16 is a legacy file system with severe size limitations, not a modern partitioning scheme for large drives.","NTFS is a file system, not a partition table type like GPT."],"sub":"3.4"},{"id":"q0085","domain":"Hardware","q":"What does the motherboard form factor describe?","choices":["CPU frequency","Physical dimensions, mounting points and I/O layout","Amount of RAM","GPU power"],"correct":1,"explain":"Form factor (ATX, micro-ATX, Mini-ITX) defines size and connector placement.","wrongExplain":["CPU frequency is a processor performance spec, unrelated to the board's physical size or layout.","","RAM capacity is determined by the installed memory modules, not by the motherboard's form factor.","GPU power draw is a graphics card specification, unrelated to motherboard form factor."],"sub":"3.4"},{"id":"q0086","domain":"Hardware","q":"Which connector provides the main 24-pin power to the motherboard?","choices":["Molex 4-pin","ATX 24-pin","EPS 8-pin","SATA power"],"correct":1,"explain":"The ATX 24-pin is the main power connector from the PSU to the motherboard.","wrongExplain":["Molex connectors power older peripherals like fans or drives, not the motherboard's main power input.","","EPS 8-pin supplies supplemental power specifically to the CPU, not the motherboard's main connector.","SATA power connectors feed storage drives, not the motherboard itself."],"sub":"3.5"},{"id":"q0087","domain":"Hardware","q":"Which BIOS setting would you change to set boot order?","choices":["Boot Priority/Boot Order","CPU multiplier","Memory timings","Fan curve"],"correct":0,"explain":"Boot order determines which device the firmware attempts to boot from first.","wrongExplain":["","CPU multiplier affects clock speed/overclocking, not which device the system boots from.","Memory timings affect RAM performance, not the sequence of boot devices.","Fan curve controls cooling fan behavior, not the boot device order."],"sub":"3.4"},{"id":"q0088","domain":"Hardware","q":"What does \"thermal throttling\" do?","choices":["Increase CPU speed when cool","Reduce CPU speed to avoid overheating","Reset BIOS","Improve graphics quality"],"correct":1,"explain":"Thermal throttling lowers clock speeds to reduce temperature and prevent damage.","wrongExplain":["This describes Turbo Boost behavior, which is essentially the opposite of thermal throttling.","","Thermal throttling adjusts clock speed; it does not reset firmware settings.","Throttling reduces performance to manage heat and does not directly affect graphics quality."],"sub":"3.4"},{"id":"q0089","domain":"Hardware","q":"Which tool helps identify POST beep codes?","choices":["Motherboard manual","GPU driver software","Antivirus program","Word processor"],"correct":0,"explain":"POST beep codes are documented in the motherboard manual or vendor documentation.","wrongExplain":["","GPU driver software configures graphics settings and does not document motherboard-specific POST beep codes.","An antivirus program scans for malware and has nothing to do with hardware diagnostic codes.","A word processor is just an application; it is not a diagnostic reference for beep codes."],"sub":"3.4"},{"id":"q0090","domain":"Hardware","q":"What is the role of the chipset on a motherboard?","choices":["Manage communication between CPU, memory and peripherals","Supply monitor signal","Store user files","Control Wi-Fi only"],"correct":0,"explain":"The chipset coordinates data flow between CPU, RAM, storage and I/O.","wrongExplain":["","Supplying the monitor signal is handled by the GPU or onboard video output, not the chipset's general role.","Storing user files is the job of storage drives, not the chipset.","The chipset manages far more than Wi-Fi alone; wireless is often handled by a separate card or module."],"sub":"3.4"},{"id":"q0091","domain":"Hardware","q":"If a system will not boot and shows a red LED on the motherboard, you should check:","choices":["The thermostat","CPU seating, RAM seating, and power connections","Printer status","External monitor settings"],"correct":1,"explain":"Red diagnostic LEDs often indicate component seating or power issues to check first.","wrongExplain":["A room thermostat controls HVAC systems and has no relation to motherboard diagnostic LEDs.","","Printer status is unrelated to a motherboard that fails to POST.","External monitor settings won't affect whether the motherboard itself successfully powers on and POSTs."],"sub":"3.6"},{"id":"q0092","domain":"Hardware","q":"What is \"BIOS reset\" by removing the CMOS battery intended to do?","choices":["Clear stored BIOS settings and return to defaults","Increase CPU voltage","Improve disk speed","Change GPU clock"],"correct":0,"explain":"Removing the CMOS battery resets firmware settings to defaults.","wrongExplain":["","Clearing CMOS resets settings to their factory defaults; it does not increase CPU voltage.","Resetting BIOS settings has no direct effect on physical disk read/write speed.","Resetting CMOS does not specifically target or change GPU clock speeds."],"sub":"3.4"},{"id":"q0093","domain":"Hardware","q":"Which interface is used by many modern SSDs for highest performance?","choices":["SATA III","M.2 NVMe (PCIe)","IDE","Parallel ATA"],"correct":1,"explain":"M.2 NVMe uses PCIe lanes to achieve much higher bandwidth than SATA.","wrongExplain":["SATA III is limited by its interface bandwidth ceiling and is slower than NVMe over PCIe.","","IDE is a legacy, very slow parallel interface not used by modern high-performance SSDs.","Parallel ATA is the same legacy IDE interface, obsolete and far slower than NVMe."],"sub":"3.3"},{"id":"q0094","domain":"Hardware","q":"Which feature in UEFI can provide a graphical mouse-driven setup?","choices":["Text-only BIOS only","UEFI firmware with GUI support","Legacy BIOS memory","CMOS jumper"],"correct":1,"explain":"UEFI can provide graphical interfaces and mouse support unlike legacy BIOS.","wrongExplain":["This describes legacy BIOS, which lacks the mouse-driven graphical menus UEFI offers.","","\"Legacy BIOS memory\" is not a real feature that provides a graphical setup interface.","A CMOS jumper is a physical hardware switch, not a GUI feature."],"sub":"3.4"},{"id":"q0095","domain":"Hardware","q":"What does \"BIOS microcode update\" typically add?","choices":["Support for new CPUs and bug fixes","Larger monitor resolution","Faster RAM speeds by default","Increased hard drive capacity"],"correct":0,"explain":"Microcode updates add CPU compatibility and fix processor-level bugs.","wrongExplain":["","Monitor resolution is a display/GPU capability and is not something a BIOS microcode update changes.","Microcode updates target CPU instruction-level fixes; they do not change the default RAM speed.","Hard drive capacity is a fixed hardware property, not something firmware microcode can increase."],"sub":"3.4"},{"id":"q0096","domain":"Hardware","q":"Which power connector is commonly needed specifically for the CPU?","choices":["24-pin ATX only","8-pin EPS/CPU power","SATA power","Molex"],"correct":1,"explain":"EPS (4+4 or 8-pin) supplies additional 12V power to the CPU.","wrongExplain":["The 24-pin ATX connector powers the motherboard generally but is not the dedicated CPU power feed.","","SATA power connectors are for storage drives, not the CPU.","Molex connectors power legacy drives and fans, not the CPU on modern boards."],"sub":"3.4"},{"id":"q0097","domain":"Hardware","q":"What is the purpose of \"Secure Boot\" when enabled?","choices":["Prevent unsigned bootloaders from running","Improve audio quality","Speed up the hard disk","Disable USB ports"],"correct":0,"explain":"Secure Boot validates bootloader signatures to help prevent unauthorized code at startup.","wrongExplain":["","Audio quality is unrelated to boot security; Secure Boot does not affect sound processing.","Secure Boot does not affect disk read/write speed; it only validates bootloader signatures.","Secure Boot does not disable USB ports; it verifies that boot software is properly signed."],"sub":"3.1"},{"id":"q0098","domain":"Hardware","q":"Which BIOS option might you configure when installing a new OS to support GPT and UEFI boot?","choices":["Enable UEFI mode and disable legacy/CSM","Enable legacy only","Enable overclocking","Disable SATA"],"correct":0,"explain":"To boot GPT/UEFI systems you should enable UEFI mode and disable legacy compatibility mode.","wrongExplain":["","Legacy/CSM mode is meant for MBR/BIOS-style booting and is incompatible with proper UEFI/GPT boot.","Overclocking settings affect CPU/RAM speed and have nothing to do with boot mode or partition style.","Disabling SATA would prevent the drive from being detected at all, which would not help enable UEFI/GPT boot."],"sub":"3.4"},{"id":"q0099","domain":"Hardware","q":"Which component tracks time and date when the system is off?","choices":["CMOS/Real-time clock powered by the battery","CPU cache","Power supply LEDs","GPU fan controller"],"correct":0,"explain":"The RTC keeps time even when power is off; the CMOS battery powers it.","wrongExplain":["","CPU cache is volatile and loses its contents without power; it does not track time.","Power supply LEDs are simple status indicators, not a timekeeping component.","A GPU fan controller manages cooling fan speed and has nothing to do with keeping time."],"sub":"3.5"},{"id":"q0100","domain":"Hardware","q":"Which motherboard feature helps when a BIOS update fails (recovery)?","choices":["Dual BIOS or BIOS recovery procedure","Faster RAM","Larger case","More SATA ports"],"correct":0,"explain":"Many boards include recovery or dual-BIOS to restore firmware after a failed update.","wrongExplain":["","RAM speed has no relation to a motherboard's ability to recover from a failed BIOS flash.","Case size has nothing to do with firmware recovery capability.","Having more SATA ports does not help recover from a failed BIOS update."],"sub":"3.4"},{"id":"q0101","domain":"Hardware","q":"Which expansion slot is legacy and rarely found on modern boards?","choices":["AGP","PCIe","M.2","NVMe"],"correct":0,"explain":"AGP was an older graphics slot replaced by PCIe.","wrongExplain":["","PCIe is the current standard expansion interface found on virtually all modern motherboards, not a legacy slot.","M.2 is a modern slot mainly used for SSDs and Wi-Fi cards, not a legacy graphics slot.","NVMe is a modern storage protocol, not a physical legacy expansion slot at all."],"sub":"3.3"},{"id":"q0102","domain":"Hardware","q":"A desktop intermittently shuts down during GPU-intensive workloads. Event logs show Kernel-Power 41 errors with no bugcheck. Which power characteristic should be evaluated FIRST?","choices":["Sustained +12V rail amperage under transient load","Total nameplate wattage of the PSU","AC input voltage from the wall","Efficiency rating (80 PLUS level)"],"correct":0,"explain":"Modern GPUs create transient spikes on the +12V rail; insufficient amperage headroom can trigger Kernel-Power events.","wrongExplain":["","A PSU can have plenty of total nameplate wattage yet still lack adequate transient amperage headroom on the +12V rail, so total wattage alone doesn't explain the intermittent shutdowns.","Stable AC input voltage from the wall doesn't rule out internal rail transient sag caused by sudden GPU load spikes.","An 80 PLUS efficiency rating measures how well the PSU converts AC to DC power, not its ability to supply sudden current spikes."],"sub":"3.5"},{"id":"q0103","domain":"Hardware","q":"A system powers on but emits continuous memory-related beep codes and never initializes video. Which action MOST directly isolates the fault?","choices":["Test with a known-good DIMM in the primary slot","Reset the OS boot configuration","Replace the video cable","Update the graphics driver"],"correct":0,"explain":"Using a known-good module in the primary slot isolates RAM versus board issues.","wrongExplain":["","The OS never loads at this stage since POST is failing on memory errors before any operating system boot configuration is read.","A video cable issue would not produce continuous memory-related beep codes; the beeps point to RAM, not the display connection.","Graphics drivers only load once an OS is running; POST has not completed successfully, so there is no driver context to update."],"sub":"3.2"},{"id":"q0104","domain":"Hardware","q":"SMART shows a rapidly increasing reallocated sector count while pending sectors fluctuate. What is the BEST CompTIA-recommended response?","choices":["Immediately back up data and schedule drive replacement","Run manufacturer low-level diagnostics repeatedly","Disable write caching to stabilize the disk","Convert the disk to GPT"],"correct":0,"explain":"Reallocated and pending sectors indicate media degradation; data protection is the priority.","wrongExplain":["","Repeated stress testing on a drive already showing rising reallocated sectors accelerates wear and delays the urgent task of protecting data.","Disabling write caching does not stop physical media degradation and will not prevent further sector reallocation.","Changing the partition table style has no effect on the physical health of the drive's storage media."],"sub":"3.4"},{"id":"q0105","domain":"Hardware","q":"A system completes POST but reports 'No bootable device' after a firmware update. Which setting is MOST likely misconfigured?","choices":["UEFI vs Legacy/CSM boot mode","CPU virtualization extensions","XMP memory profile","Integrated audio controller"],"correct":0,"explain":"Firmware updates often reset boot mode, preventing the OS loader from being detected.","wrongExplain":["","Virtualization extensions (VT-x/AMD-V) affect hypervisor support, not whether the boot loader is detected.","An XMP memory overclock profile affects RAM timings and stability, not boot device recognition.","The onboard audio controller has no bearing on whether a bootable device is found."],"sub":"3.4"},{"id":"q0106","domain":"Mobile Devices","q":"A laptop display is barely visible except under direct light, and external displays work normally. Which component failure BEST fits?","choices":["Backlight circuit or inverter stage","EDID data corruption","GPU framebuffer allocation","Panel timing controller"],"correct":0,"explain":"A faint image with external display working indicates loss of backlight illumination.","wrongExplain":["","EDID problems typically cause resolution mismatches or no-signal conditions, not an image that is only visible under strong external light.","The GPU is clearly outputting correctly since the external display works fine, ruling out a framebuffer allocation problem.","A failed timing controller usually produces a garbled or blank image rather than a normal image that is simply too dim to see."],"sub":"1.1"},{"id":"q0107","domain":"Hardware","q":"Which symptom MOST strongly correlates with thermal throttling rather than immediate thermal shutdown?","choices":["Noticeable performance drops under sustained load","Instant power loss during POST","Corrupted system time","Intermittent USB disconnects"],"correct":0,"explain":"Thermal throttling reduces performance to manage heat before shutdown thresholds are reached.","wrongExplain":["","An instant power-off during POST is characteristic of a hard thermal shutdown protection trip, not gradual throttling.","A corrupted system clock points to a failing CMOS battery, not a heat-related performance response.","USB disconnects are typically caused by power delivery or driver issues, not CPU/GPU thermal throttling."],"sub":"3.1"},{"id":"q0108","domain":"Hardware","q":"A RAID 1 array reports a single disk failure but remains online. According to best practice, what should be done NEXT?","choices":["Replace the failed disk and allow the mirror to rebuild","Break the mirror to preserve performance","Convert the array to RAID 0","Run defragmentation on the remaining disk"],"correct":0,"explain":"RAID 1 tolerates one disk failure but must be rebuilt promptly to restore redundancy.","wrongExplain":["","Breaking the mirror eliminates redundancy entirely and does nothing to correct the failed disk.","RAID 0 provides no fault tolerance at all, which increases risk instead of resolving the current degraded state.","Defragmenting the surviving disk does not replace the failed member or restore the array's redundancy."],"sub":"3.3"},{"id":"q0109","domain":"Hardware","q":"A newly installed SATA SSD is absent from firmware but spins up and is warm to the touch. What should be verified FIRST?","choices":["Correct SATA port enablement and controller mode","Operating system storage driver","Disk partition scheme","User permissions"],"correct":0,"explain":"Disabled ports or incorrect controller mode can prevent detection at the firmware level.","wrongExplain":["","Storage drivers only matter once the OS loads; a drive missing from firmware is a pre-OS detection issue.","Partition scheme is irrelevant if the drive isn't even recognized by firmware yet.","User permissions are an OS-level concept and have no effect on firmware-level drive detection."],"sub":"3.3"},{"id":"q0110","domain":"Hardware","q":"Which display artifact MOST clearly differentiates screen tearing from ghosting?","choices":["Horizontal frame discontinuities during motion","Trailing afterimages behind moving objects","Random pixel discoloration","Periodic backlight flicker"],"correct":0,"explain":"Screen tearing shows mismatched frames, while ghosting is pixel response delay.","wrongExplain":["","Trailing afterimages behind moving objects is the definition of ghosting, not tearing.","Random pixel discoloration describes dead or stuck pixels, unrelated to frame synchronization.","Periodic backlight flicker is a separate illumination issue, not a frame-mismatch artifact like tearing."],"sub":"3.4"},{"id":"q0111","domain":"Hardware","q":"A system clock resets after every full power loss despite correct shutdowns. Which component failure is MOST likely?","choices":["CMOS battery","Real-time clock crystal","Operating system time service","Power supply standby rail"],"correct":0,"explain":"The CMOS battery maintains RTC data when the system is unpowered.","wrongExplain":["","A failing crystal would cause ongoing timekeeping drift regardless of power state, not a reset specifically tied to full power loss.","An OS time sync service issue would not correlate specifically with the system losing all external power.","The standby rail supplies features like wake-on-LAN, but it is the CMOS battery, not the standby rail, that preserves the clock when unplugged."],"sub":"3.5"},{"id":"q0112","domain":"Hardware","q":"A workstation reboots during rendering workloads with normal thermals and no dump files. What should be tested NEXT?","choices":["PSU voltage stability under load","GPU driver version","Monitor refresh rate","Keyboard firmware"],"correct":0,"explain":"Load-related reboots without dumps often indicate unstable power delivery.","wrongExplain":["","A GPU driver crash typically produces error logs, artifacts, or a driver-recovery event rather than a clean, dump-free reboot.","Monitor refresh rate has no bearing on whether the entire system reboots under load.","Keyboard firmware is unrelated to system-wide stability during rendering workloads."],"sub":"3.5"},{"id":"q0113","domain":"Hardware","q":"Which Windows utility BEST verifies logical file system integrity without modifying partition structure?","choices":["chkdsk","diskpart","sfc","dxdiag"],"correct":0,"explain":"chkdsk checks and repairs logical file system errors.","wrongExplain":["","diskpart is used to create, delete, and resize partitions and volumes; it can modify partition structure rather than just check file system integrity.","sfc verifies the integrity of protected Windows system files, not general disk/file system structure.","dxdiag reports DirectX, device, and driver diagnostic information and does not check file system integrity at all."],"sub":"3.4"},{"id":"q0114","domain":"Hardware","q":"A DisplayPort monitor intermittently reports 'No Signal' after sleep. What is the MOST efficient first step?","choices":["Test with a known-good cable and alternate DP port","Reinstall the operating system","Replace the graphics card","Flash the motherboard firmware"],"correct":0,"explain":"Cable and port issues are common with DP handshake failures.","wrongExplain":["","Reinstalling the OS is a drastic step that does not address a physical cable/connection handshake issue and skips simpler checks.","Replacing the graphics card outright is premature when a cheaper cable or port swap could resolve the same symptom.","Motherboard firmware does not govern DisplayPort signal handshaking with a discrete GPU, making this an unnecessary and risky step."],"sub":"3.4"},{"id":"q0115","domain":"Hardware","q":"One long beep followed by two short beeps during POST MOST commonly indicates which failure?","choices":["Discrete graphics adapter","System memory","Processor","Power supply"],"correct":0,"explain":"This beep pattern is widely associated with video adapter faults.","wrongExplain":["","Memory failures typically produce a different, distinct repeating beep pattern rather than this specific long-short-short sequence.","Processor failures have their own characteristic beep codes distinct from this video-adapter pattern.","A failing power supply usually prevents POST from starting at all rather than producing this specific beep sequence."],"sub":"3.5"},{"id":"q0116","domain":"Hardware","q":"Which observation MOST reliably distinguishes HDD mechanical failure from logical corruption?","choices":["Audible clicking or grinding noises","Repeated CHKDSK repairs","Slow application launches","High CPU utilization"],"correct":0,"explain":"Mechanical noises indicate physical drive failure.","wrongExplain":["","Repeated CHKDSK repairs point to logical file system errors, the very condition this question is asking to distinguish from mechanical failure.","Slow application launches can stem from many causes such as fragmentation or low RAM, not specifically physical drive failure.","High CPU utilization is unrelated to the physical condition of a hard drive's mechanical components."],"sub":"3.4"},{"id":"q0117","domain":"Hardware","q":"Users report eye strain and motion blur on a workstation display. Which adjustment is MOST appropriate if supported?","choices":["Increase refresh rate","Lower screen resolution","Disable hardware acceleration","Reduce color depth"],"correct":0,"explain":"Higher refresh rates reduce perceived blur and flicker.","wrongExplain":["","Lowering resolution degrades image quality without addressing the flicker or motion blur causing the eye strain.","Disabling hardware acceleration can hurt rendering performance and does
