g a subnet mask wouldn't cause the system to self-assign an APIPA address; that behavior specifically results from a failed DHCP request.","169.254.x.x is an IPv4 APIPA address, unrelated to IPv6-only segments."],"sub":"2.2"},{"id":"q0232","domain":"Networking","q":"Which device primarily forwards traffic between hosts on the same LAN by using destination MAC addresses?","choices":["Switch.","Bridge router.","Wireless router.","Access point."],"correct":0,"explain":"A switch forwards Ethernet frames within a LAN using MAC address tables.","wrongExplain":["","A bridge router (brouter) combines bridging and routing to move traffic between different network segments, going beyond simple same-LAN MAC-based forwarding.","A wireless router's main job is routing between networks and providing wireless access, not switching frames based on MAC address tables.","An access point extends wireless connectivity to the wired LAN but does not perform MAC-address table lookups the way a switch does."],"sub":"2.3"},{"id":"q0233","domain":"Networking","q":"A laptop connects to the office Wi-Fi but reports strong signal and no internet access. Other users are online. Which configuration item should the technician verify first if the laptop also has an APIPA address?","choices":["DHCP communication.","Default gateway entry.","DNS suffix search.","Proxy auto-config."],"correct":0,"explain":"If the device has an APIPA address, the immediate concern is whether it can obtain a lease from DHCP.","wrongExplain":["","With an APIPA address, the device never received real network configuration, including the gateway, so DHCP itself must be checked before the gateway setting matters.","DNS suffix settings only matter for resolving unqualified hostnames and are irrelevant while the device is stuck with a self-assigned APIPA address.","A proxy configuration issue would only matter after basic IP connectivity works, but here the client never even got a valid address, so DHCP is the deeper problem."],"sub":"2.3"},{"id":"q0234","domain":"Networking","q":"A technician wants to identify the path packets take to a remote host and where latency begins to increase. Which utility is most appropriate?","choices":["tracert.","pathping.","ping.","netstat."],"correct":0,"explain":"tracert shows the hop-by-hop path to a destination and is the standard first check for where delay begins.","wrongExplain":["","Pathping provides more detailed loss and latency statistics over an extended sampling period, but tracert is the quicker, more standard tool for simply mapping the hop-by-hop path and spotting where delay jumps.","Ping only reports round-trip time to a single destination and does not reveal the individual hops along the way.","Netstat displays local connection and port information, not the path packets take across the network."],"sub":"2.1"},{"id":"q0235","domain":"Networking","q":"Which DNS record type is used to map a hostname directly to an IPv4 address?","choices":["A record.","AAAA record.","CNAME record.","PTR record."],"correct":0,"explain":"An A record maps a host name to an IPv4 address.","wrongExplain":["","An AAAA record maps a hostname to an IPv6 address, not IPv4.","A CNAME record is an alias that points one hostname to another hostname, not directly to an IP address.","A PTR record performs reverse lookups, mapping an IP address back to a hostname, the opposite of what's being asked."],"sub":"2.1"},{"id":"q0236","domain":"Networking","q":"A technician must connect a copper Ethernet device to a fiber backbone without replacing the endpoint NIC. Which hardware should be used?","choices":["Media converter.","SFP transceiver.","PoE injector.","Managed bridge."],"correct":0,"explain":"A media converter changes one network media type, such as copper, to another, such as fiber.","wrongExplain":["","An SFP transceiver plugs into equipment that already has a modular fiber-capable port; it doesn't let a fixed copper Ethernet port connect to fiber on its own.","A PoE injector adds electrical power to an Ethernet cable and does not convert between copper and fiber media.","A managed bridge connects and filters traffic between network segments but is not specifically designed to translate copper Ethernet signaling to fiber optics."],"sub":"2.6"},{"id":"q0237","domain":"Networking","q":"Which DHCP sequence correctly describes the process a client uses to obtain an IP lease from a server?","choices":["Discover, Offer, Request, Acknowledge.","Discover, Request, Offer, Renew.","Request, Offer, Confirm, Acknowledge.","Acknowledge, Discover, Offer, Request."],"correct":0,"explain":"DORA stands for Discover, Offer, Request, and Acknowledge.","wrongExplain":["","This reverses the order of the Offer and Request steps and substitutes Renew for Acknowledge, which is not the standard DHCP lease process.","This starts with Request instead of Discover and uses Confirm instead of Offer, which does not match the actual DORA sequence.","This places Acknowledge first, but acknowledgment is actually the final step the server sends after the client's request, not the first step."],"sub":"2.1"},{"id":"q0238","domain":"Networking","q":"A user can browse the web securely and retrieve email, but cannot send mail from a client application. Which protocol and port should be reviewed first?","choices":["SMTP over TCP 25.","SMTPS over TCP 465.","POP3 over TCP 110.","IMAP over TCP 143."],"correct":0,"explain":"SMTP is the protocol used for sending mail, commonly associated with TCP port 25 in foundational networking questions.","wrongExplain":["","SMTPS is the encrypted variant of SMTP; while related, the base SMTP protocol and port is the first and most fundamental item to verify for a basic sending failure.","POP3 is used for retrieving email, and the scenario states retrieval already works, so it's not related to the outbound send failure.","IMAP is used for retrieving and synchronizing mail, not for sending it, so it doesn't explain an outbound failure."],"sub":"2.1"},{"id":"q0239","domain":"Networking","q":"A technician is comparing twisted-pair cable categories for a new office and wants a common choice for reliable 10 Gigabit Ethernet over typical structured cabling distances. Which category fits best?","choices":["Cat6a.","Cat6.","Cat5e.","Cat8."],"correct":0,"explain":"Cat6a is a common choice for 10 GbE over standard horizontal run distances.","wrongExplain":["","Cat6 supports 10 GbE only over short distances of around 55 meters, making it less reliable than Cat6a for typical full-length structured cabling runs.","Cat5e is rated for Gigabit Ethernet and does not reliably support 10 Gigabit speeds.","Cat8 supports very high speeds but is designed for short data center runs, not typical office structured cabling distances."],"sub":"2.6"},{"id":"q0240","domain":"Networking","q":"Which wireless standard is commonly associated with Wi-Fi 6 and improved efficiency in dense environments?","choices":["802.11ax.","802.11ac.","802.11n.","802.11g."],"correct":0,"explain":"802.11ax is Wi-Fi 6 and improves throughput and efficiency, especially in crowded deployments.","wrongExplain":["","802.11ac is Wi-Fi 5, an earlier standard with less efficient handling of many simultaneous devices than Wi-Fi 6.","802.11n is an older standard, Wi-Fi 4, with significantly lower throughput and efficiency than Wi-Fi 6.","802.11g is a legacy 2.4 GHz standard with much lower speeds and no relation to Wi-Fi 6 efficiency features."],"sub":"2.3"},{"id":"q0241","domain":"Networking","q":"A network printer is manually configured with the wrong subnet mask. Which symptom is the most likely result?","choices":["Communication problems with some hosts despite a valid local IP.","The printer can reach local hosts but not the default gateway.","The printer receives duplicate DNS responses during lookups.","The printer renews its DHCP lease at every reboot."],"correct":0,"explain":"An incorrect subnet mask can make a device misidentify which destinations are local versus remote, causing communication failures.","wrongExplain":["","An incorrect subnet mask more commonly causes the device to misjudge which addresses are local versus remote, producing inconsistent reachability rather than a clean, total loss of gateway access only.","DNS response duplication is unrelated to subnet mask configuration; it would point to a DNS or network duplication issue instead.","This behavior is unrelated to a manually configured subnet mask and would instead suggest a DHCP lease time or configuration issue."],"sub":"2.1"},{"id":"q0242","domain":"Networking","q":"A technician needs to verify that a workstation received a valid IPv4 address, default gateway, and DNS server from DHCP. Which tool should be used first?","choices":["ipconfig /all.","tracert 8.8.8.8.","netstat -an.","nslookup localhost."],"correct":0,"explain":"ipconfig /all displays full TCP/IP configuration details, including the IPv4 address, subnet mask, default gateway, DHCP status, and DNS servers.","wrongExplain":["","Tracert shows the path to a remote destination but does not display the local IP configuration details DHCP assigned.","Netstat lists active connections and listening ports, not the assigned IP configuration.","Nslookup performs DNS queries and would not display the DHCP-assigned IPv4 address, gateway, or DNS servers."],"sub":"2.1"},{"id":"q0243","domain":"Networking","q":"A user can reach local network resources but cannot reach websites by name. Pinging a public IP address succeeds. Which command best isolates a DNS resolution problem?","choices":["nslookup example.com.","ping 127.0.0.1.","net use \\\\server\\share.","arp -a."],"correct":0,"explain":"nslookup tests name resolution directly and helps confirm whether DNS is failing even when IP connectivity is working.","wrongExplain":["","Pinging the loopback address only tests the local TCP/IP stack and has nothing to do with DNS resolution.","This command maps a network share and does not test or isolate DNS name resolution.","Arp -a displays the local ARP cache of MAC-to-IP mappings, not DNS name resolution results."],"sub":"2.1"},{"id":"q0244","domain":"Networking","q":"A technician wants to see each router hop between a PC and a remote host to locate where latency begins. Which tool should be used?","choices":["tracert.","netstat.","dig.","hostname."],"correct":0,"explain":"tracert shows the path packets take and identifies hop-by-hop delays or failures.","wrongExplain":["","Netstat shows local connections and ports, not the hop-by-hop path to a remote host.","Dig is a DNS lookup utility used to query DNS records, not to trace the network path.","Hostname simply displays the local computer's name and provides no path or latency information."],"sub":"2.2"},{"id":"q0245","domain":"Networking","q":"A technician suspects a local interface problem and wants to verify the TCP/IP stack without using the network. Which address should be pinged?","choices":["127.0.0.1.","169.254.1.10.","224.0.0.1.","255.255.255.255."],"correct":0,"explain":"The loopback address 127.0.0.1 tests the local TCP/IP stack without sending traffic to the network.","wrongExplain":["","This is an APIPA/link-local address that indicates a failed DHCP lease, not the loopback address used to test the local stack.","This is a multicast address used for group communication, not for local stack loopback testing.","This is the limited broadcast address, sent to all hosts on the local segment, not used for loopback testing."],"sub":"2.1"},{"id":"q0246","domain":"Networking","q":"A switch port shows activity, but a user still cannot connect to the network. Which physical troubleshooting tool can help verify whether the cable is pinned correctly end to end?","choices":["Cable tester.","Loopback plug.","Multimeter.","Wi-Fi analyzer."],"correct":0,"explain":"A cable tester checks continuity and pair mapping to confirm the cable is correctly terminated.","wrongExplain":["","A loopback plug tests a NIC's transmit/receive function, not whether a cable's pinout and continuity are correctly wired end to end.","A multimeter measures general electrical properties like voltage and continuity but doesn't verify Ethernet pair mapping and wiring standards the way a dedicated cable tester does.","A Wi-Fi analyzer evaluates wireless signals and channels, not the physical wiring of a copper cable."],"sub":"2.3"},{"id":"q0247","domain":"Networking","q":"A technician needs to identify the SSID with the strongest nearby signal and least channel overlap in a congested office. Which tool is most appropriate?","choices":["Wi-Fi analyzer.","Tone generator.","Protocol analyzer.","Punchdown tool."],"correct":0,"explain":"A Wi-Fi analyzer displays nearby wireless networks, channels, and signal strength to support WLAN troubleshooting.","wrongExplain":["","A tone generator is used with a probe to trace physical cabling, not to detect wireless signal strength or channel overlap.","A protocol analyzer captures and inspects network packet traffic; it does not display SSID signal strength or channel congestion.","A punchdown tool is used to terminate cabling into a patch panel and has no wireless diagnostic function."],"sub":"2.6"},{"id":"q0248","domain":"Networking","q":"A network printer is reachable by IP address, but users cannot browse to its hostname. DHCP leases look normal. Which supporting network service is most likely failing?","choices":["DNS.","DHCP.","NTP.","LDAP."],"correct":0,"explain":"If devices are reachable by IP but not by hostname, DNS resolution is the most likely issue.","wrongExplain":["","DHCP handles automatic IP address assignment; the scenario states leases look normal, so DHCP is not the issue.","NTP synchronizes system time and has no role in resolving a hostname to an IP address.","LDAP is used for directory services lookups, not for resolving hostnames to IP addresses on the network."],"sub":"2.1"},{"id":"q0249","domain":"Networking","q":"Multiple new workstations boot up with APIPA addresses instead of valid network settings. Which supporting network service should be checked first?","choices":["DHCP.","DNS.","SMTP.","Syslog."],"correct":0,"explain":"APIPA addresses indicate that the clients could not obtain a lease from DHCP.","wrongExplain":["","DNS resolves names to addresses; it doesn't assign IP configuration, so it isn't the cause of APIPA addresses.","SMTP handles outbound email delivery and has nothing to do with IP address assignment.","Syslog is a logging protocol and plays no role in assigning IP addresses to clients."],"sub":"2.1"},{"id":"q0250","domain":"Networking","q":"A user can browse websites but reports that sent email stays in the Outbox. Which network service is most closely associated with sending outbound mail?","choices":["SMTP.","IMAP.","POP3.","SNMP."],"correct":0,"explain":"SMTP is used for sending outgoing email messages.","wrongExplain":["","IMAP is used to retrieve and synchronize received mail, not to send outbound messages.","POP3 downloads received mail from the server; it plays no role in sending mail.","SNMP is used for monitoring and managing network devices, not for sending email."],"sub":"2.1"},{"id":"q0251","domain":"Networking","q":"A smartphone user wants messages to remain on the mail server and stay synchronized across multiple devices. Which service best supports that requirement?","choices":["IMAP.","POP3.","SMTP.","TFTP."],"correct":0,"explain":"IMAP keeps email on the server and synchronizes mailbox state across devices.","wrongExplain":["","POP3 typically downloads mail to a single device and does not keep it synchronized across multiple devices the way IMAP does.","SMTP is used for sending mail, not for storing or synchronizing received messages.","TFTP is a simple file transfer protocol unrelated to email retrieval or synchronization."],"sub":"2.1"},{"id":"q0252","domain":"Networking","q":"A technician needs to confirm whether a Windows PC has active TCP and UDP sessions to a suspected remote system. Which command is best?","choices":["netstat -an.","ipconfig /flushdns.","ping -t.","gpupdate /force."],"correct":0,"explain":"netstat -an lists active connections and listening ports without relying on name resolution.","wrongExplain":["","This command clears the local DNS resolver cache and provides no information about active TCP/UDP sessions.","A continuous ping only tests reachability to one address and does not list active sessions or listening ports.","This command forces a Group Policy refresh and has nothing to do with viewing network connections."],"sub":"2.1"},{"id":"q0253","domain":"Networking","q":"A PC can communicate on the local subnet but not with remote networks. The interface has a valid address and subnet mask. Which configuration item is the most likely cause?","choices":["Missing default gateway.","Incorrect host name.","Disabled NetBIOS.","Stale ARP cache."],"correct":0,"explain":"The default gateway is required for traffic destined outside the local subnet.","wrongExplain":["","A wrong host name affects how the machine identifies itself on the network but does not prevent routing to remote networks.","NetBIOS relates to legacy name resolution and file/printer sharing on the local network, not routing to remote subnets.","A stale ARP entry could cause issues reaching a specific local host, but it would not explain a total inability to reach remote networks."],"sub":"2.1"},{"id":"q0254","domain":"Networking","q":"A technician needs to locate the far end of an unlabeled Ethernet drop in a wiring closet. Which tool should be used?","choices":["Tone generator and probe.","Crimper and stripper.","Butt set and punchdown.","Label maker and tester."],"correct":0,"explain":"A tone generator and probe help identify the corresponding cable among many terminations.","wrongExplain":["","These tools are used to prepare and terminate cable ends with connectors, not to trace an unlabeled run to its far end.","A butt set is used mainly for telephone line testing, and a punchdown tool terminates wires; neither is used to trace a cable through a wiring closet.","A label maker only creates labels after identification, and a basic tester alone doesn't trace which port corresponds to which unlabeled drop."],"sub":"2.6"},{"id":"q0255","domain":"Networking","q":"A user reports intermittent access to network shares. The technician suspects high collisions or CRC errors on a damaged NIC or cable. Which command-line tool provides the least direct help for this suspicion?","choices":["hostname.","ping.","netstat.","tracert."],"correct":0,"explain":"hostname only displays the local system name and does not assist directly with diagnosing connectivity or interface errors.","wrongExplain":["","Ping can reveal packet loss and response time variation that hints at a flaky connection, giving more direct insight than hostname.","Netstat can show connection states and related network session data, offering more relevant diagnostic value than hostname.","Tracert can reveal hop-by-hop issues that might correlate with a damaged link, offering more diagnostic value than hostname."],"sub":"2.2"},{"id":"q0256","domain":"Networking","q":"A branch office router must learn the correct current time so logs from multiple devices line up during incident review. Which service should be configured?","choices":["NTP.","DNS.","DHCP.","SMB."],"correct":0,"explain":"NTP synchronizes device clocks, which is important for log correlation and troubleshooting.","wrongExplain":["","DNS resolves hostnames to IP addresses; it has nothing to do with synchronizing device clocks.","DHCP hands out IP addresses and other network configuration to clients, but does not provide time synchronization.","SMB is a file and printer sharing protocol; it does not synchronize clocks across devices."],"sub":"2.2"},{"id":"q0257","domain":"Networking","q":"A user can map a shared drive by using \\\\10.0.0.20\\files, but \\\\fileserver\\files fails. Which service should be investigated first?","choices":["DNS.","SMTP.","DHCP.","SFTP."],"correct":0,"explain":"Successful access by IP but not by name points to a name resolution issue, usually DNS.","wrongExplain":["","SMTP is used to send email between mail servers, and has no role in resolving a share name like \\\\fileserver.","DHCP hands out IP configuration; since the IP-based connection already works, DHCP is already functioning correctly.","SFTP is a secure file transfer protocol, not a name resolution service, so it would not explain a name-based access failure."],"sub":"2.1"},{"id":"q0258","domain":"Networking","q":"A technician wants to test basic reachability to a remote host and measure whether packets are being returned. Which tool is the most direct choice?","choices":["ping.","route print.","nbtstat.","whois."],"correct":0,"explain":"ping is the standard tool for testing reachability and round-trip response.","wrongExplain":["","route print displays the local routing table; it does not send probe packets or measure round-trip reachability to a remote host.","nbtstat is used for NetBIOS name resolution troubleshooting, not general IP reachability testing.","whois looks up domain registration ownership information; it does not test whether packets reach a host."],"sub":"2.1"},{"id":"q0259","domain":"Networking","q":"A wireless client keeps disconnecting whenever users in nearby offices begin using adjacent channels. Which issue is most likely being diagnosed?","choices":["Interference.","Open relay.","Port mirroring.","Address exhaustion."],"correct":0,"explain":"Overlapping or crowded channels can cause RF interference and unstable wireless performance.","wrongExplain":["","An open relay is a mail server misconfiguration that allows unauthorized email relaying; it is unrelated to wireless channel congestion.","Port mirroring is a switch feature used to copy traffic for monitoring purposes and has nothing to do with wireless disconnects from nearby channel use.","Address exhaustion refers to a DHCP pool running out of available leases, not RF interference between wireless channels."],"sub":"2.1"},{"id":"q0260","domain":"Networking","q":"A technician needs to determine which local process is listening on a specific TCP port before uninstalling software. Which command is best suited for the first check?","choices":["netstat -ano.","tracert -d.","arp -d *.","ipconfig /release."],"correct":0,"explain":"netstat -ano displays active connections, listening ports, and the associated PID.","wrongExplain":["","tracert -d traces the network path to a host without resolving names; it does not show which local process owns a listening port.","arp -d * clears the local ARP cache; it does not report port or process information.","ipconfig /release drops the current DHCP lease and would disrupt connectivity, but it does not show what is listening on a port."],"sub":"2.1"},{"id":"q0261","domain":"Networking","q":"A user reports that websites load slowly only when using hostnames, but direct IP connections are fast. Which change is the best first corrective action?","choices":["Verify DNS server settings.","Replace the NIC driver.","Disable SMB signing.","Reset the print spooler."],"correct":0,"explain":"Slow hostname-based access with normal IP connectivity usually points to a DNS configuration or response issue.","wrongExplain":["","A bad NIC driver would typically cause broader connectivity problems, not a symptom limited specifically to hostname-based lookups while IP access stays fast.","SMB signing affects file-sharing security/performance, not general web browsing speed by hostname.","The print spooler manages print jobs and has no connection to how quickly a browser resolves and loads websites."],"sub":"2.2"},{"id":"q0262","domain":"Networking","q":"A laptop receives a 169.254.x.x address after being moved to a new office. The link light is on. Which step is most appropriate after checking the cable?","choices":["Test DHCP availability.","Clear the browser cache.","Rebuild the mail profile.","Disable IPv6 temporarily."],"correct":0,"explain":"A 169.254.x.x address indicates APIPA, which usually means the client could not contact a DHCP server.","wrongExplain":["","Clearing the browser cache addresses stored web content, not the underlying IP addressing failure shown by an APIPA address.","Rebuilding a mail profile fixes email client issues; it has no effect on whether the device can obtain an IP lease.","Disabling IPv6 doesn't address the reason the IPv4 stack fell back to APIPA, which is that no DHCP server responded."],"sub":"2.1"},{"id":"q0263","domain":"Networking","q":"A technician wants to inspect packet contents to confirm whether malformed DNS responses are being returned to a client. Which tool should be used?","choices":["Protocol analyzer.","Loopback adapter.","Cable stripper.","Sound level meter."],"correct":0,"explain":"A protocol analyzer captures and decodes packets so the technician can inspect DNS queries and responses.","wrongExplain":["","A loopback adapter is used to test whether a NIC port itself is functioning, not to capture and inspect the contents of DNS packets.","A cable stripper is a physical hand tool for preparing cable ends; it has no ability to inspect network traffic.","A sound level meter measures ambient noise and has no application in analyzing network packets."],"sub":"2.1"},{"id":"q0264","domain":"Networking","q":"Which network service is commonly used to provide file and printer sharing on Windows networks?","choices":["SMB.","SNMP.","RDP.","SIP."],"correct":0,"explain":"SMB is the core protocol used for Windows file and printer sharing.","wrongExplain":["","SNMP is used to monitor and manage network devices, not to share files or printers between Windows systems.","RDP provides remote desktop/graphical access to a system; it is not the protocol behind Windows file and printer sharing.","SIP is a signaling protocol used to set up VoIP calls, unrelated to file or printer sharing."],"sub":"2.1"},{"id":"q0265","domain":"Networking","q":"A technician flushes a workstation's resolver cache after a DNS record was corrected on the server. Which command performs that action?","choices":["ipconfig /flushdns.","ipconfig /renew.","route /f.","net use /delete."],"correct":0,"explain":"ipconfig /flushdns clears the local DNS resolver cache so the system can retrieve fresh records.","wrongExplain":["","ipconfig /renew requests a new DHCP lease; it does not clear the DNS resolver cache.","There is no standard \"route /f\" command for this purpose, and route commands manage the routing table, not DNS cache entries.","net use /delete removes a mapped network drive; it has no effect on the local DNS resolver cache."],"sub":"2.1"},{"id":"q0266","domain":"Networking","q":"Which email retrieval service typically downloads messages to a single device and may remove them from the server, depending on configuration?","choices":["POP3.","IMAP.","SMTP.","NTP."],"correct":0,"explain":"POP3 is designed around downloading messages for local storage, unlike IMAP synchronization.","wrongExplain":["","IMAP synchronizes messages and folders across multiple devices and normally leaves mail on the server, which is the opposite of the single-device download behavior described.","SMTP is used to send outgoing mail between servers, not to retrieve or download messages to a client.","NTP is a time-synchronization protocol and has no role in retrieving email."],"sub":"2.1"},{"id":"q0267","domain":"Networking","q":"A technician must verify the MAC address currently associated with the default gateway on a local subnet. Which command is best?","choices":["arp -a.","pathping.","tasklist.","telnet."],"correct":0,"explain":"arp -a displays the ARP cache, including IP-to-MAC mappings for local devices such as the default gateway.","wrongExplain":["","pathping combines ping and traceroute to measure packet loss and latency along a path; it does not display the ARP cache or MAC addresses.","tasklist lists running processes on the local OS and has nothing to do with network address mappings.","telnet is used to test connectivity to a specific port/service; it does not show IP-to-MAC address mappings."],"sub":"2.1"},{"id":"q0268","domain":"Networking","q":"A workstation can browse intranet sites by name but cannot access Internet websites. Internal resources and IP connectivity look normal. Which supporting network component is the best first place to check?","choices":["DNS forwarder settings.","Loopback interface status.","Local print queue order.","Screen timeout policy."],"correct":0,"explain":"If internal name resolution works but external sites fail, the DNS server's forwarding or recursion settings may be the issue.","wrongExplain":["","The loopback interface is a virtual internal interface used for local testing; its status has no bearing on external DNS resolution to the internet.","Print queue ordering only affects print jobs and is unrelated to a name-resolution failure for external websites.","Screen timeout policy controls display sleep behavior and has no relationship to DNS forwarding or internet access."],"sub":"2.1"},{"id":"q0269","domain":"Networking","q":"A technician needs to re-request an IPv4 lease from DHCP after moving a desktop to another VLAN. Which command should be used after releasing the old address?","choices":["ipconfig /renew.","netstat -r.","tracert -h 5.","shutdown /r /t 0."],"correct":0,"explain":"ipconfig /renew requests a new lease from DHCP.","wrongExplain":["","netstat -r displays the routing table; it does not request a new address from DHCP.","tracert -h 5 traces the path to a destination limited to 5 hops; it plays no role in obtaining a new IP lease.","shutdown /r /t 0 simply restarts the computer immediately; it is not the command used to explicitly request a new DHCP lease."],"sub":"2.1"},{"id":"q0270","domain":"Networking","q":"A company uses centralized authentication so users can sign in with the same account across many systems. Which supporting network service best fits that function?","choices":["Directory service.","Time service.","Mail relay.","Name cache."],"correct":0,"explain":"Directory services such as Active Directory provide centralized authentication and authorization.","wrongExplain":["","A time service like NTP synchronizes clocks across devices; it does not authenticate users or manage accounts.","A mail relay forwards email between servers and has no role in centralized user authentication.","A name cache stores recently resolved DNS lookups temporarily; it is unrelated to identity or account management."],"sub":"2.1"},{"id":"q0271","domain":"Networking","q":"A technician suspects a bad patch cable between a PC and switch because connectivity drops when the cable is moved. Which issue is most likely being confirmed?","choices":["Intermittent cable fault.","DNS cache poisoning.","SMTP relay denial.","Duplicate time source."],"correct":0,"explain":"Connectivity that changes with cable movement usually points to a physical layer problem such as a broken conductor or poor termination.","wrongExplain":["","DNS cache poisoning is a security attack that corrupts stored name-resolution records; it has nothing to do with a physical patch cable.","SMTP relay denial concerns a mail server refusing to forward messages, unrelated to a cable connection dropping when moved.","A duplicate time source describes conflicting NTP servers, not a physical-layer cabling problem."],"sub":"2.6"},{"id":"q0272","domain":"Mobile Devices","q":"A user’s phone can charge, but the battery percentage never increases and the device gets unusually warm. The cable is known-good. What is the best next step?","choices":["Try a higher-amperage charger first","Replace the charging port assembly","Inspect for liquid damage and swelling","Check battery-health and thermal warnings"],"correct":2,"explain":"Heat + no charge gain strongly suggests battery/charging circuit issues and potential battery swelling or damage. Inspect immediately for safety before swapping ports or changing settings.","wrongExplain":["Jumping straight to a higher-amperage charger risks pushing more current into a battery that may already be damaged or swelling, which is unsafe before an inspection.","The symptoms (heat, no charge gain) point to the battery/charging circuit rather than the port itself, and replacing a part before inspecting for damage skips a needed safety check.","","Checking software battery-health warnings is reasonable, but it doesn't address the immediate physical safety concern of a possibly swollen or damaged battery, which needs a hands-on inspection first."],"sub":"1.1"},{"id":"q0273","domain":"Mobile Devices","q":"A technician needs to connect a laptop to a smartphone for internet access using a cable to reduce RF interference. Which method should be used?","choices":["Bluetooth PAN tethering mode","USB tethering configuration","Wi-Fi hotspot tethering mode","Mobile broadband via SIM slot"],"correct":1,"explain":"USB tethering provides a wired path, avoids Wi-Fi RF congestion, and is common for reliable laptop internet via a phone.","wrongExplain":["Bluetooth PAN tethering is a wireless connection that still uses RF, which is exactly what the technician is trying to avoid.","","Wi-Fi hotspot tethering also relies on RF wireless transmission, not a physical cable.","Mobile broadband via a SIM slot uses the laptop's own built-in cellular modem, not a tethered connection to the phone at all."],"sub":"1.3"},{"id":"q0274","domain":"Mobile Devices","q":"A tablet’s touchscreen intermittently registers taps in the wrong location after screen replacement. What is the most likely fix?","choices":["Re-seat the digitizer ribbon cable","Calibrate the touchscreen digitizer","Update the tablet firmware package","Replace the display adhesive layer"],"correct":0,"explain":"After a screen repair, misaligned/intermittent touch is commonly caused by a loose digitizer connector or improperly seated ribbon.","wrongExplain":["","Calibration adjusts how touch coordinates are mapped, but it wouldn't explain intermittent misregistration that appeared specifically after a screen replacement, which points to a physical connection issue.","A firmware update is unlikely to fix a problem that was introduced by physically disturbing the digitizer cable during a screen swap.","Display adhesive affects how firmly the screen is bonded to the housing; it does not affect how accurately touch input is registered."],"sub":"1.1"},{"id":"q0275","domain":"Mobile Devices","q":"A user wants to pay with their phone at terminals that support tap-to-pay. Which feature is required?","choices":["NFC with secure element enabled","Bluetooth Low Energy turned on","Infrared port configured correctly","USB-C OTG activated on device"],"correct":0,"explain":"Tap-to-pay relies on NFC and typically uses a secure element or equivalent secure storage for payment credentials.","wrongExplain":["","Bluetooth Low Energy is used for short-range pairing and proximity features, not for communicating with contactless payment terminals.","Infrared ports are largely obsolete on modern phones and were never used for payment terminal communication.","USB-C OTG allows connecting peripherals like drives or keyboards; it has no role in contactless tap-to-pay transactions."],"sub":"1.3"},{"id":"q0276","domain":"Mobile Devices","q":"A user reports their phone’s screen is very dim even at maximum brightness, but an external flashlight reveals an image. What failed component is most likely?","choices":["Backlight or display inverter circuit","LCD panel signal cable damage","Ambient light sensor misreading","Display power-management setting"],"correct":0,"explain":"A visible image with no illumination points to backlight circuitry failure (common symptom across many displays).","wrongExplain":["","Signal cable damage to the LCD panel typically produces distorted, garbled, or missing image content, not simply a dim-but-visible image with normal brightness settings applied.","An ambient light sensor issue would cause auto-brightness to misjudge the environment, but it wouldn't prevent the display from being bright at a manually-set maximum brightness.","A power-management setting limiting brightness would still respond to the user setting brightness to maximum; it wouldn't explain an image that's only visible with an external light source."],"sub":"1.1"},{"id":"q0277","domain":"Networking","q":"A workstation shows an APIPA address and cannot reach any network resources. The link light is on. What is the most likely cause?","choices":["DHCP server is unreachable or down","DHCP scope is fully exhausted","Wrong VLAN on the switch port","Duplicate IP address conflict"],"correct":0,"explain":"APIPA (169.254.x.x) indicates the device could not obtain an address from DHCP.","wrongExplain":["","A fully exhausted DHCP scope is one specific possible cause of APIPA, but it's a narrower scenario than the DHCP server simply being unreachable or down, which is the more general and likely first cause to check.","A wrong VLAN would usually prevent the client from reaching anything on the network at all, and doesn't as directly explain the specific APIPA fallback behavior as a missing DHCP response.","Windows displays an explicit IP conflict warning when it detects a duplicate address; it does not silently fall back to an APIPA address in that case."],"sub":"2.2"},{"id":"q0278","domain":"Networking","q":"A technician must connect a switch to a router in a small office. Which cable type is typically used?","choices":["Straight-through Ethernet cable","Crossover Ethernet cable only","Console rollover serial cable","Shielded Cat6a patch cable"],"correct":0,"explain":"Modern devices often auto-MDI/MDIX, but standard guidance: unlike devices (router to switch) use straight-through.","wrongExplain":["","Crossover cables are used to connect like devices directly (e.g., switch to switch); connecting unlike devices like a router to a switch traditionally calls for a straight-through cable.","A console rollover cable is used for out-of-band CLI management connections to a device's console port, not for normal data connectivity between a router and switch.","Shielded Cat6a describes cable shielding and category, not the straight-through vs. crossover wiring standard the question is actually asking about."],"sub":"2.6"},{"id":"q0279","domain":"Networking","q":"A user can resolve hostnames but cannot reach a remote website by IP or name. Other sites work. What should be checked first?","choices":["Route to the destination network","Default gateway to that site","Proxy or content-filter rule","Upstream firewall ACL entry"],"correct":0,"explain":"If resolution works yet a specific site is unreachable by IP or name, the path/route or upstream connectivity to that network is the likely issue.","wrongExplain":["","If the default gateway were the problem, the workstation would typically lose connectivity to most or all outside destinations, not just fail to reach one specific site while others succeed.","A proxy or content-filter rule is a plausible cause, but it's a more specific configuration to check after first confirming there's a valid path/route to that destination.","An upstream firewall ACL entry is possible, but checking your own local route to the destination network is the more direct first step before assuming it's an upstream device."],"sub":"2.1"},{"id":"q0280","domain":"Networking","q":"A new VoIP deployment experiences choppy audio during heavy file transfers. Which configuration would most directly help?","choices":["Enable QoS for voice traffic queues","Increase bandwidth reservation for voice","Place phones on a separate voice VLAN","Lower codec quality on handsets"],"correct":0,"explain":"QoS prioritizes latency-sensitive voice packets over bulk transfers, reducing jitter and choppiness.","wrongExplain":["","Increasing bandwidth reservation can help overall capacity, but it doesn't directly prioritize voice packets over other traffic during congestion the way QoS queuing does.","Placing phones on a separate voice VLAN is good practice for segmentation, but by itself it doesn't guarantee voice traffic is prioritized ahead of a heavy file transfer sharing the same uplink.","Lowering codec quality reduces bandwidth needs but sacrifices call quality and doesn't fix the underlying lack of traffic prioritization causing the choppiness."],"sub":"2.4"},{"id":"q0281","domain":"Networking","q":"A technician needs to verify that a DNS name resolves to the correct IP address from a Windows client. Which tool is best?","choices":["nslookup command-line utility","ping command with hostname","ipconfig /displaydns review","tracert path discovery tool"],"correct":0,"explain":"nslookup queries DNS directly and displays the resolved address.","wrongExplain":["","Pinging a hostname confirms basic reachability and indirectly performs a lookup, but it isn't a dedicated tool for verifying DNS resolution details the way nslookup is.","ipconfig /displaydns shows entries already cached locally; it doesn't actively query DNS to verify current resolution.","tracert shows the hop-by-hop path to a destination; it isn't focused on confirming that a name resolves to the correct address."],"sub":"2.1"},{"id":"q0282","domain":"Networking","q":"A user complains their Wi-Fi is slow only in one conference room. Signal strength is low and interference is likely. What is the best first action?","choices":["Survey channels and adjust AP band","Move the client to 5 GHz","Relocate or add an access point","Reduce co-channel interference nearby"],"correct":0,"explain":"A site survey/channel assessment is the first step for localized Wi-Fi performance issues and interference.","wrongExplain":["","Moving the client to 5 GHz might help, but without first surveying channels and interference, it's a guess rather than a step based on data.","Relocating or adding an access point is a reasonable follow-up once a survey identifies a coverage or interference problem, but it's premature as the very first action.","\"Reducing co-channel interference nearby\" is vague and not an actionable first step until a channel/interference survey identifies what's actually causing the problem."],"sub":"2.3"},{"id":"q0283","domain":"Hardware","q":"A desktop powers on but no video appears. Fans spin and the system beeps one long and two short tones. What is the most likely issue?","choices":["Video adapter failure or not seated","DIMM not seated correctly","PCIe auxiliary power unplugged","Wrong monitor input selected"],"correct":0,"explain":"A common POST beep pattern indicates a video/graphics problem (card failure or seating).","wrongExplain":["","An unseated DIMM typically produces a different POST beep pattern (often continuous or repeating beeps) rather than the classic one-long-two-short video error code.","Missing PCIe auxiliary power to a GPU usually prevents the system from POSTing at all or triggers a distinct power-related alarm, not this specific video-error beep sequence.","Beep codes are generated by the BIOS/POST process before any video output exists; selecting the wrong monitor input wouldn't cause the system to beep at all."],"sub":"3.2"},{"id":"q0284","domain":"Hardware","q":"A technician wants the fastest storage for an OS drive in a modern laptop. Which option is best?","choices":["NVMe M.2 solid-state drive","SATA M.2 solid-state drive","2.5-inch SATA solid-state drive","Hybrid SSHD 2.5-inch drive"],"correct":0,"explain":"NVMe over PCIe provides the highest throughput and lowest latency among these options.","wrongExplain":["","A SATA M.2 drive uses the same connector shape but is still bottlenecked by the SATA bus (~600 MB/s), far slower than NVMe over PCIe.","A 2.5-inch SATA SSD is limited by the same SATA interface speed cap, making it slower than an NVMe drive.","A hybrid SSHD combines a spinning platter with a small flash cache and is considerably slower overall than a true solid-state NVMe drive."],"sub":"3.3"},{"id":"q0285","domain":"Hardware","q":"A user adds new RAM and the system becomes unstable with random reboots. The RAM is the correct type. What should be done next?","choices":["Verify timings/voltage and reseat","Run memory diagnostics on new DIMMs","Check BIOS for XMP compatibility","Test each module individually"],"correct":0,"explain":"Incompatibility often comes from timings/voltage, mixed kits, or poor seating. Start by reseating and verifying BIOS settings.","wrongExplain":["","Running memory diagnostics can help confirm a bad module, but it doesn't address a likely settings/seating cause and is a more involved step than a quick reseat and voltage check.","Checking BIOS XMP settings addresses only the timing/voltage profile; it skips the equally important step of physically reseating the modules first.","Testing modules individually helps isolate a specific bad DIMM, but that troubleshooting step logically comes after ruling out simple seating and voltage/timing mismatches."],"sub":"3.4"},{"id":"q0286","domain":"Hardware","q":"A technician must connect a modern monitor to a PC for both video and audio over a single cable. Which interface is best?","choices":["HDMI digital audio/video link","DisplayPort digital audio/video","USB-C with DisplayPort Alt Mode","DVI-D video-only connection"],"correct":0,"explain":"HDMI carries digital video and audio. VGA and DVI-D are video-only in typical PC contexts.","wrongExplain":["","DisplayPort can also carry combined digital audio and video, but it isn't as universally present on standard monitors and PCs as HDMI, which is the far more common connector for this basic use case.","USB-C with DisplayPort Alt Mode requires specific USB-C video support on both the PC and monitor, which isn't guaranteed the way a standard HDMI port is.","DVI-D is a digital video-only connector with no audio channel, so it cannot meet the requirement of carrying both video and audio over one cable."],"sub":"3.1"},{"id":"q0287","domain":"Hardware","q":"A workstation needs additional graphics performance for 3D modeling. Which component upgrade is most appropriate?","choices":["Install a dedicated PCIe GPU card","Increase system RAM capacity","Upgrade to a faster workstation CPU","Move project files to an SSD"],"correct":0,"explain":"3D workloads benefit most from a dedicated GPU with appropriate VRAM and compute capability.","wrongExplain":["","Adding more system RAM mainly helps with multitasking and large datasets in memory; it does little to improve GPU-bound 3D rendering performance.","A faster CPU can help in some workflows, but 3D modeling and rendering performance is primarily limited by the graphics processor, not CPU speed.","Moving files to an SSD speeds up loading and saving project data but has no effect on real-time 3D rendering or graphics performance."],"sub":"3.4"},{"id":"q0288","domain":"Hardware","q":"A technician is selecting a UPS for a single desktop and monitor. Which UPS specification matters most for runtime estimation?","choices":["VA rating and battery capacity","Watt rating under expected load","Runtime at half-load estimate","Line-interactive output topology"],"correct":0,"explain":"Load handling and runtime depend on VA/watt capability and battery capacity.","wrongExplain":["","A raw watt rating under expected load is useful, but UPS runtime is fundamentally derived from VA capacity and battery capacity together, not wattage alone.","\"Runtime at half-load\" is a pre-calculated datasheet figure tied to a specific load and product, not the underlying specification (VA/battery capacity) a technician uses to estimate runtime for a given actual load.","Line-interactive output topology describes how the UPS regulates and switches power, not how much capacity or runtime it provides."],"sub":"3.4"},{"id":"q0289","domain":"Hardware","q":"A laptop’s internal drive is being replaced. The laptop uses a small card-like SSD mounted on the motherboard with a single screw. Which drive type is this?","choices":["M.2 form factor solid-state drive","mSATA solid-state drive module","2.5-inch SATA solid-state drive","Mini-PCIe expansion card"],"correct":0,"explain":"A small gumstick drive secured by one screw is typical of M.2 SSDs (SATA or NVMe).","wrongExplain":["","mSATA modules are an older, differently-shaped format than the small gumstick-style, single-screw-mounted card described here, and mSATA is largely obsolete in modern laptops.","A 2.5-inch SATA SSD is a larger drive connected with separate data and power cables, not a small card mounted directly to the motherboard with one screw.","Mini-PCIe cards were typically used for older Wi-Fi or modem cards, not storage, and are physically and electrically different from M.2."],"sub":"3.4"},{"id":"q0290","domain":"Hardware","q":"A laser printer produces faded output and the print density setting does not help. The toner is not low. What should be replaced next?","choices":["Imaging drum unit assembly","Fuser assembly maintenance kit","Transfer roller replacement kit","Toner cartridge agitator gear"],"correct":0,"explain":"Consistently faded prints with adequate toner often indicates a worn drum/photoconductor or related imaging components.","wrongExplain":["","A worn fuser typically causes toner smearing, ghosting, or poor bonding to the page, not a uniform fading of the print with normal toner levels.","A failing transfer roller more commonly causes spotting, streaking, or uneven toner transfer patterns rather than an overall consistent fade.","A worn agitator gear tends to cause inconsistent or intermittent toner distribution problems, not a steady overall fading unrelated to toner supply."],"sub":"3.6"},{"id":"q0291","domain":"Hardware","q":"A printer repeatedly jams at the point where paper enters the device. What is the most likely cause?","choices":["Worn pickup rollers in tray","Worn separation pad in tray","Paper guides set too tight","Damaged feed roller clutch"],"correct":0,"explain":"Jams at entry commonly come from worn pickup rollers or separation pads failing to feed cleanly.","wrongExplain":["","A worn separation pad typically causes multiple sheets to feed at once (multi-feed jams), rather than a jam right where paper enters the printer.","Paper guides set too tight would more likely cause skewed feeding or paper binding at the tray edges, not a wear-related jam pattern.","A damaged feed roller clutch usually affects the timing/synchronization of feeding further along the path, a less common cause of a jam specifically at the entry point."],"sub":"3.6"},{"id":"q0292","domain":"Hardware","q":"An inkjet printer has streaks and missing lines across multiple colors. What is the best initial maintenance step?","choices":["Run printhead cleaning alignment","Perform nozzle check and alignment","Replace the affected ink cartridges","Clean encoder strip if supported"],"correct":0,"explain":"Most inkjet driver utilities combine a nozzle check with a cleaning cycle under one \"clean printheads\" action, so running it is the fastest first step for streaks/missing lines before considering cartridge replacement.","wrongExplain":["","A standalone nozzle check prints a diagnostic pattern to confirm which nozzles are clogged, but most printers bundle this into the cleaning utility itself, so it isn't a separate \"best initial\" step on its own.","Replacing ink cartridges is a costly step that skips the simpler, more likely fix — clogged nozzles from disuse are usually cleared by running the printer's built-in cleaning cycle first.","An encoder strip problem typically causes print head positioning errors or banding as the carriage moves, not color streaking caused by nozzle clogging."],"sub":"3.6"},{"id":"q0293","domain":"Hardware","q":"A technician must configure a printer so multiple PCs can print without direct USB connections. Which solution best fits?","choices":["Network printer via Ethernet/Wi-Fi","USB printer shared from a host PC","Printer attached to an external print server","Wireless direct printing only"],"correct":0,"explain":"A network printer (or a printer shared via print server) supports multiple clients without USB to each PC.","wrongExplain":["","Sharing a USB printer from a host PC makes that PC's availability a single point of failure, and is a less direct/clean solution than a printer with native network connectivity.","An external print server for a USB printer can work, but it requires extra hardware compared to simply using a printer with built-in network capability.","Wireless direct printing typically connects to only one device at a time rather than supporting simultaneous access from multiple PCs."],"sub":"3.6"},{"id":"q0294","domain":"Virtualization and Cloud Computing","q":"A user wants to run a second OS on their laptop for testing without rebooting, using a hosted environment on the same machine. What is needed?","choices":["Type 2 hypervisor installed locally","Dual-boot with separate partitions","Remote desktop to a lab server","Nested VM inside cloud instance"],"correct":0,"explain":"A Type 2 hypervisor runs on top of a host OS and allows guest OSs without rebooting.","wrongExplain":["","Dual-booting requires selecting an OS at startup and rebooting into it, which directly conflicts with the requirement to run a second OS without rebooting.","Remote desktop to a lab server runs the second OS on a separate remote machine, not locally hosted on the user's own laptop.","A nested VM inside a cloud instance depends on cloud infrastructure rather than running locally on the laptop as requested."],"sub":"4.2"},{"id":"q0295","domain":"Virtualization and Cloud Computing","q":"A small business wants to reduce on-prem hardware by using email and document editing in a browser with minimal local installs. Which model fits best?","choices":["SaaS cloud productivity suite","Hosted virtual desktop service","PaaS application runtime platform","IaaS virtual server instance"],"correct":0,"explain":"Browser-based email/docs is a classic SaaS use case.","wrongExplain":["","A hosted virtual desktop provides an entire remote desktop environment, which is more infrastructure than needed for simple browser-based email and document editing.","PaaS provides a platform for developers to build and run custom applications; it isn't a ready-to-use email/office suite.","IaaS provides raw virtualized servers and storage that the business would still have to configure and manage software on, unlike a ready-made browser-based suite."],"sub":"4.1"},{"id":"q0296","domain":"Virtualization and Cloud Computing","q":"A technician is troubleshooting a VM that has no network connectivity, but the host can browse normally. What should be checked first?","choices":["Virtual switch and NIC assignment","Guest NIC set to disconnected","Wrong NAT or bridged mode selected","Guest firewall blocking outbound traffic"],"correct":0,"explain":"VM networking often breaks due to incorrect virtual switch mode (NAT/bridged) or wrong virtual NIC mapping.","wrongExplain":["","A disconnected guest NIC is one specific possible cause, but checking the overall virtual switch and NIC assignment is the broader first step that would reveal this and other mapping issues.","An incorrect NAT/bridged mode selection is itself part of the virtual switch configuration, so checking the virtual switch and NIC assignment as a whole is the more complete first step.","Since the host can browse normally while only the guest fails, the issue is more likely in the virtualization networking layer than the guest's own firewall."],"sub":"4.2"},{"id":"q0297","domain":"Hardware and Network Troubleshooting","q":"A technician arrives on-site and sees a strong smell of burning plastic from a desktop. What is the best immediate action?","choices":["Power down and unplug immediately","Use a Class C extinguisher if needed","Isolate the device from combustibles","Do not continue normal diagnostics"],"correct":0,"explain":"Safety first: remove power to prevent fire risk and further damage before any diagnostics.","wrongExplain":["","Reaching for a fire extinguisher assumes an active fire; with only a smell and no visible flame, the appropriate first action is removing power, not immediately discharging an extinguisher.","Isolating the device from combustibles is a reasonable precaution, but the energized circuit causing the smell should be de-energized first by cutting power.","Stating not to continue diagnostics is true but passive — it doesn't describe the concrete action (removing power) needed to eliminate the immediate hazard."],"sub":"5.1"},{"id":"q0298","domain":"Hardware","q":"After replacing a motherboard, a PC powers on but cycles on/off repeatedly. The CPU and RAM are supported. What should be verified next?","choices":["Front-panel connector wiring pins","EPS12V CPU power cable seated","Motherboard short to the chassis","RAM seated in proper slots"],"correct":0,"explain":"A restart loop after a board swap often comes from miswired front-panel headers, shorts, or power/reset wiring.","wrongExplain":["","If the EPS12V CPU power connector were unseated, the system would typically fail to power on at all rather than cycle on and off repeatedly.","A short to the chassis is a possible cause of repeated power cycling too, but miswired front-panel headers are a more common and easier first thing to verify after a board swap.","The question already confirms the CPU and RAM are supported/compatible components; improperly seated RAM more typically produces a no-POST condition or beep codes rather than a repeating power-cycle pattern."],"sub":"3.4"},{"id":"q0299","domain":"Networking","q":"A user needs the best Wi-Fi performance in a high-density office while minimizing interference. Which band is most appropriate?","choices":["5 GHz band with more channels","6 GHz band where supported","20 MHz channels in 2.4 GHz","2.4 GHz band with fewer channels"],"correct":0,"explain":"5 GHz typically offers more non-overlapping channels and less interference than crowded 2.4 GHz.","wrongExplain":["","6 GHz (Wi-Fi 6E) can offer even less congestion, but it requires both the access points and client devices to support the newer band, which isn't guaranteed in a typical mixed-device office.","Using narrow 20 MHz channels in the already-crowded 2.4 GHz band limits throughput and does nothing to reduce the interference problem.","2.4 GHz has fewer non-overlapping channels than 5 GHz, so choosing it works against the goal of minimizing interference in a high-density environment."],"sub":"2.3"},{"id":"q0300","domain":"Networking","q":"A technician is asked which TCP port is commonly used for secure web browsing. Which port should they answer?","choices":["TCP 443 for HTTPS service","TCP 80 for HTTP service","TCP 8443 alternate HTTPS service","TCP 22 for SSH service"],"correct":0,"explain":"HTTPS typically uses TCP 443.","wrongExplain":["","TCP 80 is used for standard unencrypted HTTP traffic, not secure (encrypted) web browsing.","TCP 8443 is sometimes used as an alternate HTTPS port by specific applications, but it is not the standard, commonly expected port for secure web browsing.","TCP 22 is used for SSH remote administration and secure file transfer, not for web browsing."],"sub":"2.1"},{"id":"q0301","domain":"Networking","q":"A cable run between two network closets is experiencing EMI from nearby motors. Which medium best mitigates EMI over longer distance?","choices":["Fiber optic cabling installation","Shielded twisted pair cabling","Single-mode fiber backbone run","Plenum-rated Cat6 with shielding"],"correct":0,"explain":"Fiber is immune to electromagnetic interference and supports longer runs.","wrongExplain":["","Shielded twisted pair reduces EMI somewhat, but it is still far more susceptible to strong sources like motors than fiber, which is fully immune to electromagnetic interference.","Single-mode fiber is a specific fiber type intended for very long-distance runs; general fiber optic cabling is the more appropriate and sufficient answer for a run between two closets.","Plenum rating addresses fire-code safety for air-handling spaces, not EMI resistance, and Cat6 is still copper cabling that remains susceptible to electromagnetic interference even when shielded."],"sub":"2.6"},{"id":"q0302","domain":"Mobile Devices","q":"A company wants to enforce screen lock, remote wipe, and application policies on employee phones. What should be implemented?","choices":["Mobile device management platform","Mobile application management suite","Enterprise mobility management service","Company-owned device enrollment profile"],"correct":0,"explain":"MDM provides centralized policy enforcement, remote wipe, and device/app management.","wrongExplain":["","Mobile Application Management (MAM) controls specific apps and their data, but it doesn't provide full device-level policies like screen lock and remote wipe on the whole device.","Enterprise Mobility Management is a broader umbrella term that can include MDM and other tools; the specific capability described (device-level lock, wipe, and app policy) is what MDM directly provides.","A device enrollment profile is a method of registering a device into management, not the management platform itself that enforces the ongoing policies."],"sub":"1.1"},{"id":"q0303","domain":"Networking","q":"A phone connects to Wi-Fi but cannot browse the internet, while other devices on the same Wi-Fi can. Which setting is most likely wrong?","choices":["Incorrect DNS or gateway settings","Static IP set outside the subnet","Proxy settings enabled on device","Captive portal authentication pending"],"correct":0,"explain":"If other devices work, the network is fine; the phone likely has incorrect IP/DNS/gateway configuration.","wrongExplain":["","A static IP set outside the correct subnet would typically prevent the device from communicating with the gateway or other local devices at all, not just fail to reach the internet.","Misconfigured proxy settings usually block browsing more completely and consistently, and are a less common default cause than simple DNS/gateway misconfiguration.","A pending captive portal would normally show a login/authentication page rather than simply failing to load any site with no such prompt."],"sub":"2.3"},{"id":"q0304","domain":"Hardware","q":"A PC shuts down under load and the CPU temperature is very high. The fan spins. What is the most likely cause?","choices":["Thermal paste is dried or absent","Heatsink is not seated evenly","CPU fan curve set too low","Case airflow is badly restricted"],"correct":0,"explain":"Overheating under load often points to poor heat transfer—dried/missing thermal compound or poor heatsink seating.","wrongExplain":["","An unevenly seated heatsink would typically cause overheating from the very first use, rather than developing as an issue over time the way drying thermal paste does.","The fan is confirmed to be spinning, and a low fan curve would produce consistently elevated temperatures rather than the specific poor-heat-transfer pattern described.","Restricted case airflow raises overall system temperatures, but it's less specifically tied to a single component (the CPU) overheating under load compared to a direct heat-transfer problem at the CPU itself."],"sub":"3.4"},{"id":"q0305","domain":"Hardware","q":"A technician needs to connect a modern internal drive at SATA speeds. Which connector is required for data?","choices":["SATA 7-pin data cable link","Mini-SAS internal data connector","U.2 enterprise drive connector","M.2 edge connector interface"],"correct":0,"explain":"SATA uses a 7-pin data cable for data and a separate 15-pin power connector for power.","wrongExplain":["","A Mini-SAS connector is used to connect multiple SAS/SATA drives via a single cable in servers or RAID enclosures, not the standard single-drive SATA data connection.","U.2 is a connector used for high-performance enterprise NVMe drives, not standard SATA drives.","The M.2 edge connector is a completely different slot-based interface, not the 7-pin cable connector used by standard SATA drives."],"sub":"3.3"},{"id":"q0306","domain":"Mobile Devices","q":"A user wants to add a second monitor to a laptop that only has USB-C. Which capability must the USB-C port support to output video?","choices":["DisplayPort Alt Mode support","Thunderbolt video output support","USB-C dock with video chipset","HDMI alternate mode support"],"correct":0,"explain":"USB-C outputs video when it supports DisplayPort Alt Mode (or Thunderbolt, which can carry DP).","wrongExplain":["","Thunderbolt can carry DisplayPort video, but it requires additional Thunderbolt-specific certification and hardware that not every USB-C port includes, making DisplayPort Alt Mode the more general baseline requirement.","A USB-C dock with a video chipset is an external workaround device, not a description of what capability the laptop's own USB-C port must support.","There is no widely implemented \"HDMI Alt Mode\" standard for USB-C; USB-C video output relies on DisplayPort Alt Mode (or Thunderbolt), not HDMI."],"sub":"1.2"},{"id":"q0307","domain":"Hardware","q":"A laser printer outputs pages with toner that smears easily when touched. Which component is most likely failing?","choices":["Fuser assembly heating element","Fuser pressure roller assembly","Wrong paper type in driver","Low-temperature fuser setting"],"correct":0,"explain":"The fuser applies heat/pressure to bond toner to paper. Smearing indicates inadequate fusing.","wrongExplain":["","The pressure roller helps press toner into the paper but does not generate the heat needed to melt and bond it; a worn pressure roller more often causes creasing, wrinkling, or offset marks rather than easily-smeared toner.","An incorrect paper type setting can affect print quality (like curling or misfeeds), but it does not prevent the fuser from applying adequate heat, so it would not typically cause toner to smear when touched.","A manually configured low-temperature setting is a software/firmware choice rather than a component failure; while it could contribute to smearing, the described symptom points to a hardware fault in the heating element itself."],"sub":"3.6"},{"id":"q0308","domain":"Networking","q":"A user asks what device provides NAT, basic firewalling, and connects multiple wired clients in a home network. Which device is most accurate?","choices":["SOHO router with switch ports","Cable modem/router gateway combo","Wireless router with NAT enabled","Layer 3 switch with DHCP"],"correct":0,"explain":"A typical SOHO router combines NAT, firewall, routing, and often an integrated switch/Wi-Fi AP.","wrongExplain":["","A cable modem/router combo also provides NAT and routing, but it specifically requires a cable ISP connection, which isn't mentioned here, making the general SOHO router the better fit for the description.","A wireless router with NAT would add Wi-Fi capability, but the scenario specifically asks about connecting multiple wired clients, so the wireless-focused option is less precise than a router with dedicated switch ports.","A Layer 3 switch can route between VLANs and assign addresses, but it's an enterprise-grade device that doesn't typically provide NAT or firewalling for internet connections the way a home router does."],"sub":"2.5"},{"id":"q0309","domain":"Hardware","q":"A technician needs fault tolerance with minimal capacity loss using two drives. Which RAID level best fits?","choices":["RAID 1 mirroring configuration","RAID 0 striping only setup","RAID 5 parity across 3+","JBOD spanning configuration"],"correct":0,"explain":"RAID 1 mirrors two drives for redundancy (one can fail). RAID 0 has no fault tolerance; RAID 5 needs 3+ drives.","wrongExplain":["","RAID 0 stripes data across drives for performance but provides no redundancy at all — if either drive fails, all data is lost, so it offers no fault tolerance.","RAID 5 does provide fault tolerance, but it requires a minimum of three drives to store parity data, which exceeds the two-drive constraint in this scenario.","JBOD (spanning) simply combines drive capacity into one volume without mirroring or parity, so a single drive failure results in data loss just like RAID 0."],"sub":"3.3"},{"id":"q0310","domain":"Virtualization and Cloud Computing","q":"A VM is slow when multiple applications run, and the host has plenty of CPU but low free memory. What resource should be increased first?","choices":["Allocate additional RAM to VM","Reduce memory overcommit on host","Increase page file inside guest","Move VM to faster storage"],"correct":0,"explain":"Memory pressure causes swapping and severe slowdowns. If the host has RAM available, increase VM RAM first.","wrongExplain":["","Reducing overcommit is a host-wide capacity management change, but the scenario states the host has RAM available, so the direct fix is to give the struggling VM more memory rather than adjusting overcommit policy.","Increasing the guest's page file just relies more heavily on disk-based virtual memory, which is much slower than RAM and would worsen performance rather than solve the underlying memory shortage.","Faster storage would help with disk I/O bottlenecks, but the described symptom (low free memory with CPU to spare) points to a memory constraint, not a storage speed issue."],"sub":"4.2"},{"id":"q0311","domain":"Networking","q":"A technician is asked for the maximum recommended length of a standard copper Ethernet run (Cat5e/Cat6) between a switch and endpoint. What is the best answer?","choices":["100 meters for horizontal run","90 meters plus patch cables","328 feet per copper segment","30 meters for patch cable only"],"correct":0,"explain":"Standard Ethernet over twisted pair is typically 100 meters (328 feet) maximum per segment.","wrongExplain":["","This describes the internal breakdown (90m horizontal cable plus up to 10m of patch cords) rather than the overall maximum distance technicians are usually tested on, which is the combined 100-meter total.","328 feet is the imperial equivalent of 100 meters, so while numerically correct, it isn't phrased as the standard metric figure typically expected for this spec.","30 meters describes only a patch cable allowance, not the total maximum run length for a horizontal Ethernet segment, which is far short of the actual 100-meter limit."],"sub":"2.6"},{"id":"q0312","domain":"Mobile Devices","q":"A phone user wants their email to remain on the server and sync across multiple devices. Which protocol best matches this requirement?","choices":["IMAP synchronized mailbox access","Exchange ActiveSync mailbox sync","POP3 download-only mailbox mode","SMTP outbound mail relay use"],"correct":0,"explain":"IMAP keeps mail on the server and syncs state across clients. POP3 typically downloads locally.","wrongExplain":["","Exchange ActiveSync does sync mail and other data, but it's a Microsoft Exchange-specific protocol, not the general standards-based answer implied by the scenario, which best fits generic IMAP.","POP3 is designed to download messages to a single device and typically removes them from the server, which conflicts with the requirement to keep mail on the server and synced across devices.","SMTP is used only for sending outbound mail; it has no role in retrieving or syncing a mailbox's contents across devices."],"sub":"1.1"},{"id":"q0313","domain":"Virtualization and Cloud Computing","q":"A technician must enable virtualization extensions for a user’s lab software. Where is this setting typically changed?","choices":["UEFI/BIOS firmware configuration","Hypervisor settings in Windows","System Information virtualization report","CPU advanced settings menu"],"correct":0,"explain":"CPU virtualization features (Intel VT-x/AMD-V) are enabled in BIOS/UEFI.","wrongExplain":["","Hypervisor software settings (like Hyper-V configuration) manage virtual machines after virtualization is already enabled at the hardware level; they can't turn on the CPU extension itself.","The System Information utility can report whether virtualization is enabled, but it's a read-only diagnostic view, not a place where the setting is changed.","There's no separate 'CPU advanced settings' menu in Windows for enabling processor virtualization extensions; that control lives in the firmware setup utility (BIOS/UEFI), not the OS."],"sub":"4.2"},{"id":"q0314","domain":"Networking","q":"A small office wants strong Wi-Fi security with a shared passphrase (no RADIUS). Which option is best?","choices":["WPA2/WPA3 Personal with AES","WPA2 Personal with AES only","WPA3 Personal with SAE","WPA Enterprise with RADIUS"],"correct":0,"explain":"Without RADIUS, use WPA2/WPA3 Personal (PSK) with AES/CCMP for strong encryption.","wrongExplain":["","WPA2 Personal with AES is a valid strong option, but it's less current than including WPA3/SAE support, which offers improved protection against offline password attacks when available on both client and AP.","WPA3 Personal with SAE is the most modern shared-passphrase option, but limiting to only WPA3 could break compatibility with older client devices that don't support it, unlike a mixed WPA2/WPA3 mode.","WPA Enterprise requires a RADIUS authentication server, which the scenario explicitly says is not available, ruling out this option."],"sub":"2.3"},{"id":"q0315","domain":"Hardware","q":"A user wants to connect a legacy office projector that only supports VGA. The laptop has HDMI. Which adapter is needed?","choices":["HDMI to VGA active adapter","USB-C dock with VGA output","DisplayPort to VGA active adapter","VGA to HDMI converter box"],"correct":0,"explain":"HDMI is digital and VGA is analog; typically requires an active HDMI-to-VGA adapter for conversion.","wrongExplain":["","A USB-C dock with VGA output would work only if the laptop has a USB-C port; the scenario specifies the laptop has HDMI, so a dock built around USB-C isn't the direct match.","A DisplayPort to VGA adapter requires a DisplayPort output on the laptop, but the laptop in this scenario has HDMI, not DisplayPort, so this adapter wouldn't physically connect.","This adapter is wired backwards — it converts a VGA source to HDMI, which is the opposite of what's needed to send an HDMI laptop's signal to a VGA-only projector."],"sub":"3.1"},{"id":"q0316","domain":"Networking","q":"A network printer is reachable by IP, but users cannot print by hostname. What is the most likely issue?","choices":["DNS record missing or incorrect","Wrong printer hostname in TCP port","Stale mDNS or WSD discovery entry","Print server queue points elsewhere"],"correct":0,"explain":"IP connectivity is fine; hostname failure points to name resolution (DNS) rather than printer hardware.","wrongExplain":["","TCP ports are used for the print protocol itself, not hostname resolution; a port issue would affect the ability to send print data, not the ability to resolve a name to an IP address.","Stale local discovery entries (mDNS/WSD) mainly affect automatic network-neighborhood style discovery on a single subnet, whereas hostname resolution failures across a managed network more commonly point to DNS.","If the print server queue pointed to the wrong location entirely, printing would likely fail even by IP; since IP printing works fine, the issue is isolated to name resolution, not the queue's target."],"sub":"2.1"},{"id":"q0317","domain":"Mobile Devices","q":"A laptop display works on an external monitor but the internal screen is black. The brightness keys do nothing. What is the most likely cause?","choices":["Bad LCD cable or panel issue","Failed backlight power circuit","Lid-closure sensor stuck active","Loose display eDP connector"],"correct":0,"explain":"External video works, so GPU is fine. Internal display path likely has a cable/backlight/panel failure.","wrongExplain":["","A backlight failure alone usually produces a very dim but faintly visible image (sometimes viewable with a flashlight) rather than a fully black screen, and wouldn't explain why the brightness keys are completely unresponsive.","A stuck lid sensor would suppress the internal display specifically to save power when it thinks the lid is closed, but the brightness keys would typically still register a response rather than doing nothing at all.","A loose eDP connector is a plausible specific cause, but it's really a narrower case of the general cable/panel fault already captured by the marked answer, which better reflects the range of likely hardware causes here."],"sub":"1.2"},{"id":"q0318","domain":"Networking","q":"A technician needs to test continuity and correct pinout on a twisted-pair cable run. Which tool should be used?","choices":["Cable tester with wiremap","Tone generator and probe kit","Multimeter set to continuity","Loopback plug for NIC testing"],"correct":0,"explain":"A cable tester/wiremap verifies continuity, opens, shorts, and correct pair mapping.","wrongExplain":["","A tone generator and probe are used to trace and identify a specific cable within a bundle or wall, not to verify pin-by-pin continuity or correct pair wiring.","A multimeter can check basic continuity one wire at a time, but it can't quickly verify all eight conductors and their correct pinout order the way a dedicated wiremap cable tester can.","A loopback plug tests a NIC's transmit/receive circuitry by looping signals back to itself; it doesn't test the physical continuity or pinout of a cable run."],"sub":"2.2"},{"id":"q0319","domain":"Virtualization and Cloud Computing","q":"A company requires that cloud resources be dedicated to their organization only, hosted by a provider, and not shared with other tenants. What model is this?","choices":["Private cloud hosted deployment","Single-tenant hosted environment","Public cloud shared multi-tenant","Hybrid cloud with on-prem only"],"correct":0,"explain":"A hosted private cloud is dedicated to one organization while still hosted by a third-party provider.","wrongExplain":["","'Single-tenant hosted environment' describes a similar concept in plain language, but it isn't the standard CompTIA cloud deployment model terminology; 'private cloud' is the recognized term for dedicated, non-shared cloud resources.","Public cloud resources are shared among multiple tenants by design, which directly contradicts the requirement that resources not be shared with other organizations.","Hybrid cloud combines private/on-prem resources with public cloud resources; describing it as 'on-prem only' misrepresents the hybrid model and doesn't match a scenario where resources are hosted by a provider."],"sub":"4.1"},{"id":"q0320","domain":"Hardware","q":"A technician installs a high-end GPU that requires additional power. Which connector is commonly used for GPU auxiliary power?","choices":["PCIe 6/8-pin power connector","12VHPWR GPU power connector","Dual 6-pin PCIe adapters","Molex-to-PCIe power adapter"],"correct":0,"explain":"Dedicated GPUs often require PCIe 6-pin or 8-pin (or 12VHPWR on newer) auxiliary power connectors.","wrongExplain":["","12VHPWR is a newer high-wattage connector found mainly on recent high-end GPUs (like RTX 40-series); it's valid but a less universally 'common' answer than the long-standard PCIe 6/8-pin connector.","Dual 6-pin adapters are a workaround used when a power supply lacks the proper connector, converting other cables into PCIe power rather than being the standard connector type itself.","A Molex-to-PCIe adapter is also a workaround cable used on older power supplies without native PCIe connectors, not the standard connector found directly on modern GPUs or power supplies."],"sub":"3.1"},{"id":"q0321","domain":"Networking","q":"A host has IP 192.168.10.25 with subnet mask 255.255.255.0. Which address is t
