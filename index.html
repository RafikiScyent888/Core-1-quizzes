rather than on the CPU?","choices":["LGA socket design platform type","PGA socket design platform type","BGA soldered CPU package type","SP3 server socket platform"],"correct":0,"explain":"LGA (Land Grid Array) typically places pins in the socket, not on the CPU.","wrongExplain":["","PGA (Pin Grid Array) is the opposite arrangement — the pins are located on the CPU itself rather than in the socket, so PGA chips are more prone to bent-pin damage during installation.","BGA packages are soldered directly to the motherboard and aren't installed or removed by a technician at all, so there's no insertion step where pins could be bent.","SP3 is an AMD server-platform socket that uses a PGA-style CPU with pins on the chip package, not in the socket, so it doesn't match the 'pins in the socket' description."],"sub":"3.4"},{"id":"q0324","domain":"Hardware","q":"A laser printer prints with a consistent ghost image repeating down the page at regular intervals. What is the most likely culprit?","choices":["Imaging drum or fuser defect","Transfer roller surface defect","Toner cartridge sealing issue","Wrong paper type calibration"],"correct":0,"explain":"Repeating artifacts at a fixed interval often trace to drum circumference issues or fuser roller defects.","wrongExplain":["","A transfer roller defect could cause repeating marks, but it's a narrower single cause compared to the marked answer, which covers the more commonly tested culprits (drum/fuser) responsible for fixed-interval ghosting.","A sealing issue with the toner cartridge tends to cause spills, streaking, or contamination rather than a clean, repeating ghost image at a regular interval.","An incorrect paper type setting affects general print quality (like fusing or texture), but it wouldn't create a ghost image repeating at a fixed mechanical interval tied to a rotating component."],"sub":"3.6"},{"id":"q0325","domain":"Networking","q":"A technician must install IP phones and wants to power them over the Ethernet cable. Which switch feature is required?","choices":["Power over Ethernet capability","Voice VLAN support on switch","LLDP-MED device negotiation","Inline power budget available"],"correct":0,"explain":"PoE supplies power over Ethernet to compatible devices like VoIP phones and APs.","wrongExplain":["","Voice VLAN support helps separate and prioritize voice traffic for QoS purposes, but it does not supply electrical power to the phones over the cable.","LLDP-MED helps negotiate power and VLAN settings between the switch and phone, but the phone still needs the switch to be capable of delivering power (PoE) in the first place.","An adequate power budget is necessary for a PoE switch to power multiple devices simultaneously, but the switch must support PoE at all before budget becomes relevant — budget alone isn't the enabling feature."],"sub":"2.2"},{"id":"q0326","domain":"Hardware and Network Troubleshooting","q":"While replacing RAM, what is the best way to reduce the risk of electrostatic discharge damage?","choices":["Use an ESD strap to ground","Touch grounded metal before handling","Use an antistatic mat on bench","Handle DIMMs by the edges"],"correct":0,"explain":"An ESD strap (properly grounded) and ESD-safe handling procedures reduce electrostatic risk.","wrongExplain":["","Touching grounded metal once before starting only discharges static at that moment; it doesn't provide continuous grounding while working, so static can rebuild as you move and handle components, unlike a worn ESD strap.","An antistatic mat is a good complementary practice for bench work, but by itself it doesn't ground the technician's body, which is the primary path through which ESD damages sensitive components.","Handling DIMMs by their edges avoids touching sensitive contacts and is good practice, but it does nothing to prevent a static charge from discharging into the module in the first place."],"sub":"5.2"},{"id":"q0327","domain":"Networking","q":"A remote employee needs secure access to internal resources over the internet. Which solution best provides this?","choices":["VPN tunnel to company gateway","SSL VPN client connection","Remote desktop through VPN","Site-to-site VPN concentrator"],"correct":0,"explain":"A VPN encrypts traffic and provides authenticated access without exposing internal services directly to the internet.","wrongExplain":["","An SSL VPN client connection is one specific implementation of a VPN tunnel, but the more general and complete answer covering client-to-gateway remote access is simply a VPN tunnel to the company's gateway.","Remote desktop through a VPN describes an additional application layered on top of a VPN connection, not the core access solution itself, which is the VPN tunnel providing the secure path.","A site-to-site VPN concentrator connects two networks (like two offices) together, not an individual remote employee's device to the company network."],"sub":"2.5"},{"id":"q0328","domain":"Hardware and Network Troubleshooting","q":"A laptop battery is swollen and the trackpad is bulging upward. What should be done first?","choices":["Power down and remove battery","Stop charging and isolate device","Follow lithium battery safety steps","Do not puncture or reuse pack"],"correct":0,"explain":"Swollen lithium batteries are a safety hazard. Power down and follow safe removal/disposal procedures.","wrongExplain":["","Stopping the charge and isolating the device is an important early action, but powering the device fully down first is generally the more immediate first step before deciding how to isolate it.","'Follow lithium battery safety steps' is really a category label describing the overall process rather than a distinct first action a technician performs.","Not puncturing or reusing the pack is a correct handling rule for later in the process, but it isn't itself the first action to take when the hazard is first discovered."],"sub":"5.1"},{"id":"q0329","domain":"Virtualization and Cloud Computing","q":"A user wants to store and sync files across devices with version history managed by a provider. Which service category fits best?","choices":["Cloud storage synchronization SaaS","Managed file sync service","Hosted collaboration storage platform","On-prem NAS with no internet"],"correct":0,"explain":"Sync + versioning + multi-device access aligns with cloud storage/sync services (SaaS).","wrongExplain":["","'Managed file sync service' describes a similar function in generic terms, but it doesn't map to the standard CompTIA cloud service model category (SaaS) that this kind of consumer-facing sync tool falls under.","'Hosted collaboration storage platform' is a plausible-sounding label, but it isn't the standard cloud service model terminology tested, unlike the well-defined SaaS category.","An on-premises NAS with no internet connectivity cannot sync files across devices or be managed by an outside provider, which directly contradicts the requirements in the scenario."],"sub":"4.1"},{"id":"q0330","domain":"Networking","q":"A technician is asked which Wi-Fi standard is commonly associated with Wi-Fi 6. What is the best answer?","choices":["802.11ax wireless standard name","802.11ac wireless standard name","802.11be wireless standard name","802.11n wireless standard name"],"correct":0,"explain":"Wi-Fi 6 corresponds to 802.11ax.","wrongExplain":["","802.11ac is the standard behind Wi-Fi 5, an earlier generation, not Wi-Fi 6.","802.11be is the standard behind Wi-Fi 7, a newer generation released after Wi-Fi 6, not the one associated with it.","802.11n is the standard behind Wi-Fi 4, a much older generation than Wi-Fi 6."],"sub":"2.3"},{"id":"q0331","domain":"Hardware","q":"A user wants to store about 50GB on a single optical disc. Which media type best fits?","choices":["Dual-layer Blu-ray disc media","BD-R single-layer disc media","Dual-layer DVD+R disc media","Standard DVD-R disc media"],"correct":0,"explain":"Dual-layer Blu-ray provides ~50GB capacity. DVDs and CDs are far smaller.","wrongExplain":["","A single-layer BD-R holds about 25GB, roughly half the capacity needed to store 50GB on one disc.","A dual-layer DVD+R holds about 8.5GB, far short of the 50GB requirement.","A standard single-layer DVD-R holds only about 4.7GB, nowhere near enough capacity for 50GB of data."],"sub":"3.4"},{"id":"q0332","domain":"Hardware and Network Troubleshooting","q":"A technician makes a change that resolves a user issue. What should be done next per best practice?","choices":["Document findings and solution steps","Verify full system functionality","Communicate results to the user","Implement preventive recommendations"],"correct":1,"explain":"After implementing a fix, the next step in CompTIA's troubleshooting methodology is to verify full system functionality (and, if applicable, implement preventive measures) before closing out with documentation.","wrongExplain":["Documentation is the final step of the troubleshooting methodology, performed after the fix has been verified — not immediately after the change is made.","","Communicating results to the user is part of closing out the ticket, which happens after verification confirms the fix actually worked.","Preventive measures are considered during planning/implementation of the solution, not as a step that follows a fix that has already resolved the issue."],"sub":"5.1"},{"id":"q0333","domain":"Hardware","q":"A technician needs a compact desktop build but still wants a few expansion slots. Which motherboard form factor is most likely?","choices":["MicroATX compact expansion form","Mini-ITX compact system form","ATX full-size expansion form","FlexATX small desktop form"],"correct":0,"explain":"MicroATX is smaller than ATX but typically still offers multiple expansion slots.","wrongExplain":["","Mini-ITX is even more compact than MicroATX, but it typically has only a single expansion slot, which doesn't satisfy the requirement for 'a few' expansion slots.","Standard ATX is full-size and offers the most expansion slots, but it doesn't meet the requirement for a compact desktop build.","FlexATX is a smaller, less common form factor primarily used in low-profile or specialty systems, and it offers even fewer expansion options than MicroATX, making it a less fitting answer than the more standard MicroATX."],"sub":"3.4"},{"id":"q0334","domain":"Networking","q":"A host uses subnet mask 255.255.255.128. How many usable host addresses are in that subnet?","choices":["126 usable hosts per subnet","62 usable hosts per subnet","254 usable hosts per subnet","14 usable hosts per subnet"],"correct":0,"explain":"/25 yields 128 addresses total, minus network and broadcast = 126 usable.","wrongExplain":["","62 usable hosts corresponds to a /26 (255.255.255.192) subnet, not the /25 (255.255.255.128) mask given in this scenario.","254 usable hosts corresponds to a /24 (255.255.255.0) subnet, which is a much larger subnet than the /25 described here.","14 usable hosts corresponds to a /28 (255.255.255.240) subnet, a much smaller subnet than the one described."],"sub":"2.1"},{"id":"q0335","domain":"Mobile Devices","q":"A user wants the strongest practical device lock on a modern smartphone. Which option is generally the best?","choices":["Long alphanumeric passcode lock","Six-digit PIN with biometrics","Complex passcode with Face ID","Short PIN with swipe backup"],"correct":0,"explain":"Long alphanumeric passcodes typically provide the highest resistance to guessing compared with short PINs/patterns.","wrongExplain":["","Adding biometrics to a six-digit PIN improves convenience and adds a layer of authentication, but the underlying PIN itself still has a limited numeric keyspace that's weaker against a determined brute-force or shoulder-surfing attack than a long alphanumeric passcode.","Face ID combined with a complex passcode is strong, but it's essentially a variation on the same passcode-plus-biometric approach, and biometric unlock methods can sometimes be bypassed or spoofed more easily than the underlying passcode strength itself.","A short PIN with a swipe (pattern) backup is one of the weakest options listed, since both short numeric PINs and swipe patterns are relatively easy to guess or observe."],"sub":"1.1"},{"id":"q0336","domain":"Hardware","q":"A user complains of motion blur and wants a monitor that reduces blur during fast movement. Which spec most directly helps?","choices":["Higher refresh rate display panel","Lower pixel response time panel","Adaptive sync gaming display","Backlight strobing support mode"],"correct":0,"explain":"Higher refresh rate (and low response time) improves motion clarity in many scenarios.","wrongExplain":["","Lower (faster) pixel response time reduces ghosting from slow pixel transitions, but it addresses a different mechanism than the sample-and-hold motion blur that increasing refresh rate more directly improves.","Adaptive sync (like FreeSync/G-Sync) primarily eliminates screen tearing and stuttering by matching refresh rate to frame rate; it doesn't inherently reduce motion blur on its own.","Backlight strobing can reduce perceived blur but often requires a fixed refresh rate and reduces brightness, making it a more specialized/niche solution than simply increasing the panel's refresh rate."],"sub":"3.4"},{"id":"q0337","domain":"Networking","q":"A technician needs to allow inbound remote desktop to a specific PC from the local LAN only. What is the best control to adjust?","choices":["Host firewall inbound rule scope","Network profile set to Private","Remote Desktop allowed users list","Router ACL for local subnet only"],"correct":0,"explain":"Restricting inbound access is best done with a host firewall rule scoped to LAN subnets (and only the needed port).","wrongExplain":["","Setting the network profile to Private affects default firewall behavior and discoverability, but it doesn't itself create a specific scoped rule limiting RDP access to only the local subnet.","The Remote Desktop allowed users list controls which user accounts can log in once a connection is made, not which network locations are permitted to reach the RDP port in the first place.","A router ACL could restrict traffic at the network edge, but the scenario is about controlling access to 'a specific PC,' which is best handled by that PC's own host firewall rather than router-wide policy."],"sub":"2.2"},{"id":"q0338","domain":"Hardware","q":"A technician needs to add wireless capability to a desktop that has no built-in Wi-Fi. Which upgrade is most common?","choices":["Install PCIe Wi-Fi adapter card","Install USB Wi-Fi adapter dongle","Add an M.2 Wi-Fi adapter card","Replace motherboard with Wi-Fi"],"correct":0,"explain":"A PCIe Wi-Fi card (or USB Wi-Fi adapter) is typical; PCIe is common for internal desktop upgrades.","wrongExplain":["","A USB Wi-Fi dongle is a valid alternative for adding wireless capability, but it's generally considered less ideal for a permanent desktop upgrade compared to an internal PCIe card, which offers better antenna placement and doesn't tie up a USB port.","An M.2 Wi-Fi card is common in laptops with M.2 Wi-Fi slots, but most desktop motherboards don't expose a dedicated M.2 slot for wireless cards the way they do for PCIe slots, making PCIe the more typical desktop upgrade path.","Replacing the entire motherboard just to gain Wi-Fi is an unnecessarily expensive and disruptive solution when a simple, inexpensive expansion card can add the same capability."],"sub":"3.4"},{"id":"q0339","domain":"Hardware","q":"A color laser printer prints with a single color missing, but black prints fine. What is the most likely cause?","choices":["That color toner cartridge empty","Transfer belt issue for one color","Blocked toner path for that color","Failed imaging drum for that color"],"correct":0,"explain":"If one color is missing, the most likely cause is the specific toner cartridge (or its delivery path) for that color.","wrongExplain":["","A transfer belt problem would typically affect how all colors are laid down onto the page (causing streaks or misregistration across colors), rather than cleanly eliminating just one specific color.","A blocked toner path for one color is possible, but it's a less common failure mode than simply running out of toner, which is the far more frequent and straightforward explanation for one color going missing.","A failed imaging drum for one color station is possible but a less common and more complex failure than an empty toner cartridge, which is the first thing to check when a single color drops out."],"sub":"3.6"},{"id":"q0340","domain":"Networking","q":"Multiple users suddenly cannot get an IP address, but links are up and the DHCP server is running. What is a likely cause?","choices":["DHCP scope exhausted of leases","DHCP exclusions consume address pool","Wrong subnet mask in scope options","Rogue DHCP server offering bad leases"],"correct":0,"explain":"If DHCP is up but clients can’t obtain addresses, the scope may be exhausted or misconfigured.","wrongExplain":["","Exclusions reduce the available pool, but if they had already been configured, the problem wouldn't suddenly appear — a sudden onset points more directly to the pool simply running out of available leases over time.","An incorrect subnet mask in the scope would typically cause connectivity issues even for clients that do get an address, not prevent clients from getting an address at all.","A rogue DHCP server would more likely cause clients to receive incorrect or conflicting IP configuration (and often still get an address, just a wrong one), rather than being unable to obtain any address while the legitimate server is confirmed running."],"sub":"2.1"},{"id":"q0341","domain":"Virtualization and Cloud Computing","q":"A company wants inexpensive endpoints that mainly connect to a remote desktop environment, with minimal local storage. What device type best fits?","choices":["Thin client terminal endpoint device","Zero client VDI endpoint device","Mini PC with remote desktop client","Low-cost Chromebook endpoint"],"correct":0,"explain":"Thin clients are designed for VDI/RDS use with minimal local compute/storage.","wrongExplain":["","A zero client has essentially no local OS or configurable software at all — it's an even more stripped-down option than a thin client, which is the more commonly tested general-purpose answer for inexpensive VDI-focused endpoints.","A mini PC is a small but still general-purpose full computer with its own OS and local storage, which doesn't match the requirement for minimal local storage the way a purpose-built thin client does.","A Chromebook is a low-cost general computing device built around ChromeOS and web apps, not a purpose-built endpoint optimized specifically for connecting to a remote desktop/VDI environment."],"sub":"4.1"},{"id":"q0342","domain":"Hardware","q":"A user reports no audio from speakers connected to a desktop. Headphones work when plugged into the front panel. What is the best next step?","choices":["Check rear port and default output","Verify speaker power and volume","Confirm rear jack mapped to speakers","Test audio output in Sound settings"],"correct":0,"explain":"If front works but rear doesn’t, verify the correct output device/port selection and rear jack wiring/enablement.","wrongExplain":["","Checking that the speakers are powered on and the volume is turned up is a reasonable basic check, but since front headphones already work (confirming the system itself outputs audio), the more targeted next step is checking the rear port/output selection specifically.","Confirming the rear jack is correctly mapped to speakers is actually part of the broader step of checking the rear port and default output — it's a subset of the marked answer rather than a distinct, more complete first step.","Testing audio output in Sound settings is useful, but since headphones on the front panel already confirm the audio subsystem works, the issue is more specifically about the rear port/output selection rather than a general Sound settings test."],"sub":"3.4"},{"id":"q0343","domain":"Networking","q":"A user in a rural area needs broadband with high latency tolerance and no cable/DSL availability. Which option is most likely?","choices":["Satellite internet service option","Fixed wireless broadband option","Cellular hotspot broadband option","Legacy DSL bonded pair option"],"correct":0,"explain":"When cable/DSL/fiber aren’t available, satellite is a common rural broadband option (with higher latency).","wrongExplain":["","Fixed wireless requires line-of-sight to a nearby transmission tower, which may not be available in all rural areas, making it a less universally applicable option than satellite, which only needs a clear view of the sky.","A cellular hotspot depends on adequate cell tower coverage in the area, which can also be limited or unreliable in rural locations, and it wasn't specifically noted as available here.","The scenario explicitly states DSL is not available, ruling out any DSL-based option, bonded or otherwise."],"sub":"2.6"},{"id":"q0344","domain":"Hardware","q":"A laser printer repeatedly produces faint output across the entire page. Which component is MOST likely failing?","choices":["Pickup roller","Fuser assembly","Imaging drum","Transfer belt"],"correct":2,"explain":"A worn imaging drum cannot maintain a consistent electrostatic charge, causing faint or washed-out prints.","wrongExplain":["A worn pickup roller typically causes paper feed problems like jams or misfeeds, not faint print quality across the page.","A fuser problem more commonly causes smearing, poor adhesion, or hot/cold spots rather than a uniformly faint image across the entire page.","","A transfer belt issue in a color printer usually causes color registration problems or streaks rather than an overall faint appearance across the whole page."],"sub":"3.6"},{"id":"q0345","domain":"Hardware","q":"Which printer feature allows scanned documents to be delivered directly to email or SMB shares?","choices":["Duplexing","Scan-to-network","Secure print","Cloud spooling"],"correct":1,"explain":"Scan-to-network enables MFPs to send scanned documents directly to network destinations using SMB or SMTP.","wrongExplain":["Duplexing refers to automatically printing on both sides of the paper; it has nothing to do with delivering scanned documents to a destination.","","Secure print holds a print job at the device until a user authenticates, which is unrelated to routing scanned documents to email or network shares.","'Cloud spooling' isn't a standard term for this feature; the mechanism that sends scans directly to email or SMB shares is properly called scan-to-network (or scan-to-email/scan-to-folder)."],"sub":"3.6"},{"id":"q0346","domain":"Hardware","q":"A printer leaves toner smears even after replacing the toner cartridge. What is the MOST likely cause?","choices":["Dirty fuser rollers","Worn separation pad","Incorrect page orientation","Static discharge"],"correct":0,"explain":"If toner smears persist after cartridge replacement, the fuser rollers are likely dirty or damaged.","wrongExplain":["","A worn separation pad typically causes multiple sheets to feed at once (double-feeds), not toner smearing after a cartridge replacement.","Page orientation is a formatting/layout setting and has no effect on whether toner physically smears on the printed page.","Static discharge can sometimes cause toner scattering or spotting, but it isn't the typical cause of ongoing smears that persist specifically after a toner cartridge swap, which points to the fuser instead."],"sub":"3.6"},{"id":"q0347","domain":"Hardware","q":"Which maintenance task MOST directly prevents multiple sheets from feeding at once?","choices":["Replacing fuser","Cleaning print heads","Replacing separation pad","Updating firmware"],"correct":2,"explain":"The separation pad ensures only one sheet is fed at a time.","wrongExplain":["Replacing the fuser addresses toner bonding to the page, not how many sheets are pulled from the tray at once.","Cleaning print heads applies to inkjet printers' ink nozzles and has no relation to paper feed mechanics.","","Updating firmware can fix software/logic bugs, but it can't correct a physically worn separation pad that's failing to grip and separate sheets."],"sub":"3.6"},{"id":"q0348","domain":"Networking","q":"Which connector is MOST commonly used to connect enterprise MFPs directly to a network?","choices":["USB-B","RJ-45","Thunderbolt","Serial"],"correct":1,"explain":"Enterprise printers typically connect via Ethernet using RJ-45 connectors.","wrongExplain":["USB-B is typically used for a direct, local USB connection from a single computer to the printer, not for connecting the printer to a network.","","Thunderbolt is a high-speed peripheral interface mainly used for external storage and displays on certain computers; it isn't a standard networking connector used by enterprise printers.","Serial (RS-232) is a legacy low-speed interface historically used for direct device configuration or connections, not for standard network connectivity on modern MFPs."],"sub":"2.6"},{"id":"q0349","domain":"Hardware","q":"Inkjet printers rely on which process to apply ink to paper?","choices":["Electrostatic charge","Thermal bubble or piezoelectric","Laser etching","Pressure rollers"],"correct":1,"explain":"Inkjet printers spray ink using thermal bubble or piezoelectric technology.","wrongExplain":["Electrostatic charge is the mechanism used by laser printers to attract toner to the drum, not how inkjets apply liquid ink to paper.","","Laser etching describes how a laser printer's imaging drum is charged/exposed to form an image, not how liquid ink is physically ejected onto paper.","Pressure rollers are associated with fusing toner (laser) or impact printing, not with how an inkjet head propels ink droplets onto the page."],"sub":"3.6"},{"id":"q0350","domain":"Hardware","q":"Which printer type is BEST suited for multipart forms?","choices":["Laser","Inkjet","Thermal","Impact"],"correct":3,"explain":"Impact printers physically strike the paper, allowing printing through carbon-copy forms.","wrongExplain":["Laser printers use toner fused with heat and have no way to physically press through multiple carbon-copy layers of a multipart form.","Inkjet printers spray liquid ink onto the top sheet only; the ink cannot transfer through to the layers underneath a multipart form.","Thermal printers rely on heat-sensitive paper coatings, which doesn't work with standard multipart carbon forms at all.",""],"sub":"3.6"},{"id":"q0351","domain":"Hardware","q":"Vertical lines appear at regular intervals on laser prints. Which component should be inspected FIRST?","choices":["Fuser","Drum","Pickup roller","Formatter board"],"correct":1,"explain":"Repeating vertical defects usually indicate damage to the imaging drum.","wrongExplain":["A fuser problem typically causes issues like smearing or poor toner adhesion across the page, not thin, evenly-spaced vertical lines tied to a rotating component's circumference.","","A pickup roller issue usually results in paper feed problems such as jams or multiple sheets pulled at once, not a print-quality defect like repeating vertical lines.","A formatter board issue would more likely cause garbled data, missing print jobs, or complete failure to print, rather than a consistent, regularly-spaced physical print artifact."],"sub":"3.6"},{"id":"q0352","domain":"Hardware","q":"Which setting reduces paper usage by printing on both sides automatically?","choices":["Collation","Duplex","Orientation","Draft mode"],"correct":1,"explain":"Duplex printing automatically prints on both sides of the paper.","wrongExplain":["Collation controls how multiple copies of a multi-page document are assembled/ordered; it has nothing to do with printing on both sides.","","Orientation controls whether a page prints in portrait or landscape layout, not whether both sides of the paper are used.","Draft mode reduces ink/toner usage and print quality for faster, cheaper single-sided prints; it doesn't control double-sided printing."],"sub":"3.4"},{"id":"q0353","domain":"Networking","q":"A network printer prints locally but not from workstations. What is the MOST likely issue?","choices":["Bad fuser","Incorrect IP configuration","Empty tray","Worn rollers"],"correct":1,"explain":"Incorrect IP or network configuration prevents network printing.","wrongExplain":["A bad fuser would cause quality issues (like smearing) on any print job, including local ones, so it wouldn't explain why local printing works fine but network printing fails.","","An empty tray would cause printing to fail regardless of whether the job was sent locally or over the network, since it's a paper supply issue, not a connectivity issue.","Worn rollers would cause paper feed problems on any job, local or networked, so they don't explain a failure that's specific to workstation (network) printing only."],"sub":"2.1"},{"id":"q0354","domain":"Hardware","q":"Which feature holds print jobs until the user authenticates at the printer?","choices":["Secure print","Duplex","Spooling","SNMP"],"correct":0,"explain":"Secure print prevents unauthorized access to sensitive documents.","wrongExplain":["","Duplex refers to automatic two-sided printing and has nothing to do with holding a job until the user authenticates at the device.","Spooling is the general process of queuing print jobs for processing; it doesn't add an authentication requirement before the job is released.","SNMP is a network management protocol used for monitoring device status, not for controlling job release or user authentication at the printer."],"sub":"3.6"},{"id":"q0355","domain":"Hardware","q":"Which consumable has the SHORTEST lifespan in a laser printer?","choices":["Fuser","Imaging drum","Toner cartridge","Transfer belt"],"correct":2,"explain":"Toner cartridges require more frequent replacement than other components.","wrongExplain":["Fusers are built to handle a large volume of pages and are typically rated to last through many toner cartridge replacements before needing service.","Imaging drums are also long-life components, usually rated for tens of thousands of pages, well beyond a single toner cartridge's yield.","","Transfer belts are similarly long-lasting components designed to outlast multiple toner cartridge cycles in normal use."],"sub":"3.6"},{"id":"q0356","domain":"Hardware","q":"Frequent jams occur at the exit area. Which component is MOST suspect?","choices":["Pickup roller","Exit rollers","Separation pad","Formatter"],"correct":1,"explain":"Exit rollers guide paper out of the printer and commonly cause exit jams.","wrongExplain":["The pickup roller is involved in pulling paper into the printer at the start of the path, not guiding it out at the exit, so it wouldn't be the primary suspect for exit-area jams.","","The separation pad works with the pickup roller to prevent multiple sheets from feeding together at the input stage, not at the exit of the printer.","The formatter board processes print data and controls printer logic; it doesn't physically move paper, so it wouldn't cause a mechanical paper jam."],"sub":"3.6"},{"id":"q0357","domain":"Networking","q":"Which protocol is MOST commonly used to monitor printer status?","choices":["FTP","SNMP","SMTP","Telnet"],"correct":1,"explain":"SNMP is used for monitoring printer health and consumables.","wrongExplain":["FTP is a file transfer protocol used to move files between systems; it isn't designed to report device status or consumable levels.","","SMTP is used for sending email (such as printer alert notifications), not for actively monitoring or querying a printer's operational status.","Telnet provides a remote command-line/text interface to a device but isn't the standard protocol used for structured status/health monitoring, which is SNMP's specific purpose."],"sub":"2.1"},{"id":"q0358","domain":"Hardware","q":"Scan-to-email fails authentication on an MFP. Which setting is MOST likely incorrect?","choices":["DNS server","SMTP credentials","Subnet mask","Default gateway"],"correct":1,"explain":"Scan-to-email relies on SMTP authentication credentials.","wrongExplain":["A DNS problem would prevent the MFP from resolving the mail server's hostname at all, causing a connection failure rather than an authentication failure.","","An incorrect subnet mask would cause general local network connectivity problems, not a specific authentication error with the mail server.","A wrong default gateway would block the MFP from reaching the mail server across networks entirely, not produce an authentication-specific error."],"sub":"3.4"},{"id":"q0359","domain":"Hardware","q":"Which printer type uses heat-sensitive paper and requires no ink or toner?","choices":["Thermal","Inkjet","Laser","Impact"],"correct":0,"explain":"Thermal printers use heat-reactive paper.","wrongExplain":["","Inkjet printers spray liquid ink through nozzles onto ordinary paper; they do not use heat-sensitive paper.","Laser printers use toner powder fused to plain paper with heat; the paper itself is not heat-reactive.","Impact printers strike a ribbon against paper (like dot matrix printers) and use neither heat nor special paper."],"sub":"3.6"},{"id":"q0360","domain":"Hardware","q":"Ghost images appear repeatedly on laser prints. What is the MOST likely cause?","choices":["Fuser overheating","Drum not fully discharged","Low toner","Paper humidity"],"correct":1,"explain":"If the drum does not fully discharge, previous images can reappear.","wrongExplain":["An overheating fuser typically causes smearing, hot offset, or wrinkled/melted paper, not repeating ghost images.","","Low toner produces faded or light output overall, not a repeating ghosted pattern of a prior image.","Humid paper tends to cause jams or curling, not a repeating image artifact tied to the drum's rotation."],"sub":"3.6"},{"id":"q0361","domain":"Hardware","q":"Which action BEST improves streaking output on an inkjet printer?","choices":["Replace fuser","Clean print heads","Replace drum","Adjust duplex"],"correct":1,"explain":"Inkjet streaking is commonly caused by clogged print heads.","wrongExplain":["Fusers are a laser printer component used to bond toner to paper; inkjet printers do not have a fuser.","","Drums are used in laser printers to transfer a toner image to paper; inkjet printers have no drum to replace.","Duplex settings control double-sided printing and have no effect on ink streaking caused by clogged nozzles."],"sub":"3.6"},{"id":"q0362","domain":"Hardware","q":"Which paper type is MOST affected by high humidity?","choices":["Cardstock","Glossy","Recycled","Plain"],"correct":2,"explain":"Recycled paper absorbs moisture more easily, increasing jam risk.","wrongExplain":["Cardstock is thicker and more rigid, making it less prone to moisture absorption and warping than recycled paper.","Glossy paper has a coated surface that resists moisture absorption better than the looser fibers of recycled stock.","","Standard plain paper has a more uniform fiber structure than recycled paper and absorbs less moisture."],"sub":"3.4"},{"id":"q0363","domain":"Hardware","q":"A printer pauses frequently when processing large jobs. Which component is MOST limiting performance?","choices":["Paper tray","Printer memory","Fuser","Pickup roller"],"correct":1,"explain":"Insufficient printer memory slows processing of large print jobs.","wrongExplain":["The paper tray only affects how often paper must be reloaded; it has no bearing on how fast a job is processed.","","The fuser bonds toner to paper during the final output stage; it does not affect how quickly a job is rasterized and processed.","The pickup roller feeds individual sheets into the printer; it is unrelated to processing large amounts of print data."],"sub":"3.6"},{"id":"q0364","domain":"Hardware","q":"Which feature allows centralized management of multiple printers?","choices":["Cloud printing","Printer pooling","Print server","Secure print"],"correct":2,"explain":"Print servers allow centralized control and management of printers.","wrongExplain":["Cloud printing routes jobs through an internet-based service to enable remote printing, but it isn't itself a centralized on-premises management tool for multiple printers.","Printer pooling groups several printers under one shared queue for load balancing and redundancy; it doesn't provide centralized administrative management.","","Secure print holds a job at the device until the user authenticates for release; it protects individual jobs but doesn't centrally manage multiple printers."],"sub":"3.6"},{"id":"q0365","domain":"Hardware","q":"Which issue is MOST associated with worn pickup rollers?","choices":["Blank pages","Multiple sheets feeding","Faded output","Skewed images"],"correct":1,"explain":"Worn pickup rollers can grab multiple sheets at once.","wrongExplain":["Blank pages are typically caused by an empty or defective toner/ink cartridge or a drum problem, not roller wear.","","Faded output is caused by low toner or ink, not by the condition of the pickup rollers.","Skewed images are usually caused by misaligned paper guides rather than the roller's grip losing traction."],"sub":"3.4"},{"id":"q0366","domain":"Hardware","q":"Which printer language is MOST common in enterprise environments?","choices":["GDI","PCL","ASCII","PDF"],"correct":1,"explain":"PCL is widely used in enterprise laser printers.","wrongExplain":["GDI printing relies on the host computer's processor to render pages and is mainly found in low-cost consumer printers, not enterprise environments.","","ASCII is a plain text character encoding standard, not a printer control or page description language.","PDF is a document file format used for exchanging documents, not a printer command language used to drive output devices."],"sub":"3.6"},{"id":"q0367","domain":"Hardware","q":"Incorrect colors appear on a color laser printer. What should be calibrated FIRST?","choices":["Drum alignment","Color registration","Fuser calibration","Paper feed calibration"],"correct":1,"explain":"Color registration ensures proper alignment of CMYK layers.","wrongExplain":["Drum alignment is a mechanical adjustment and is not the standard first step for correcting color accuracy problems.","","Fuser calibration affects the heat and pressure used to bond toner to paper; it has no effect on color accuracy.","Paper feed calibration affects paper handling and image placement on the page, not the color output itself."],"sub":"3.6"},{"id":"q0368","domain":"Hardware","q":"Which component permanently bonds toner to paper?","choices":["Drum","Transfer roller","Fuser","Laser assembly"],"correct":2,"explain":"The fuser applies heat and pressure to bond toner.","wrongExplain":["The drum holds the electrostatic image and transfers toner onto the paper, but it does not permanently bond it there.","The transfer roller helps move toner from the drum onto the paper; it doesn't apply the heat and pressure needed to bond it.","","The laser assembly writes the image onto the drum's surface using a laser beam; it has no role in bonding toner to paper."],"sub":"3.6"},{"id":"q0369","domain":"Hardware","q":"Which feature reduces unauthorized access to stored print jobs?","choices":["Secure print","Duplex","Collation","Draft mode"],"correct":0,"explain":"Secure print requires user authentication before release.","wrongExplain":["","Duplex controls whether a job prints on both sides of the paper; it has no relationship to job security.","Collation controls the order in which multi-page copies are grouped and sorted; it has no security function.","Draft mode is a quality setting used to save toner or ink; it does not restrict access to a stored job."],"sub":"3.4"},{"id":"q0370","domain":"Hardware","q":"Which connection type allows printer sharing without a network?","choices":["Ethernet","Wi-Fi","USB","SNMP"],"correct":2,"explain":"USB allows direct sharing without network connectivity.","wrongExplain":["Ethernet requires a wired network connection between the printer and other devices.","Wi-Fi requires a wireless network connection to share the printer.","","SNMP is a network management protocol used to monitor devices; it is not a physical connection type at all."],"sub":"3.6"},{"id":"q0371","domain":"Hardware","q":"Wrinkled pages exit a laser printer. Which component is MOST likely faulty?","choices":["Pickup roller","Fuser","Formatter","Drum"],"correct":1,"explain":"A failing fuser can overheat or unevenly heat paper, causing wrinkles.","wrongExplain":["A worn pickup roller typically causes jams or multiple sheets feeding at once, not wrinkling of the output.","","The formatter board processes and rasterizes the print data; it has no physical contact with the paper as it exits.","The drum transfers the toner image onto the paper but does not apply the heat that causes wrinkling."],"sub":"3.6"},{"id":"q0372","domain":"Hardware","q":"Which maintenance component usually has the LONGEST replacement interval?","choices":["Pickup rollers","Fuser","Separation pad","Toner"],"correct":1,"explain":"Fusers typically last much longer than rollers or toner.","wrongExplain":["Pickup rollers wear from constant friction against paper and need replacement more frequently than the fuser.","","The separation pad also experiences continuous friction with paper and wears out faster than the fuser assembly.","Toner is a consumable used up with every print job, so it needs replacing far more often than the fuser."],"sub":"3.6"},{"id":"q0373","domain":"Hardware","q":"Which symptom MOST strongly indicates low toner?","choices":["Repeating defects","Faded output","Vertical lines","Ghosting"],"correct":1,"explain":"Low toner commonly causes faded or light prints.","wrongExplain":["Repeating defects at regular intervals usually point to a damaged drum or roller, not the toner level.","","Vertical lines are typically caused by a scratched drum or a blocked point in the toner cartridge, not simply low toner.","Ghosting results from the drum not fully discharging between print cycles, not from toner running low."],"sub":"3.6"},{"id":"q0374","domain":"Networking","q":"A network administrator needs at least 25 usable hosts per subnet from a /24 network. What subnet mask should be used?","choices":["255.255.255.224 (/27)","255.255.255.192 (/26)","255.255.255.240 (/28)","255.255.255.128 (/25)"],"correct":0,"explain":"A /27 (255.255.255.224) provides 30 usable host addresses, the smallest subnet that still meets the requirement of at least 25 usable hosts, making it the most efficient choice.","wrongExplain":["","A /26 provides 62 usable hosts, which meets the requirement but wastes address space compared to the smaller /27 that already satisfies it.","A /28 provides only 14 usable hosts, which falls short of the required 25 hosts.","A /25 provides 126 usable hosts, far more than needed, wasting addresses that could form additional subnets."],"sub":"2.1"},{"id":"q0375","domain":"Networking","q":"Which IP address is the broadcast address for the 192.168.10.64/26 subnet?","choices":["192.168.10.63","192.168.10.127","192.168.10.95","192.168.10.65"],"correct":1,"explain":"A /26 subnet has a block size of 64, so the 192.168.10.64 subnet spans .64-.127. The network address is .64, the usable host range is .65-.126, and the broadcast address is the last address in the block: .127.","wrongExplain":["192.168.10.63 is the broadcast address of the previous /26 block (192.168.10.0-.63), not the .64-.127 block in question.","","192.168.10.95 falls in the middle of the usable host range (.65-.126); it is not the last address of the subnet.","192.168.10.65 is actually the first usable host address in this subnet, not the broadcast address."],"sub":"2.1"},{"id":"q0376","domain":"Networking","q":"A technician assigns 255.255.255.248 to a network. How many usable hosts are available?","choices":["6","14","30","2"],"correct":0,"explain":"/29 provides 8 total addresses; subtract network and broadcast leaves 6 usable.","wrongExplain":["","14 usable hosts corresponds to a /28 mask (255.255.255.240), not a /29.","30 usable hosts corresponds to a /27 mask (255.255.255.224), not a /29.","2 usable hosts corresponds to a /30 mask (255.255.255.252), not a /29."],"sub":"2.1"},{"id":"q0377","domain":"Networking","q":"Which protocol is responsible for resolving an IP address to a MAC address on a local network?","choices":["ARP","DNS","ICMP","NAT"],"correct":0,"explain":"ARP maps Layer 3 IP addresses to Layer 2 MAC addresses.","wrongExplain":["","DNS resolves domain names to IP addresses; it has nothing to do with mapping IP to MAC addresses.","ICMP is used for diagnostic and error messaging, such as ping, not for address resolution.","NAT translates between private and public IP addresses; it does not resolve IP addresses to MAC addresses."],"sub":"2.1"},{"id":"q0378","domain":"Networking","q":"A host has an IP address of 10.0.5.34/20. What is the network address?","choices":["10.0.0.0","10.0.5.0","10.0.16.0","10.0.4.0"],"correct":0,"explain":"A /20 subnet increments by 16 in the third octet. 5 falls in the 0–15 range.","wrongExplain":["","10.0.5.0 treats the mask as if it were a full /24 boundary, but a /20 mask splits the network within the third octet in blocks of 16, not at every value.","10.0.16.0 would be correct if the third octet fell in the 16-31 range, but 5 falls in the 0-15 block instead.","10.0.4.0 is not aligned to the /20 block size of 16; valid block boundaries are 0, 16, 32, etc., not 4."],"sub":"2.1"},{"id":"q0379","domain":"Networking","q":"Which private IP range is defined by RFC 1918?","choices":["172.32.0.0 – 172.47.255.255","172.16.0.0 – 172.31.255.255","192.0.2.0 – 192.0.2.255","100.64.0.0 – 100.127.255.255"],"correct":1,"explain":"172.16.0.0–172.31.255.255 is one of the three RFC 1918 private ranges.","wrongExplain":["172.32.0.0-172.47.255.255 lies outside the RFC 1918 range, since the reserved block stops at 172.31.255.255; addresses above that are publicly routable.","","192.0.2.0/24 is the TEST-NET range reserved for documentation and examples under RFC 5737, not a private-use range.","100.64.0.0/10 is the Carrier-Grade NAT (shared address space) range defined by RFC 6598, a separate reservation from RFC 1918."],"sub":"2.1"},{"id":"q0380","domain":"Networking","q":"A router performs PAT. What is the PRIMARY benefit of this configuration?","choices":["Allows multiple devices to share one public IP","Encrypts traffic","Reduces broadcast domains","Improves QoS"],"correct":0,"explain":"Port Address Translation maps many private IPs to one public IP using ports.","wrongExplain":["","PAT only translates addresses and ports; it provides no encryption of the underlying traffic.","Reducing broadcast domains is a function of routers and VLAN segmentation, not something PAT itself accomplishes.","PAT has no role in traffic prioritization; improving QoS requires separate quality-of-service configuration."],"sub":"2.4"},{"id":"q0381","domain":"Networking","q":"Which subnet mask allows exactly 14 usable hosts?","choices":["255.255.255.240","255.255.255.248","255.255.255.252","255.255.255.224"],"correct":0,"explain":"/28 gives 16 total addresses, 14 usable.","wrongExplain":["","255.255.255.248 is a /29 mask, giving 8 total addresses and only 6 usable hosts.","255.255.255.252 is a /30 mask, giving only 2 usable hosts, typically used for point-to-point links.","255.255.255.224 is a /27 mask, giving 32 total addresses and 30 usable hosts, more than requested."],"sub":"2.1"},{"id":"q0382","domain":"Networking","q":"A user cannot reach remote networks but can access local devices. What is the MOST likely misconfiguration?","choices":["Default gateway","DNS server","Subnet mask","Duplex mismatch"],"correct":0,"explain":"Without a default gateway, traffic cannot leave the local subnet.","wrongExplain":["","A DNS problem would prevent name resolution (like resolving a website's hostname) but wouldn't necessarily block reaching remote networks by IP address.","An incorrect subnet mask usually disrupts communication with local devices too, not just remote networks.","A duplex mismatch typically causes performance issues like slow speeds and collisions, not a clean local-only connectivity pattern."],"sub":"2.1"},{"id":"q0383","domain":"Networking","q":"Which protocol is used to automatically assign IP configuration information to hosts?","choices":["DHCP","DNS","SNMP","FTP"],"correct":0,"explain":"DHCP dynamically assigns IP addresses, subnet masks, gateways, and DNS.","wrongExplain":["","DNS resolves hostnames to IP addresses; it does not assign IP configuration information to hosts.","SNMP is used to monitor and manage network devices, not to assign IP addressing information.","FTP is a file transfer protocol and has no role in assigning IP configuration."],"sub":"2.1"},{"id":"q0384","domain":"Networking","q":"What is the FIRST usable host address in the 192.168.50.128/25 network?","choices":["192.168.50.129","192.168.50.128","192.168.50.1","192.168.50.254"],"correct":0,"explain":"The network address is .128, so the first usable host is .129.","wrongExplain":["","192.168.50.128 is the network address itself, not a usable host address.","192.168.50.1 does not fall within this subnet at all, since the .128/25 subnet only spans .128 through .255.","192.168.50.254 is actually the last usable address in this subnet (just before the broadcast address .255), not the first."],"sub":"2.1"},{"id":"q0385","domain":"Networking","q":"Which device separates broadcast domains by default?","choices":["Router","Layer 2 switch","Hub","Repeater"],"correct":0,"explain":"Routers do not forward broadcasts, creating separate broadcast domains.","wrongExplain":["","A Layer 2 switch forwards frames within a single broadcast domain and does not segment broadcast traffic by default without VLAN configuration.","A hub simply repeats signals out every port and provides no traffic segmentation at all.","A repeater only regenerates a signal to extend distance; it has no concept of broadcast domains."],"sub":"2.2"},{"id":"q0386","domain":"Networking","q":"A technician sees APIPA addressing on a workstation. What does this indicate?","choices":["DHCP server unreachable","Duplicate IP","Incorrect subnet mask","DNS failure"],"correct":0,"explain":"APIPA (169.254.x.x) appears when DHCP assignment fails.","wrongExplain":["","A duplicate IP address conflict typically produces an explicit IP conflict error, not a fallback to an APIPA address.","An incorrect subnet mask wouldn't cause the OS to abandon DHCP and self-assign an APIPA address.","A DNS failure affects name resolution only; it would not cause the workstation to receive an APIPA address."],"sub":"2.1"},{"id":"q0387","domain":"Networking","q":"Which CIDR notation provides the MOST hosts per subnet?","choices":["/22","/26","/28","/30"],"correct":0,"explain":"Smaller prefix numbers allow more host bits; /22 provides the most hosts.","wrongExplain":["","A /26 has only 6 host bits, far fewer than the 10 host bits available in a /22, so it supports many fewer hosts.","A /28 has only 4 host bits, supporting just 16 total addresses.","A /30 has only 2 host bits, supporting just 4 total addresses, the fewest of all the options listed."],"sub":"2.1"},{"id":"q0388","domain":"Networking","q":"What protocol is primarily used to test reachability between two IP hosts?","choices":["ICMP","ARP","TCP","SNMP"],"correct":0,"explain":"ICMP echo requests/replies are used by ping.","wrongExplain":["","ARP resolves IP addresses to MAC addresses on a local segment; it does not test end-to-end reachability between hosts.","TCP establishes reliable connections for data transfer, but it is not the protocol ping uses to test reachability.","SNMP is used to monitor and manage network devices, not to test basic host-to-host reachability."],"sub":"2.1"},{"id":"q0389","domain":"Networking","q":"Which address is NOT routable on the public internet?","choices":["10.1.5.25","8.8.8.8","1.1.1.1","208.67.222.222"],"correct":0,"explain":"10.0.0.0/8 is a private IP range.","wrongExplain":["","8.8.8.8 is a public, globally routable address (Google Public DNS).","1.1.1.1 is a public, globally routable address (Cloudflare's DNS resolver).","208.67.222.222 is a public, globally routable address (OpenDNS's resolver), not a private-range address."],"sub":"2.1"},{"id":"q0390","domain":"Networking","q":"How many subnets are created by borrowing 3 bits from a /24 network?","choices":["8","6","4","16"],"correct":0,"explain":"2^3 = 8 subnets.","wrongExplain":["","6 is not a power of two; borrowing bits always yields a power-of-two number of subnets, so 3 borrowed bits cannot produce 6.","4 subnets would result from borrowing only 2 bits (2^2 = 4), not 3.","16 subnets would result from borrowing 4 bits (2^4 = 16), not 3."],"sub":"2.1"},{"id":"q0391","domain":"Networking","q":"Which protocol operates at Layer 3 of the OSI model?","choices":["IP","TCP","Ethernet","HTTP"],"correct":0,"explain":"IP is the primary Layer 3 (network layer) protocol.","wrongExplain":["","TCP operates at Layer 4, the Transport layer, managing reliable end-to-end connections, not addressing/routing.","Ethernet operates at Layer 2, the Data Link layer, handling MAC addressing and framing.","HTTP operates at Layer 7, the Application layer, used for web communication."],"sub":"2.1"},{"id":"q0392","domain":"Networking","q":"What is the primary function of a default gateway?","choices":["Route traffic to external networks","Resolve hostnames","Assign IP addresses","Filter MAC addresses"],"correct":0,"explain":"The default gateway forwards traffic destined for other networks.","wrongExplain":["","Resolving hostnames to IP addresses is the job of DNS, not the default gateway.","Assigning IP addresses is the job of DHCP, not the default gateway.","Filtering MAC addresses is typically a switch or wireless access point security feature, not a function of the default gateway."],"sub":"2.1"},{"id":"q0393","domain":"Networking","q":"A /30 network is MOST commonly used for which purpose?","choices":["Point-to-point WAN links","Large LAN segments","Wireless guest networks","Server farms"],"correct":0,"explain":"/30 provides two usable IPs, ideal for point-to-point links.","wrongExplain":["","A /30 provides only 2 usable addresses, far too few to support a large LAN segment with many devices.","Wireless guest networks typically need many more than the 2 usable addresses a /30 provides for connecting client devices.","Server farms require IP addresses for numerous hosts, which the 2 usable addresses of a /30 cannot support."],"sub":"2.5"},{"id":"q0394","domain":"Networking","q":"Which command displays IP configuration on Windows?","choices":["ipconfig","ifconfig","netstat","route"],"correct":0,"explain":"ipconfig shows IP address, subnet mask, and gateway on Windows.","wrongExplain":["","ifconfig is the equivalent command used on Linux and macOS/Unix systems, not on Windows.","netstat displays active network connections and statistics, not the IP configuration of the adapter.","route displays and manipulates the local routing table, not general IP configuration details."],"sub":"2.1"},{"id":"q0395","domain":"Networking","q":"Which technology allows multiple VLANs to traverse a single switch port?","choices":["802.1Q trunking","Port mirroring","Link aggregation","Spanning Tree"],"correct":0,"explain":"802.1Q tagging enables VLAN trunking.","wrongExplain":["","Port mirroring copies traffic from one port to another for monitoring purposes; it has nothing to do with carrying multiple VLANs.","Link aggregation combines multiple physical links into one logical link for bandwidth and redundancy, not VLAN tagging.","Spanning Tree prevents Layer 2 loops in switched networks; it does not carry multiple VLANs over a single port."],"sub":"2.2"},{"id":"q0396","domain":"Networking","q":"What happens if two devices share the same IP address?","choices":["IP conflict occurs","Traffic is encrypted","NAT resolves it","Performance improves"],"correct":0,"explain":"Duplicate IP addresses cause communication conflicts.","wrongExplain":["","A duplicate IP address has nothing to do with encryption of traffic.","NAT translates addresses between networks; it does not automatically detect or resolve a duplicate IP conflict on the same network.","A duplicate IP address causes connectivity problems and conflicts, not improved performance."],"sub":"2.1"},{"id":"q0397","domain":"Networking","q":"Which subnet mask would you choose for 2 usable hosts?","choices":["255.255.255.252","255.255.255.248","255.255.255.240","255.255.255.224"],"correct":0,"explain":"/30 provides exactly 2 usable host addresses.","wrongExplain":["","255.255.255.248 is a /29 mask, providing 6 usable hosts, not 2.","255.255.255.240 is a /28 mask, providing 14 usable hosts, not 2.","255.255.255.224 is a /27 mask, providing 30 usable hosts, not 2."],"sub":"2.1"},{"id":"q0398","domain":"Networking","q":"Which protocol translates domain names to IP addresses?","choices":["DNS","DHCP","NTP","LDAP"],"correct":0,"explain":"DNS resolves hostnames to IP addresses.","wrongExplain":["","DHCP assigns IP addressing information to hosts; it does not translate names to IP addresses.","NTP synchronizes device clocks and time, and has no role in name resolution.","LDAP is a protocol for accessing and maintaining directory services, not for translating names to IP addresses."],"sub":"2.1"},{"id":"q0399","domain":"Networking","q":"A network requires 9 subnets from a /24. What prefix is needed?","choices":["/28","/27","/26","/25"],"correct":0,"explain":"Borrowing 3 bits (/27) yields 2^3 = 8 subnets, which is not enough for a requirement of 9. Borrowing 4 bits (/28) yields 2^4 = 16 subnets, the smallest power of two that covers 9 subnets, so /28 is required.","wrongExplain":["","A /27 borrows only 3 bits, yielding just 8 subnets (2^3), one short of the 9 subnets required.","A /26 borrows only 2 bits, yielding just 4 subnets (2^2), far fewer than needed.","A /25 borrows only 1 bit, yielding just 2 subnets (2^1), the fewest of all the options and nowhere near enough."],"sub":"2.1"},{"id":"q0400","domain":"Networking","q":"Which address identifies the network itself?","choices":["All host bits set to 0","All host bits set to 1","First usable address","Last usable address"],"correct":0,"explain":"The network address has all host bits set to 0.","wrongExplain":["","All host bits set to 1 describes the broadcast address, not the network address.","The first usable address is one greater than the network address; it identifies an assignable host, not the network itself.","The last usable address is one less than the broadcast address; it identifies an assignable host, not the network itself."],"sub":"2.1"},{"id":"q0401","domain":"Networking","q":"What is the purpose of CIDR?","choices":["Reduce routing table size","Encrypt IP traffic","Increase broadcast traffic","Replace DNS"],"correct":0,"explain":"CIDR allows efficient IP allocation and smaller routing tables.","wrongExplain":["","CIDR is an addressing and routing scheme; it provides no encryption of IP traffic.","CIDR actually helps limit unnecessary traffic through more efficient subnetting; it does not increase broadcast traffic.","CIDR deals with IP address allocation and route summarization; it has no relationship to name resolution services like DNS."],"sub":"2.1"},{"id":"q0402","domain":"Networking","q":"Which device operates at Layer 2 and forwards frames based on MAC addresses?","choices":["Switch","Router","Firewall","Modem"],"correct":0,"explain":"Switches use MAC address tables at Layer 2.","wrongExplain":["","A router operates at Layer 3, forwarding packets based on IP addresses rather than MAC addresses.","A firewall filters traffic based on security rules and ports; it is not fundamentally a Layer 2 MAC-forwarding device.","A modem converts signals for transmission over telephone or cable lines; it does not forward frames based on MAC addresses."],"sub":"2.2"},{"id":"q0403","domain":"Networking","q":"Which addressing method assigns IPs permanently to hosts?","choices":["Static IP addressing","Dynamic addressing","APIPA","NAT"],"correct":0,"explain":"Static IPs are manually assigned and do not change.","wrongExplain":["","Dynamic addressing assigns IPs automatically via a leased DHCP assignment, which can change over time rather than staying permanent.","APIPA is a temporary self-assigned fallback address (169.254.x.x) used only when DHCP fails, not a permanent addressing method.","NAT translates addresses between networks; it does not itself assign permanent addresses to hosts."],"sub":"2.1"}]</script>

<script>

const DOMAINS = ["Mobile Devices","Networking","Hardware","Virtualization and Cloud Computing","Hardware and Network Troubleshooting"];
const SUB_OBJECTIVES = {
  "Mobile Devices": [
    { id: "1.1", label: "Laptop Hardware & Components" },
    { id: "1.2", label: "Mobile Device Accessories & Ports" },

  ],
  "Networking": [
    { id: "2.1", label: "TCP/IP, Ports & Protocols" },
    { id: "2.2", label: "Networking Devices & Appliances" },
    { id: "2.3", label: "Wireless Networking & Standards" },
    { id: "2.4", label: "SOHO Network Configuration" },
    { id: "2.5", label: "Internet & WAN Connection Types" },
    { id: "2.6", label: "Network Cabling & Connectors" },
  ],
  "Hardware": [
    { id: "3.1", label: "Cables & Connectors" },
    { id: "3.2", label: "RAM & Memory" },
    { id: "3.3", label: "Storage Devices" },
    { id: "3.4", label: "Motherboards, CPUs & Add-on Cards" },
    { id: "3.5", label: "Power Supplies" },
    { id: "3.6", label: "Peripherals & Multifunction/Printers" },
    { id: "3.7", label: "Custom PC Builds & Configurations" },
  ],
  "Virtualization and Cloud Computing": [
    { id: "4.1", label: "Cloud Computing Concepts" },
    { id: "4.2", label: "Client-Side Virtualization" },
  ],
  "Hardware and Network Troubleshooting": [
    { id: "5.1", label: "Troubleshooting Methodology" },
    { id: "5.2", label: "Motherboard, CPU, RAM & Power Issues" },
    { id: "5.3", label: "Storage Troubleshooting" },
    { id: "5.4", label: "Video & Display Troubleshooting" },
    { id: "5.5", label: "Mobile Device Troubleshooting" },
    { id: "5.6", label: "Printer Troubleshooting" },
    { id: "5.7", label: "Wired & Wireless Network Troubleshooting" },
  ],
};
const SUB_LABEL = {};
Object.values(SUB_OBJECTIVES).forEach(list => list.forEach(s => SUB_LABEL[s.id] = s.label));
const ALL_SUB_IDS = Object.values(SUB_OBJECTIVES).flat().map(s => s.id);
const MIN_Q = 45, MAX_Q = 245;
const STORAGE_KEY = "core1_quiz_session_v2";

const app = document.getElementById('app');

function subCounts(){
  const c = {};
  ALL_SUB_IDS.forEach(id => c[id] = 0);
  QUESTION_BANK.forEach(q => { if(c[q.sub] !== undefined) c[q.sub]++; });
  return c;
}

function poolForSubs(selected){
  return QUESTION_BANK.filter(q => selected.includes(q.sub));
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function loadSession(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    const s = JSON.parse(raw);
    if(s && s.v === 1) return s;
  }catch(e){}
  return null;
}
function saveSession(s){
  s.updatedAt = new Date().toISOString();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
}
function clearSession(){
  localStorage.removeItem(STORAGE_KEY);
}

function questionById(id){
  return QUESTION_BANK.find(q => q.id === id);
}

// ---------- Setup screen ----------
function renderSetup(){
  const counts = subCounts();
  const existing = loadSession();
  const selected = new Set(ALL_SUB_IDS.filter(id => counts[id] > 0));
  let countVal = 100;

  function currentPool(){
    return poolForSubs(Array.from(selected));
  }

  function draw(){
    const pool = currentPool();
    const available = pool.length;
    const effMax = Math.max(1, Math.min(MAX_Q, available));
    const effMin = Math.min(MIN_Q, effMax);
    if(countVal > effMax) countVal = effMax;
    if(countVal < effMin) countVal = effMin;

    app.innerHTML = `
      <h1>CompTIA A+ Core 1 Practice Exam</h1>
      <div class="sub">${QUESTION_BANK.length} questions across all Core 1 (220-1201) objective domains. Pick your objectives and question count to begin.</div>
      ${existing && !existing.finished ? `
        <div class="resume-banner">
          <div><strong>Quiz in progress</strong> &mdash; ${existing.answers.filter(a=>a!==null).length} of ${existing.order.length} answered.</div>
          <div class="row">
            <button id="resumeBtn">Resume Quiz</button>
            <button id="discardBtn" class="danger">Discard</button>
          </div>
        </div>` : ``}
      <div class="card">
        <h2>Quick Quiz</h2>
        <div class="sub" style="margin-bottom:14px">A short, no-setup quiz pulling randomly from every objective.</div>
        <div class="tiles">
          <button class="tile lightning" id="quick10Tile">
            <div class="icon">⚡</div>
            <div><div class="ttitle">Quick Quiz</div><div class="tsub">10 Questions</div></div>
          </button>
          <button class="tile fire" id="quick15Tile">
            <div class="icon">🔥</div>
            <div><div class="ttitle">Quick Quiz</div><div class="tsub">15 Questions</div></div>
          </button>
          <button class="tile storm" id="quick20Tile">
            <div class="icon">⛈️</div>
            <div><div class="ttitle">Quick Quiz</div><div class="tsub">20 Questions</div></div>
          </button>
          <button class="tile sun" id="quick25Tile">
            <div class="icon">☀️</div>
            <div><div class="ttitle">Quick Quiz</div><div class="tsub">25 Questions</div></div>
          </button>
        </div>
      </div>
      <div class="card">
        <h2>1. Choose objectives</h2>
        <div class="row" style="margin-bottom:10px">
          <button class="ghost" id="selectAllBtn">Select All</button>
          <button class="ghost" id="selectNoneBtn">Deselect All</button>
        </div>
        <div id="domainGroups"></div>
        <h2 style="margin-top:22px">2. Number of questions</h2>
        <div class="count-row">
          <input type="range" id="countSlider" min="${effMin}" max="${effMax}" value="${countVal}" ${effMax<=effMin?'disabled':''}/>
          <input type="number" id="countNum" min="${effMin}" max="${effMax}" value="${countVal}" />
        </div>
        <div class="note">Choose between ${MIN_Q} and ${MAX_Q} questions. Currently <strong>${available}</strong> question${available===1?'':'s'} available for the selected objectives${available < countVal ? ' — count has been capped.' : ''}.</div>
        <div class="row" style="margin-top:20px">
          <button id="startBtn" ${available===0?'disabled':''}>Start Quiz</button>
        </div>
      </div>
    `;

    const groupsEl = document.getElementById('domainGroups');
    DOMAINS.forEach(d => {
      const subs = SUB_OBJECTIVES[d].filter(s => counts[s.id] > 0);
      if(subs.length === 0) return;
      const group = document.createElement('div');
      group.className = 'domain-group';
      group.innerHTML = `<h3>${d}</h3><div class="domain-list"></div>`;
      const list = group.querySelector('.domain-list');
      subs.forEach(s => {
        const item = document.createElement('div');
        item.className = 'domain-item';
        const id = 'sub_' + s.id.replace('.','_');
        item.innerHTML = `<input type="checkbox" id="${id}" ${selected.has(s.id)?'checked':''}/>
          <label for="${id}">${s.id} &mdash; ${s.label}</label>
          <span class="domain-count">${counts[s.id]} question${counts[s.id]===1?'':'s'}</span>`;
        item.querySelector('input').addEventListener('change', e => {
          if(e.target.checked) selected.add(s.id); else selected.delete(s.id);
          draw();
        });
        list.appendChild(item);
      });
      groupsEl.appendChild(group);
    });

    document.getElementById('selectAllBtn').addEventListener('click', () => {
      ALL_SUB_IDS.forEach(id => { if(counts[id] > 0) selected.add(id); });
      draw();
    });
    document.getElementById('selectNoneBtn').addEventListener('click', () => {
      selected.clear();
      draw();
    });

    document.getElementById('quick10Tile').addEventListener('click', () => startQuiz(ALL_SUB_IDS.slice(), 10));
    document.getElementById('quick15Tile').addEventListener('click', () => startQuiz(ALL_SUB_IDS.slice(), 15));
    document.getElementById('quick20Tile').addEventListener('click', () => startQuiz(ALL_SUB_IDS.slice(), 20));
    document.getElementById('quick25Tile').addEventListener('click', () => startQuiz(ALL_SUB_IDS.slice(), 25));

    document.getElementById('countSlider').addEventListener('input', e => {
      countVal = parseInt(e.target.value, 10);
      document.getElementById('countNum').value = countVal;
    });
    document.getElementById('countNum').addEventListener('change', e => {
      let v = parseInt(e.target.value, 10) || effMin;
      v = Math.max(effMin, Math.min(effMax, v));
      countVal = v;
      draw();
    });
    document.getElementById('startBtn').addEventListener('click', () => {
      startQuiz(Array.from(selected), countVal);
    });
    if(existing && !existing.finished){
      document.getElementById('resumeBtn').addEventListener('click', () => renderQuiz(existing));
      document.getElementById('discardBtn').addEventListener('click', () => { clearSession(); renderSetup(); });
    }
  }
  draw();
}

function startQuiz(selectedSubs, count){
  const pool = shuffle(poolForSubs(selectedSubs)).slice(0, count);
  const order = pool.map(q => ({ id: q.id, displayOrder: shuffle([0,1,2,3]) }));
  const session = {
    v: 1,
    domains: selectedSubs,
    order: order,
    answers: order.map(() => null),
    current: 0,
    finished: false,
    startedAt: new Date().toISOString()
  };
  saveSession(session);
  renderQuiz(session);
}

// ---------- Quiz screen ----------
function renderQuiz(session){
  const total = session.order.length;
  const idx = session.current;
  const entry = session.order[idx];
  const q = questionById(entry.id);
  const answeredIdx = session.answers[idx]; // display-position index, or null

  const answeredCount = session.answers.filter(a=>a!==null).length;
  const pct = Math.round((idx / total) * 100);

  app.innerHTML = `
    <h1>CompTIA A+ Core 1 Practice Exam</h1>
    <div class="qmeta">
      <span>Question ${idx+1} of ${total} &middot; ${q.sub} ${SUB_LABEL[q.sub] || q.domain}</span>
      <span>${answeredCount} answered</span>
    </div>
    <div class="progress"><div class="bar" style="width:${pct}%"></div></div>
    <div class="card">
      <div class="qtext">${escapeHtml(q.q)}</div>
      <div class="choices" id="choicesWrap"></div>
      <div id="feedbackWrap"></div>
      <div class="controls">
        <button class="ghost" id="pauseBtn">Pause &amp; Save</button>
        <div class="row">
          <button class="ghost" id="prevBtn" ${idx===0?'disabled':''}>&#9664; Prev</button>
          <button id="nextBtn" disabled>${idx===total-1 ? 'Finish Quiz' : 'Next ▶'}</button>
        </div>
      </div>
    </div>
  `;

  const choicesWrap = document.getElementById('choicesWrap');
  entry.displayOrder.forEach((origIdx, pos) => {
    const div = document.createElement('div');
    div.className = 'choice';
    div.innerHTML = `<strong>${String.fromCharCode(65+pos)}.</strong> ${escapeHtml(q.choices[origIdx])}`;
    div.addEventListener('click', () => {
      if(session.answers[idx] !== null) return; // already locked
      session.answers[idx] = pos;
      saveSession(session);
      renderQuiz(session);
    });
    choicesWrap.appendChild(div);
  });

  if(answeredIdx !== null){
    lockChoices(session, entry, q, answeredIdx);
    document.getElementById('nextBtn').disabled = false;
  }

  document.getElementById('prevBtn').addEventListener('click', () => {
    session.current = Math.max(0, idx - 1);
    saveSession(session);
    renderQuiz(session);
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    if(idx === total - 1){
      session.finished = true;
      saveSession(session);
      renderResults(session);
    } else {
      session.current = idx + 1;
      saveSession(session);
      renderQuiz(session);
    }
  });
  document.getElementById('pauseBtn').addEventListener('click', () => {
    saveSession(session);
    renderSetup();
  });
}

function lockChoices(session, entry, q, answeredPos){
  const choicesWrap = document.getElementById('choicesWrap');
  const correctPos = entry.displayOrder.indexOf(q.correct);
  const chosenOrigIdx = entry.displayOrder[answeredPos];
  const wasCorrect = chosenOrigIdx === q.correct;

  Array.from(choicesWrap.children).forEach((div, pos) => {
    div.classList.add('locked');
    if(pos === answeredPos && pos === correctPos){
      div.classList.add('selected-correct');
    } else if(pos === answeredPos){
      div.classList.add('selected-wrong');
    } else if(pos === correctPos){
      div.classList.add('reveal-correct');
    }
  });

  const fb = document.getElementById('feedbackWrap');
  let html = '';
  if(wasCorrect){
    html += `<div class="explain-box"><span class="tag good">Correct</span>${escapeHtml(q.explain)}</div>`;
  } else {
    html += `<div class="explain-box"><span class="tag bad">Your answer was wrong</span>${escapeHtml(q.wrongExplain[chosenOrigIdx])}</div>`;
    html += `<div class="explain-box"><span class="tag good">Correct answer</span>${escapeHtml(q.choices[q.correct])} &mdash; ${escapeHtml(q.explain)}</div>`;
  }
  fb.innerHTML = html;
}

// ---------- Results screen ----------
function renderResults(session){
  const total = session.order.length;
  let correctCount = 0;
  const perSub = {};
  const missed = [];

  session.order.forEach((entry, i) => {
    const q = questionById(entry.id);
    const answeredPos = session.answers[i];
    const chosenOrigIdx = answeredPos === null ? null : entry.displayOrder[answeredPos];
    const isCorrect = chosenOrigIdx === q.correct;
    if(!perSub[q.sub]) perSub[q.sub] = {correct:0, total:0};
    perSub[q.sub].total++;
    if(isCorrect){ correctCount++; perSub[q.sub].correct++; }
    else missed.push({q, chosenOrigIdx});
  });

  const answeredCount = session.answers.filter(a=>a!==null).length;
  const score = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;

  app.innerHTML = `
    <h1>Results</h1>
    <div class="card" style="text-align:center">
      <div class="score-big">${score}<span style="font-size:24px;color:var(--muted)"> / 100</span></div>
      <div class="score-sub">${correctCount} correct out of ${answeredCount} answered (${total} selected)</div>
    </div>
    <div class="card">
      <h2>By objective</h2>
      <div id="domainBreakdown"></div>
    </div>
    <div class="card">
      <h2>Review missed questions (${missed.length})</h2>
      <div id="missedList">${missed.length===0 ? '<div class="note">Perfect score on answered questions.</div>' : ''}</div>
    </div>
    <div class="row">
      <button id="newQuizBtn">Start New Quiz</button>
    </div>
  `;

  const db = document.getElementById('domainBreakdown');
  ALL_SUB_IDS.forEach(id => {
    const s = perSub[id];
    if(!s || s.total === 0) return;
    const p = Math.round((s.correct/s.total)*100);
    const row = document.createElement('div');
    row.className = 'domain-score';
    row.innerHTML = `<span>${id} &mdash; ${SUB_LABEL[id]}</span><span>${s.correct}/${s.total} (${p}%)</span>`;
    db.appendChild(row);
  });

  const ml = document.getElementById('missedList');
  missed.forEach(({q, chosenOrigIdx}) => {
    const div = document.createElement('div');
    div.className = 'review-item';
    let yourAnswerHtml = chosenOrigIdx === null
      ? `<div class="explain-box"><span class="tag bad">Not answered</span></div>`
      : `<div class="explain-box"><span class="tag bad">Your answer</span>${escapeHtml(q.choices[chosenOrigIdx])} &mdash; ${escapeHtml(q.wrongExplain[chosenOrigIdx])}</div>`;
    div.innerHTML = `
      <span class="pill">${q.sub} &mdash; ${SUB_LABEL[q.sub] || q.domain}</span>
      <div class="review-q">${escapeHtml(q.q)}</div>
      ${yourAnswerHtml}
      <div class="explain-box"><span class="tag good">Correct answer</span>${escapeHtml(q.choices[q.correct])} &mdash; ${escapeHtml(q.explain)}</div>
    `;
    ml.appendChild(div);
  });

  document.getElementById('newQuizBtn').addEventListener('click', () => {
    clearSession();
    renderSetup();
  });
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

renderSetup();
</script>
</body>
</html>
