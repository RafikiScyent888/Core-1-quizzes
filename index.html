ve and needs replacement","The power supply cannot provide stable voltage to all four modules","The CPU does not support the installed memory's clock speed"],"correct":0,"explain":"Populating memory slots in the wrong order can cause the system to run in single-channel mode instead of dual-channel, which still allows normal boot and full capacity detection but noticeably reduces memory bandwidth and benchmark performance.","wrongExplain":["","A defective module would typically cause reduced detected capacity, boot failures, or memory errors rather than full detection paired specifically with reduced throughput consistent with a channel configuration issue.","RAM draws minimal power relative to other components, making a voltage stability issue an unlikely explanation for a performance-specific symptom rather than instability or crashing.","If the CPU didn't support the memory's clock speed, the system would typically fail to boot or automatically down-clock the memory, rather than boot normally with full capacity detected and a channel-mode-specific performance loss."],"sub":"5.2"},{"id":"q0416","domain":"Hardware and Network Troubleshooting","q":"A technician is diagnosing a workstation that shuts down unexpectedly during heavy workloads. Using monitoring software, they observe that CPU temperatures climb rapidly to over 95 degrees Celsius within seconds of load starting, far faster than is typical, and the shutdown occurs immediately after. A visual inspection shows the cooler is mounted correctly and the fan spins freely. What should the technician check NEXT?","choices":["Whether the thermal paste between the CPU and cooler has dried out or was applied incorrectly","Whether the power supply is rated for the system's total wattage","Whether the RAM is seated in the correct dual-channel slots","Whether the CMOS battery is holding a charge"],"correct":0,"explain":"Rapid temperature spikes despite a properly mounted, freely spinning cooler point toward poor thermal transfer between the CPU and cooler, commonly caused by dried-out, insufficient, or improperly applied thermal paste, which should be reapplied.","wrongExplain":["","An inadequate power supply would more commonly cause shutdowns tied to overall system load rather than the specific pattern of unusually rapid CPU temperature spikes despite proper cooler mounting.","Memory channel configuration affects performance and bandwidth, not CPU thermal behavior, and would not explain rapidly climbing temperatures under load.","A weak CMOS battery affects saved BIOS settings and system time, not real-time thermal performance during heavy workloads."],"sub":"5.2"},{"id":"q0417","domain":"Hardware and Network Troubleshooting","q":"A user's laptop powers on normally when placed on a desk, but repeatedly shuts down within a few seconds whenever it is used while sitting on a soft surface like a bed or couch. Opening the laptop reveals significant dust buildup around the exhaust vents. What is the MOST likely cause of the shutdowns?","choices":["Airflow is being blocked, causing the system to overheat and shut down to protect itself","The battery is failing and cannot hold a charge under any load","The RAM has become loose due to the laptop being moved frequently","The CMOS battery has failed, corrupting boot configuration data"],"correct":0,"explain":"Soft surfaces block intake and exhaust vents, and combined with existing dust buildup, this severely restricts airflow; the resulting rapid heat buildup triggers a thermal protection shutdown, which explains why the issue appears only on soft surfaces and not on a hard desk.","wrongExplain":["","A failing battery would typically cause shutdowns unrelated to the surface the laptop is placed on, and would not explain a pattern that specifically correlates with blocked airflow on soft surfaces.","Loose RAM would typically cause crashes or failure to boot consistently, not a pattern tied specifically to airflow-blocking surfaces combined with visible dust buildup around the vents.","A failed CMOS battery affects saved BIOS settings and system clock, not a real-time thermal shutdown pattern connected to blocked ventilation."],"sub":"5.2"},{"id":"q0418","domain":"Hardware and Network Troubleshooting","q":"After a power outage followed by several brief brownouts in the same week, a desktop begins randomly rebooting even during idle periods with no other symptoms. The power cable, outlet, and surge protector all test as functioning correctly. What component should the technician suspect and test FIRST?","choices":["The power supply unit, since repeated electrical events can degrade its internal components over time","The RAM modules, since power fluctuations commonly cause permanent memory corruption","The motherboard's CMOS battery, since it is the most sensitive component to power events","The hard drive's read/write heads, since sudden power loss can misalign them"],"correct":0,"explain":"Power supplies absorb electrical stress from outages and brownouts, and repeated events can degrade internal components like capacitors over time, leading to unstable output that causes seemingly random reboots even without any other symptom; testing or swapping the PSU is the appropriate first step.","wrongExplain":["","RAM is not typically described as suffering permanent corruption from external power events in the way a PSU's internal components degrade; RAM issues from power problems would more likely show up as boot failures rather than random idle reboots.","The CMOS battery is a small, low-draw component isolated from the main power delivery path, making it an unlikely point of failure from external power events affecting the whole system's stability.","Read/write head misalignment from power loss is not a typical or well-supported failure mode for modern hard drives, and would not explain reboots occurring during idle periods with no storage-related symptoms."],"sub":"5.2"},{"id":"q0419","domain":"Hardware and Network Troubleshooting","q":"A technician is asked to troubleshoot a desktop that intermittently fails to boot, requiring the power button to be pressed two or three times before the system successfully starts. Once running, the computer is completely stable with no crashes or errors. Reseating the RAM and power cables has not resolved the issue. What should the technician suspect NEXT?","choices":["A power supply that is beginning to fail and struggles to reach a stable startup state","A dust-clogged CPU cooler causing thermal throttling immediately at boot","Outdated graphics drivers preventing the display from initializing","A misconfigured BIOS boot order pointing to the wrong drive"],"correct":0,"explain":"A power supply nearing failure can struggle to deliver stable voltage at the initial moment of startup even though it stabilizes and performs normally once running, which produces the classic symptom of needing multiple power-on attempts despite an otherwise stable system.","wrongExplain":["","Thermal throttling from a clogged cooler would typically cause performance issues or crashes during use under load, not a symptom isolated specifically to the moment of powering on before the system reaches a stable running state.","Outdated graphics drivers are a software-level concern that would only matter after the operating system has loaded, not during the initial hardware power-on sequence described here.","An incorrect boot order would cause the system to boot into the wrong device or display a boot error, not require repeated power button presses before any startup activity begins at all."],"sub":"5.2"},{"id":"q0420","domain":"Hardware and Network Troubleshooting","q":"While cleaning a desktop, a technician hears a rhythmic grinding and clicking noise coming from the CPU cooler fan that was not present during a service visit the previous month. CPU temperatures are currently normal at idle. What should the technician recommend?","choices":["Replace the cooler fan proactively before bearing failure causes overheating","Ignore the noise since current CPU temperatures are within normal range","Replace the thermal paste, since noise usually indicates dried compound","Increase the case fan speed to compensate for the noisy CPU fan"],"correct":0,"explain":"A new grinding or clicking noise from a cooler fan is a classic early indicator of bearing wear, which will progressively worsen and can lead to fan failure and subsequent overheating; proactively replacing the fan prevents a future thermal emergency even though temperatures are still normal today.","wrongExplain":["","Normal current temperatures don't rule out an impending mechanical failure; a failing bearing typically produces noise well before it causes a measurable temperature increase, making proactive replacement the safer recommendation.","Dried thermal paste affects heat transfer efficiency and temperatures, not the mechanical grinding or clicking sound of a fan, which is characteristic of a bearing issue instead.","Increasing case fan speed improves case airflow but does nothing to address a failing CPU cooler fan bearing, which will continue to degrade and risks failing entirely regardless of other fan speeds."],"sub":"5.2"},{"id":"q0421","domain":"Mobile Devices","q":"A technician replacing a laptop's LCD panel notices the new panel uses a different connector than the old one, despite both being advertised as compatible with the laptop model. What is the technician's BEST next step?","choices":["Verify the exact panel part number and connector pinout against the manufacturer's specification before proceeding","Force the connector into place since panels for the same model should always be interchangeable","Solder the new connector's pins directly to the old cable to make it fit","Return the laptop to the customer and explain that LCD panels cannot be replaced"],"correct":0,"explain":"Laptop LCD panels for the same model can still vary in connector type or pinout across production revisions, so verifying the exact part number and connector specification before installation prevents damage from forcing an incompatible connector into place.","wrongExplain":["","Forcing an incompatible connector risks permanently damaging both the new panel and the motherboard's display connector, since connector types differing between panels is a known variation across production revisions of the same model.","Soldering connector pins directly is not a standard or safe laptop repair practice and risks damaging the panel, the cable, and creating an unreliable connection.","LCD panel replacement is a standard, well-supported repair; the correct response is to verify compatibility, not to declare the repair impossible."],"sub":"1.1","source":"original-2026-batch"},{"id":"q0422","domain":"Mobile Devices","q":"A laptop's battery has become physically swollen and is pushing up against the trackpad, making it difficult to click. What should the technician do FIRST?","choices":["Power off the device immediately and avoid pressure on the battery until it can be safely removed and replaced","Continue using the laptop normally, since swollen batteries are only a cosmetic issue","Puncture the battery to release the built-up pressure","Charge the battery fully to try to reduce the swelling"],"correct":0,"explain":"A swollen battery indicates internal cell damage or gas buildup and poses a fire or chemical hazard; the safe first step is to power off the device and avoid applying pressure until the battery can be professionally removed and disposed of properly.","wrongExplain":["","A swollen battery is a genuine safety hazard, not merely cosmetic, and continuing to use or apply pressure to it risks rupture, fire, or chemical exposure.","Puncturing a swollen battery is extremely dangerous and can cause fire or the release of toxic and corrosive chemicals; it should never be intentionally punctured.","Charging a swollen battery further increases the risk of thermal runaway or rupture and should be avoided entirely until the battery is safely replaced."],"sub":"1.1","source":"original-2026-batch"},{"id":"q0423","domain":"Mobile Devices","q":"A traveling sales employee needs to connect their laptop to a hotel room's single HDMI-equipped monitor, a wired Ethernet jack, and a USB printer, but their laptop only has USB-C ports. What accessory would BEST meet all three needs with a single connection?","choices":["A USB-C docking station or multiport adapter with HDMI, Ethernet, and USB-A outputs","A USB-C to HDMI cable only","A USB-C to Ethernet adapter only","A wireless display adapter"],"correct":0,"explain":"A USB-C docking station or multiport adapter consolidates HDMI video output, wired Ethernet, and USB-A peripheral connectivity into a single connection to the laptop's USB-C port, addressing all three stated needs simultaneously.","wrongExplain":["","A single HDMI cable would only address the monitor connection and would leave the Ethernet and USB printer needs unmet.","A single Ethernet adapter would only address the wired network connection and would leave the monitor and printer needs unmet.","A wireless display adapter would only address the monitor connection wirelessly and does nothing for the wired Ethernet or USB printer requirements."],"sub":"1.2","source":"original-2026-batch"},{"id":"q0424","domain":"Mobile Devices","q":"A technician needs to connect a laptop to an external 4K monitor at its full native resolution and refresh rate, but the laptop only has a single Thunderbolt/USB-C port available, which is also being used for charging via a dock. What accessory type addresses this scenario?","choices":["A USB-C dock that supports simultaneous power delivery (charging) and high-resolution video output","A basic USB-A to VGA adapter","A micro-USB charging cable","A 3.5mm audio splitter"],"correct":0,"explain":"A USB-C dock supporting simultaneous power delivery and video output allows the single available port to both charge the laptop and drive a high-resolution external display at the same time, exactly matching the described constraint of one available port needing to do both jobs.","wrongExplain":["","A USB-A to VGA adapter would not support 4K resolution and also does not address the simultaneous charging requirement, nor would it fit a USB-C-only laptop without an additional adapter.","A micro-USB charging cable does not carry video signal and has no ability to output to an external monitor.","An audio splitter addresses only sound output and has no relevance to video output or charging."],"sub":"1.2","source":"original-2026-batch"},{"id":"q0425","domain":"Mobile Devices","q":"A field technician's rugged tablet is used outdoors in direct sunlight and occasionally gets rained on during use. Which accessory would BEST protect the device while maintaining usability in these conditions?","choices":["A ruggedized, weatherproof case with a sunlight-readable screen protector","A standard leather portfolio case designed for indoor office use","A decorative skin with no additional protective properties","A screen protector rated only for scratch resistance with no moisture protection"],"correct":0,"explain":"A ruggedized, weatherproof case combined with a sunlight-readable screen protector directly addresses both stated environmental challenges: protecting against moisture exposure from rain and improving screen visibility in direct sunlight, while still allowing normal outdoor use of the device.","wrongExplain":["","A standard indoor-use case provides no meaningful weatherproofing against rain exposure and does not address sunlight readability.","A purely decorative skin provides no protective or functional benefit for either environmental challenge described.","A scratch-only screen protector does nothing to address moisture exposure or improve visibility in direct sunlight."],"sub":"1.2","source":"original-2026-batch"},{"id":"q0426","domain":"Mobile Devices","q":"A retail employee uses a smartphone mounted in a countertop stand that also charges the device wirelessly whenever it is placed down, with no cable ever plugged into the phone. What technology enables the charging function of this accessory?","choices":["Inductive (wireless) charging","USB-C fast charging","Micro-USB charging","A 30-pin dock connector"],"correct":0,"explain":"Inductive wireless charging uses electromagnetic induction between a charging pad or stand and a compatible device to transfer power without any physical cable connection, exactly matching the cable-free charging behavior described in the countertop stand scenario.","wrongExplain":["","USB-C fast charging requires a physical cable connection to the port, which contradicts the cable-free charging behavior described.","Micro-USB charging also requires a physical cable connection and does not match the cable-free scenario described.","A 30-pin dock connector is an older physical connector standard that also requires a cabled connection, not a wireless one."],"sub":"1.2","source":"original-2026-batch"},{"id":"q0427","domain":"Mobile Devices","q":"A user wants to listen to audio on a modern smartphone that lacks a headphone jack, using wireless earbuds instead. Which accessory technology connects the earbuds to the phone?","choices":["Bluetooth pairing","NFC tap-to-pay","A 30-pin dock connector","A micro-USB OTG adapter"],"correct":0,"explain":"Bluetooth pairing is the standard wireless technology used to connect audio accessories like wireless earbuds to a smartphone, allowing audio streaming without any physical port connection.","wrongExplain":["","NFC tap-to-pay is used for contactless payment and quick data exchange, not for streaming continuous audio to earbuds.","A 30-pin dock connector is an older physical Apple accessory standard, unrelated to wireless audio streaming.","A micro-USB OTG adapter allows a mobile device to act as a USB host for wired peripherals, not for wireless audio streaming."],"sub":"1.2","source":"original-2026-batch"},{"id":"q0428","domain":"Mobile Devices","q":"A delivery driver's tablet mount in their vehicle also supplies continuous power to the tablet through a cable running to the vehicle's 12-volt outlet. What accessory is being used?","choices":["A car charger adapter","A wireless charging pad","A Bluetooth car kit with no charging capability","A screen protector"],"correct":0,"explain":"A car charger adapter converts a vehicle's 12-volt power outlet into the appropriate voltage and connector type to charge a mobile device, exactly matching the continuous power supply described in the vehicle mount scenario.","wrongExplain":["","A wireless charging pad requires the device to sit on the pad itself, not connect via a cable to a 12-volt outlet as described.","A Bluetooth car kit without charging capability would provide audio connectivity only, not the continuous power supply described.","A screen protector provides physical screen protection and has no relationship to powering the device."],"sub":"1.2","source":"original-2026-batch"},{"id":"q0429","domain":"Mobile Devices","q":"A user needs to connect an older external hard drive with a full-size USB-A connector to a modern laptop that only has USB-C ports. What accessory solves this?","choices":["A USB-C to USB-A adapter","A USB-C to HDMI adapter","A micro-SD card reader","A Lightning to USB-C cable"],"correct":0,"explain":"A USB-C to USB-A adapter provides the physical connector conversion needed to plug a legacy USB-A device into a modern USB-C-only port.","wrongExplain":["","Incorrect — \"A USB-C to HDMI adapter\" does not fit this scenario. The correct answer is \"A USB-C to USB-A adapter\" because a USB-C to USB-A adapter provides the physical connector conversion needed to plug a legacy USB-A device into a modern USB-C-only port.","Incorrect — \"A micro-SD card reader\" does not fit this scenario. The correct answer is \"A USB-C to USB-A adapter\" because a USB-C to USB-A adapter provides the physical connector conversion needed to plug a legacy USB-A device into a modern USB-C-only port.","Incorrect — \"A Lightning to USB-C cable\" does not fit this scenario. The correct answer is \"A USB-C to USB-A adapter\" because a USB-C to USB-A adapter provides the physical connector conversion needed to plug a legacy USB-A device into a modern USB-C-only port."],"sub":"1.2","source":"original-2026-batch"},{"id":"q0430","domain":"Mobile Devices","q":"A photographer needs to quickly transfer photos from a camera's memory card to a tablet that has no built-in card slot. Which accessory would MOST directly solve this?","choices":["A USB card reader that connects to the tablet's port","A wireless charging pad","A Bluetooth keyboard","A screen protector"],"correct":0,"explain":"A USB card reader connects to the tablet's available port and provides a slot to read the camera's memory card directly, which is the most direct solution to transferring photos without a built-in card slot.","wrongExplain":["","Incorrect — \"A wireless charging pad\" does not fit this scenario. The correct answer is \"A USB card reader that connects to the tablet's port\" because a USB card reader connects to the tablet's available port and provides a slot to read the camera's memory card directly, which is the most direct solution to transferring photos without a built-in card slot.","Incorrect — \"A Bluetooth keyboard\" does not fit this scenario. The correct answer is \"A USB card reader that connects to the tablet's port\" because a USB card reader connects to the tablet's available port and provides a slot to read the camera's memory card directly, which is the most direct solution to transferring photos without a built-in card slot.","Incorrect — \"A screen protector\" does not fit this scenario. The correct answer is \"A USB card reader that connects to the tablet's port\" because a USB card reader connects to the tablet's available port and provides a slot to read t twork administrator notices that one particular workstation is generating an unusually high volume of ARP traffic, and other devices on the same subnet are experiencing intermittent connectivity issues that started around the same time. What is a reasonable step to investigate?","choices":["Check that workstation for a duplicate IP address conflict, a failing network adapter, or malware, since excessive ARP traffic from one host can indicate any of these","Immediately assume the internet service provider's fiber line has been physically cut","Immediately replace the core router regardless of findings","Immediately disable DNS on every device in the building"],"correct":0,"explain":"A single workstation generating unusually high ARP traffic that correlates with subnet-wide intermittent connectivity issues suggests investigating that specific host for causes like a duplicate IP address conflict, a malfunctioning network adapter, or malware generating abnormal traffic, all of which are localized causes worth ruling out before assuming a much larger infrastructure failure.","wrongExplain":["","Incorrect — \"Immediately assume the internet service provider's fiber line has been physically cut\" does not fit this scenario. The correct answer is \"Check that workstation for a duplicate IP address conflict, a failing network adapter, or malware, since excessive ARP traffic from one host can indicate any of these\" because a single workstation generating unusually high ARP traffic that correlates with subnet-wide intermittent connectivity issues suggests investigating that specific host for causes like a duplicate IP address conflict, a malfunctioning network adapter, or malware generating abnormal traffic, all of which are localized causes worth ruling out before assuming a much larger infrastructure failure.","Incorrect — \"Immediately replace the core router regardless of findings\" does not fit this scenario. The correct answer is \"Check that workstation for a duplicate IP address conflict, a failing network adapter, or malware, since excessive ARP traffic from one host can indicate any of these\" because a single workstation generating unusually high ARP traffic that correlates with subnet-wide intermittent connectivity issues suggests investigating that specific host for causes like a duplicate IP address conflict, a malfunctioning network adapter, or malware generating abnormal traffic, all of which are localized causes worth ruling out before assuming a much larger infrastructure failure.","Incorrect — \"Immediately disable DNS on every device in the building\" does not fit this scenario. The correct answer is \"Check that workstation for a duplicate IP address conflict, a failing network adapter, or malware, since excessive ARP traffic from one host can indicate any of these\" because a single workstation generating unusually high ARP traffic that correlates with subnet-wide intermittent connectivity issues suggests investigating that specific host for causes like a duplicate IP address conflict, a malfunctioning network adapter, or malware generating abnormal traffic, all of which are localized causes worth ruling out before assuming a much larger infrastructure failure."],"sub":"5.7","source":"original-2026-batch"}]</script>

<script>
const QUESTION_BANK = JSON.parse(document.getElementById('question-data').textContent);
const DOMAINS = ["Mobile Devices","Networking","Hardware","Virtualization and Cloud Computing","Hardware and Network Troubleshooting"];
const SUB_OBJECTIVES = {
  "Mobile Devices": [
    { id: "1.1", label: "Laptop Hardware & Components" },
    { id: "1.2", label: "Mobile Device Accessories & Ports" },
    { id: "1.3", label: "Mobile Device Connectivity & Networking" },
  ],
  "Networking": [
    { id: "2.1", label: "TCP/IP, Ports & Protocols" },
    { id: "2.2", label: "Networking Devices & Appliances" },
    { id: "2.3", label: "Wireless Networking & Standards" },
    { id: "2.4", label: "SOHO Network Configuration" },
    { id: "2.5", label: "Internet & WAN Connection Types" },
    { id: "2.6", label: "Network Cabling & Connectors" },
  ],
  "Hardware": [
    { id: "3.1", label: "Cables & Connectors" },
    { id: "3.2", label: "RAM & Memory" },
    { id: "3.3", label: "Storage Devices" },
    { id: "3.4", label: "Motherboards, CPUs & Add-on Cards" },
    { id: "3.5", label: "Power Supplies" },
    { id: "3.6", label: "Peripherals & Multifunction/Printers" },
    { id: "3.7", label: "Custom PC Builds & Configurations" },
  ],
  "Virtualization and Cloud Computing": [
    { id: "4.1", label: "Cloud Computing Concepts" },
    { id: "4.2", label: "Client-Side Virtualization" },
  ],
  "Hardware and Network Troubleshooting": [
    { id: "5.1", label: "Troubleshooting Methodology" },
    { id: "5.2", label: "Motherboard, CPU, RAM & Power Issues" },
    { id: "5.3", label: "Storage Troubleshooting" },
    { id: "5.4", label: "Video & Display Troubleshooting" },
    { id: "5.5", label: "Mobile Device Troubleshooting" },
    { id: "5.6", label: "Printer Troubleshooting" },
    { id: "5.7", label: "Wired & Wireless Network Troubleshooting" },
  ],
};
const SUB_LABEL = {};
Object.values(SUB_OBJECTIVES).forEach(list => list.forEach(s => SUB_LABEL[s.id] = s.label));
const ALL_SUB_IDS = Object.values(SUB_OBJECTIVES).flat().map(s => s.id);
const MIN_Q = 45, MAX_Q = 245;
const STORAGE_KEY = "core1_quiz_session_v2";

const app = document.getElementById('app');

function subCounts(){
  const c = {};
  ALL_SUB_IDS.forEach(id => c[id] = 0);
  QUESTION_BANK.forEach(q => { if(c[q.sub] !== undefined) c[q.sub]++; });
  return c;
}

function poolForSubs(selected){
  return QUESTION_BANK.filter(q => selected.includes(q.sub));
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function loadSession(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    const s = JSON.parse(raw);
    if(s && s.v === 1) return s;
  }catch(e){}
  return null;
}
function saveSession(s){
  s.updatedAt = new Date().toISOString();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
}
function clearSession(){
  localStorage.removeItem(STORAGE_KEY);
}

function questionById(id){
  return QUESTION_BANK.find(q => q.id === id);
}

// ---------- Setup screen ----------
function renderSetup(){
  const counts = subCounts();
  const existing = loadSession();
  const selected = new Set(ALL_SUB_IDS.filter(id => counts[id] > 0));
  let countVal = 100;

  function currentPool(){
    return poolForSubs(Array.from(selected));
  }

  function draw(){
    const pool = currentPool();
    const available = pool.length;
    const effMax = Math.max(1, Math.min(MAX_Q, available));
    const effMin = Math.min(MIN_Q, effMax);
    if(countVal > effMax) countVal = effMax;
    if(countVal < effMin) countVal = effMin;

    app.innerHTML = `
      <h1>CompTIA A+ Core 1 Practice Exam</h1>
      <div class="sub">${QUESTION_BANK.length} questions across all Core 1 (220-1201) objective domains. Pick your objectives and question count to begin.</div>
      <div class="disclaimer"><strong>Educational use only.</strong> This site is a self-study practice tool built from original study questions. It is not affiliated with, endorsed by, or sponsored by CompTIA&reg;. CompTIA and A+ are trademarks of CompTIA, Inc. Objective tagging is an informal study aid, not an official exam blueprint &mdash; always confirm current exam content on comptia.org.</div>
      ${existing && !existing.finished ? `
        <div class="resume-banner">
          <div><strong>Quiz in progress</strong> &mdash; ${existing.answers.filter(a=>a!==null).length} of ${existing.order.length} answered.</div>
          <div class="row">
            <button id="resumeBtn">Resume Quiz</button>
            <button id="discardBtn" class="danger">Discard</button>
          </div>
        </div>` : ``}
      <div class="card">
        <h2>Quick Quiz</h2>
        <div class="sub" style="margin-bottom:14px">A short, no-setup quiz pulling randomly from every objective.</div>
        <div class="tiles">
          <button class="tile lightning" id="quick10Tile">
            <div class="icon">⚡</div>
            <div><div class="ttitle">Quick Quiz</div><div class="tsub">10 Questions</div></div>
          </button>
          <button class="tile fire" id="quick15Tile">
            <div class="icon">🔥</div>
            <div><div class="ttitle">Quick Quiz</div><div class="tsub">15 Questions</div></div>
          </button>
          <button class="tile storm" id="quick20Tile">
            <div class="icon">⛈️</div>
            <div><div class="ttitle">Quick Quiz</div><div class="tsub">20 Questions</div></div>
          </button>
          <button class="tile sun" id="quick25Tile">
            <div class="icon">☀️</div>
            <div><div class="ttitle">Quick Quiz</div><div class="tsub">25 Questions</div></div>
          </button>
        </div>
      </div>
      <div class="card">
        <h2>1. Choose objectives</h2>
        <div class="row" style="margin-bottom:10px">
          <button class="ghost" id="selectAllBtn">Select All</button>
          <button class="ghost" id="selectNoneBtn">Deselect All</button>
        </div>
        <div id="domainGroups"></div>
        <h2 style="margin-top:22px">2. Number of questions</h2>
        <div class="count-row">
          <input type="range" id="countSlider" min="${effMin}" max="${effMax}" value="${countVal}" ${effMax<=effMin?'disabled':''}/>
          <input type="number" id="countNum" min="${effMin}" max="${effMax}" value="${countVal}" />
        </div>
        <div class="note">Choose between ${MIN_Q} and ${MAX_Q} questions. Currently <strong>${available}</strong> question${available===1?'':'s'} available for the selected objectives${available < countVal ? ' — count has been capped.' : ''}.</div>
        <div class="row" style="margin-top:20px">
          <button id="startBtn" ${available===0?'disabled':''}>Start Quiz</button>
        </div>
      </div>
    `;

    const groupsEl = document.getElementById('domainGroups');
    DOMAINS.forEach(d => {
      const subs = SUB_OBJECTIVES[d].filter(s => counts[s.id] > 0);
      if(subs.length === 0) return;
      const group = document.createElement('div');
      group.className = 'domain-group';
      group.innerHTML = `<h3>${d}</h3><div class="domain-list"></div>`;
      const list = group.querySelector('.domain-list');
      subs.forEach(s => {
        const item = document.createElement('div');
        item.className = 'domain-item';
        const id = 'sub_' + s.id.replace('.','_');
        item.innerHTML = `<input type="checkbox" id="${id}" ${selected.has(s.id)?'checked':''}/>
          <label for="${id}">${s.id} &mdash; ${s.label}</label>
          <span class="domain-count">${counts[s.id]} question${counts[s.id]===1?'':'s'}</span>`;
        item.querySelector('input').addEventListener('change', e => {
          if(e.target.checked) selected.add(s.id); else selected.delete(s.id);
          draw();
        });
        list.appendChild(item);
      });
      groupsEl.appendChild(group);
    });

    document.getElementById('selectAllBtn').addEventListener('click', () => {
      ALL_SUB_IDS.forEach(id => { if(counts[id] > 0) selected.add(id); });
      draw();
    });
    document.getElementById('selectNoneBtn').addEventListener('click', () => {
      selected.clear();
      draw();
    });

    document.getElementById('quick10Tile').addEventListener('click', () => startQuiz(ALL_SUB_IDS.slice(), 10));
    document.getElementById('quick15Tile').addEventListener('click', () => startQuiz(ALL_SUB_IDS.slice(), 15));
    document.getElementById('quick20Tile').addEventListener('click', () => startQuiz(ALL_SUB_IDS.slice(), 20));
    document.getElementById('quick25Tile').addEventListener('click', () => startQuiz(ALL_SUB_IDS.slice(), 25));

    document.getElementById('countSlider').addEventListener('input', e => {
      countVal = parseInt(e.target.value, 10);
      document.getElementById('countNum').value = countVal;
    });
    document.getElementById('countNum').addEventListener('change', e => {
      let v = parseInt(e.target.value, 10) || effMin;
      v = Math.max(effMin, Math.min(effMax, v));
      countVal = v;
      draw();
    });
    document.getElementById('startBtn').addEventListener('click', () => {
      startQuiz(Array.from(selected), countVal);
    });
    if(existing && !existing.finished){
      document.getElementById('resumeBtn').addEventListener('click', () => renderQuiz(existing));
      document.getElementById('discardBtn').addEventListener('click', () => { clearSession(); renderSetup(); });
    }
  }
  draw();
}

function startQuiz(selectedSubs, count){
  const pool = shuffle(poolForSubs(selectedSubs)).slice(0, count);
  const order = pool.map(q => ({ id: q.id, displayOrder: shuffle([0,1,2,3]) }));
  const session = {
    v: 1,
    domains: selectedSubs,
    order: order,
    answers: order.map(() => null),
    current: 0,
    finished: false,
    startedAt: new Date().toISOString()
  };
  saveSession(session);
  renderQuiz(session);
}

// ---------- Quiz screen ----------
function renderQuiz(session){
  const total = session.order.length;
  const idx = session.current;
  const entry = session.order[idx];
  const q = questionById(entry.id);
  const answeredIdx = session.answers[idx]; // display-position index, or null

  const answeredCount = session.answers.filter(a=>a!==null).length;
  const pct = Math.round((idx / total) * 100);

  app.innerHTML = `
    <h1>CompTIA A+ Core 1 Practice Exam</h1>
    <div class="qmeta">
      <span>Question ${idx+1} of ${total} &middot; ${q.sub} ${SUB_LABEL[q.sub] || q.domain}</span>
      <span>${answeredCount} answered</span>
    </div>
    <div class="progress"><div class="bar" style="width:${pct}%"></div></div>
    <div class="card">
      <div class="qtext">${escapeHtml(q.q)}</div>
      <div class="choices" id="choicesWrap"></div>
      <div id="feedbackWrap"></div>
      <div class="controls">
        <button class="ghost" id="pauseBtn">Pause &amp; Save</button>
        <div class="row">
          <button class="ghost" id="prevBtn" ${idx===0?'disabled':''}>&#9664; Prev</button>
          <button id="nextBtn" disabled>${idx===total-1 ? 'Finish Quiz' : 'Next ▶'}</button>
        </div>
      </div>
    </div>
  `;

  const choicesWrap = document.getElementById('choicesWrap');
  entry.displayOrder.forEach((origIdx, pos) => {
    const div = document.createElement('div');
    div.className = 'choice';
    div.innerHTML = `<strong>${String.fromCharCode(65+pos)}.</strong> ${escapeHtml(q.choices[origIdx])}`;
    div.addEventListener('click', () => {
      if(session.answers[idx] !== null) return; // already locked
      session.answers[idx] = pos;
      saveSession(session);
      renderQuiz(session);
    });
    choicesWrap.appendChild(div);
  });

  if(answeredIdx !== null){
    lockChoices(session, entry, q, answeredIdx);
    document.getElementById('nextBtn').disabled = false;
  }

  document.getElementById('prevBtn').addEventListener('click', () => {
    session.current = Math.max(0, idx - 1);
    saveSession(session);
    renderQuiz(session);
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    if(idx === total - 1){
      session.finished = true;
      saveSession(session);
      renderResults(session);
    } else {
      session.current = idx + 1;
      saveSession(session);
      renderQuiz(session);
    }
  });
  document.getElementById('pauseBtn').addEventListener('click', () => {
    saveSession(session);
    renderSetup();
  });
}

function lockChoices(session, entry, q, answeredPos){
  const choicesWrap = document.getElementById('choicesWrap');
  const correctPos = entry.displayOrder.indexOf(q.correct);
  const chosenOrigIdx = entry.displayOrder[answeredPos];
  const wasCorrect = chosenOrigIdx === q.correct;

  Array.from(choicesWrap.children).forEach((div, pos) => {
    div.classList.add('locked');
    if(pos === answeredPos && pos === correctPos){
      div.classList.add('selected-correct');
    } else if(pos === answeredPos){
      div.classList.add('selected-wrong');
    } else if(pos === correctPos){
      div.classList.add('reveal-correct');
    }
  });

  const fb = document.getElementById('feedbackWrap');
  let html = '';
  if(wasCorrect){
    html += `<div class="explain-box"><span class="tag good">Correct</span>${escapeHtml(q.explain)}</div>`;
  } else {
    html += `<div class="explain-box"><span class="tag bad">Your answer was wrong</span>${escapeHtml(q.wrongExplain[chosenOrigIdx])}</div>`;
    html += `<div class="explain-box"><span class="tag good">Correct answer</span>${escapeHtml(q.choices[q.correct])} &mdash; ${escapeHtml(q.explain)}</div>`;
  }
  fb.innerHTML = html;
}

// ---------- Results screen ----------
function renderResults(session){
  const total = session.order.length;
  let correctCount = 0;
  const perSub = {};
  const missed = [];

  session.order.forEach((entry, i) => {
    const q = questionById(entry.id);
    const answeredPos = session.answers[i];
    const chosenOrigIdx = answeredPos === null ? null : entry.displayOrder[answeredPos];
    const isCorrect = chosenOrigIdx === q.correct;
    if(!perSub[q.sub]) perSub[q.sub] = {correct:0, total:0};
    perSub[q.sub].total++;
    if(isCorrect){ correctCount++; perSub[q.sub].correct++; }
    else missed.push({q, chosenOrigIdx});
  });

  const answeredCount = session.answers.filter(a=>a!==null).length;
  const score = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;

  app.innerHTML = `
    <h1>Results</h1>
    <div class="card" style="text-align:center">
      <div class="score-big">${score}<span style="font-size:24px;color:var(--muted)"> / 100</span></div>
      <div class="score-sub">${correctCount} correct out of ${answeredCount} answered (${total} selected)</div>
    </div>
    <div class="card">
      <h2>By objective</h2>
      <div id="domainBreakdown"></div>
    </div>
    <div class="card">
      <h2>Review missed questions (${missed.length})</h2>
      <div id="missedList">${missed.length===0 ? '<div class="note">Perfect score on answered questions.</div>' : ''}</div>
    </div>
    <div class="row">
      <button id="newQuizBtn">Start New Quiz</button>
    </div>
  `;

  const db = document.getElementById('domainBreakdown');
  ALL_SUB_IDS.forEach(id => {
    const s = perSub[id];
    if(!s || s.total === 0) return;
    const p = Math.round((s.correct/s.total)*100);
    const row = document.createElement('div');
    row.className = 'domain-score';
    row.innerHTML = `<span>${id} &mdash; ${SUB_LABEL[id]}</span><span>${s.correct}/${s.total} (${p}%)</span>`;
    db.appendChild(row);
  });

  const ml = document.getElementById('missedList');
  missed.forEach(({q, chosenOrigIdx}) => {
    const div = document.createElement('div');
    div.className = 'review-item';
    let yourAnswerHtml = chosenOrigIdx === null
      ? `<div class="explain-box"><span class="tag bad">Not answered</span></div>`
      : `<div class="explain-box"><span class="tag bad">Your answer</span>${escapeHtml(q.choices[chosenOrigIdx])} &mdash; ${escapeHtml(q.wrongExplain[chosenOrigIdx])}</div>`;
    div.innerHTML = `
      <span class="pill">${q.sub} &mdash; ${SUB_LABEL[q.sub] || q.domain}</span>
      <div class="review-q">${escapeHtml(q.q)}</div>
      ${yourAnswerHtml}
      <div class="explain-box"><span class="tag good">Correct answer</span>${escapeHtml(q.choices[q.correct])} &mdash; ${escapeHtml(q.explain)}</div>
    `;
    ml.appendChild(div);
  });

  document.getElementById('newQuizBtn').addEventListener('click', () => {
    clearSession();
    renderSetup();
  });
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

renderSetup();
</script>
</body>
</html>
