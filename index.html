not target the refresh-rate-related cause of blur.","Reducing color depth affects color accuracy, not the motion smoothness or flicker responsible for eye strain."],"sub":"3.4"},{"id":"q0118","domain":"Hardware","q":"A desktop momentarily loses power when multiple USB devices are connected. What is the MOST probable cause?","choices":["Insufficient PSU capacity on the +5V rail","Incorrect BIOS revision","Malware infection","Loose DIMM"],"correct":0,"explain":"Peripheral load can exceed PSU rail capacity.","wrongExplain":["","A BIOS revision mismatch does not typically cause power loss that correlates with the number of USB devices attached.","Malware does not produce symptoms tied to electrical load from connected peripherals.","A loose DIMM tends to cause boot failures or random crashes, not power loss specifically triggered by USB device count."],"sub":"3.5"},{"id":"q0119","domain":"Hardware","q":"Which device provides both temporary power and voltage regulation during brownouts?","choices":["UPS with AVR","Surge protector","Power strip","Line splitter"],"correct":0,"explain":"AVR-equipped UPS units stabilize voltage as well as supply battery power.","wrongExplain":["","A surge protector only clamps voltage spikes; it provides no battery backup and no regulation during under-voltage conditions.","A power strip merely distributes outlets and offers no protection, regulation, or backup power at all.","A line splitter simply splits a power line to more outlets and provides neither regulation nor backup power."],"sub":"3.4"},{"id":"q0120","domain":"Hardware","q":"A disk reports frequent I/O errors but passes SMART self-tests. What should be checked NEXT?","choices":["SATA cable and controller port","Monitor firmware","Keyboard layout","CPU microcode"],"correct":0,"explain":"Cables and ports commonly cause I/O errors independent of disk health.","wrongExplain":["","Monitor firmware has no relationship to storage I/O errors.","Keyboard layout settings are unrelated to disk I/O reliability.","CPU microcode issues typically cause broader system instability, not disk-specific I/O errors on a drive that passes SMART."],"sub":"3.4"},{"id":"q0121","domain":"Hardware","q":"A system freezes intermittently with no BSOD or logs. Which component should be validated FIRST?","choices":["System memory using diagnostics","Display resolution","Disk fragmentation","Printer drivers"],"correct":0,"explain":"Unstable RAM often causes silent freezes.","wrongExplain":["","Display resolution settings do not cause unlogged, intermittent system-wide freezes.","Disk fragmentation typically causes gradual slowdowns rather than sudden silent freezes with no trace.","Printer drivers are unrelated to system-wide freezing that occurs with no logs or dumps."],"sub":"3.6"},{"id":"q0122","domain":"Mobile Devices","q":"Which laptop battery condition requires IMMEDIATE replacement for safety reasons?","choices":["Physical swelling of the battery","Gradually reduced runtime","Slow charging behavior","Inaccurate charge reporting"],"correct":0,"explain":"Swollen batteries pose fire and rupture hazards.","wrongExplain":["","Gradually reduced runtime is normal battery wear over time and is not an immediate safety hazard.","Slow charging is usually a charger or charge-controller issue and does not present an urgent physical danger.","Inaccurate charge reporting is typically a calibration or firmware issue, not a physical safety hazard."],"sub":"1.1"},{"id":"q0123","domain":"Hardware","q":"A 4K monitor is limited to 30Hz over HDMI but supports higher refresh rates. What is the MOST likely limitation?","choices":["HDMI version or cable bandwidth","Insufficient VRAM","Incorrect ICC profile","Failing PSU"],"correct":0,"explain":"Older HDMI standards cap 4K output at 30Hz.","wrongExplain":["","VRAM affects how much texture/frame data the GPU can render, not the maximum refresh rate a given cable standard can carry.","An ICC profile governs color rendering accuracy, not the bandwidth-limited refresh rate over HDMI.","A failing PSU would cause instability or shutdowns, not a specific, consistent refresh-rate cap."],"sub":"3.5"},{"id":"q0124","domain":"Hardware and Network Troubleshooting","q":"Before replacing suspected faulty hardware, which CompTIA step should be performed?","choices":["Validate with known-good components","Reinstall the OS","Update all drivers","Clear temporary files"],"correct":0,"explain":"Known-good testing isolates the faulty component.","wrongExplain":["","Reinstalling the OS addresses software-level problems and does nothing to confirm whether the suspected hardware itself is actually faulty.","Updating drivers targets software/hardware compatibility, not verification that a physical component has actually failed.","Clearing temporary files is a general maintenance task unrelated to isolating a hardware fault before replacement."],"sub":"5.1"},{"id":"q0125","domain":"Hardware","q":"A RAID 5 array enters degraded mode after one disk failure. What action should be taken FIRST?","choices":["Replace the failed disk and rebuild","Back up data and remove the array","Convert to RAID 0","Ignore until another disk fails"],"correct":0,"explain":"RAID 5 tolerates one failure but must be rebuilt to restore fault tolerance.","wrongExplain":["","Removing the array is unnecessarily destructive; a degraded RAID 5 array is still functional and should be rebuilt, not dismantled.","Converting to RAID 0 strips out all redundancy, which worsens the risk profile while the array is already degraded.","Waiting risks total data loss, since a second disk failure while already degraded would cause the entire array to fail."],"sub":"3.3"},{"id":"q0126","domain":"Hardware","q":"A PC powers off under load but remains stable at idle. Which cause is MOST consistent?","choices":["Failing or undersized power supply","Incorrect time zone","Malware infection","Loose display cable"],"correct":0,"explain":"Load-dependent shutdowns point to power delivery issues.","wrongExplain":["","An incorrect time zone is a purely cosmetic OS setting with no effect on power stability under load.","Malware does not typically produce a load-dependent power-off pattern tied to hardware stress.","A loose display cable would cause video signal loss, not a full system power-off triggered by workload."],"sub":"3.5"},{"id":"q0127","domain":"Hardware","q":"Which firmware setting change can directly prevent an installed OS from booting?","choices":["Switching between UEFI and Legacy boot modes","Adjusting fan curves","Disabling onboard audio","Changing RGB profiles"],"correct":0,"explain":"Boot mode mismatches prevent the OS loader from being recognized.","wrongExplain":["","Fan curve adjustments only affect cooling behavior and have no impact on boot device recognition.","Disabling onboard audio is unrelated to the boot process entirely.","RGB lighting profiles are purely cosmetic and have no effect on whether the OS boots."],"sub":"3.4"},{"id":"q0128","domain":"Hardware","q":"After replacing a monitor, colors appear inaccurate compared to the previous display. What is the BEST remediation?","choices":["Apply proper calibration or ICC profile","Replace the GPU","Reinstall the OS","Disable network services"],"correct":0,"explain":"Color profiles vary between displays and must be calibrated.","wrongExplain":["","Replacing the GPU is unnecessary since the output signal itself is not at fault; the new panel simply has different color characteristics needing calibration.","Reinstalling the OS is an extreme, unrelated step for what is simply a display color calibration difference.","Disabling network services has no connection to how a monitor renders color."],"sub":"3.4"},{"id":"q0129","domain":"Hardware","q":"Which power condition is BEST mitigated by automatic voltage regulation?","choices":["Brownouts","Surges","Blackouts","Ground loops"],"correct":0,"explain":"AVR corrects sustained under-voltage conditions.","wrongExplain":["","Surges are handled by surge suppression/clamping components, not by regulating sustained under-voltage.","Blackouts are a total loss of power, so there is no voltage present to regulate; a battery is needed instead.","Ground loops are a wiring/grounding issue addressed through isolation, not through voltage regulation."],"sub":"3.4"},{"id":"q0130","domain":"Hardware","q":"Which symptom MOST strongly indicates a failing graphics card rather than a driver issue?","choices":["Persistent visual artifacts across multiple systems","Slow boot times","Incorrect system time","Disk read errors"],"correct":0,"explain":"Artifacts that persist across systems indicate hardware failure.","wrongExplain":["","Slow boot times are usually related to storage or startup services, not a graphics card fault.","Incorrect system time points to a failing CMOS battery, not the graphics subsystem.","Disk read errors indicate a storage problem, unrelated to a graphics card issue."],"sub":"3.4"},{"id":"q0131","domain":"Hardware","q":"A system disk was disconnected without proper shutdown. Which utility should be run FIRST?","choices":["chkdsk","taskmgr","dxdiag","ipconfig"],"correct":0,"explain":"File system consistency should be verified immediately.","wrongExplain":["","Task Manager manages running processes and performance monitoring; it does not check file system integrity.","dxdiag reports DirectX and device diagnostic information, not disk file system consistency.","ipconfig is a network configuration command and has nothing to do with disk integrity."],"sub":"3.4"},{"id":"q0132","domain":"Hardware","q":"A monitor loses signal when the cable is slightly moved. What should be checked FIRST?","choices":["Connector seating and retention mechanism","GPU firmware","Operating system drivers","Power supply"],"correct":0,"explain":"Physical connection issues are the most common cause.","wrongExplain":["","GPU firmware issues would not be triggered simply by physically moving a cable.","Software drivers do not explain a signal loss that changes with physical cable movement.","The power supply is unrelated to a video signal that is affected by cable position."],"sub":"3.5"},{"id":"q0133","domain":"Hardware","q":"When selecting a PSU for a high-end workstation, which specification is MOST critical?","choices":["Combined wattage and rail amperage","Chassis color","USB port count","Monitor resolution"],"correct":0,"explain":"Adequate power delivery capacity ensures system stability.","wrongExplain":["","Chassis color is purely cosmetic and irrelevant to power delivery capability.","USB port count on the case or motherboard has no bearing on a PSU's power delivery capacity.","Monitor resolution is a display specification, not a PSU consideration."],"sub":"3.5"},{"id":"q0134","domain":"Hardware","q":"A system fails to retain BIOS settings after shutdown. Which component should be replaced?","choices":["CMOS battery","Primary storage","System RAM","Graphics adapter"],"correct":0,"explain":"The CMOS battery maintains firmware settings.","wrongExplain":["","The primary storage drive does not hold BIOS/firmware configuration settings.","System RAM is volatile working memory used by the running OS, not firmware configuration storage.","The graphics adapter has no role in retaining BIOS settings."],"sub":"3.4"},{"id":"q0135","domain":"Hardware","q":"Which display symptom MOST commonly results from an unsupported refresh rate?","choices":["Flickering or unstable image","Hard drive noise","POST beep codes","Network latency"],"correct":0,"explain":"Unsupported refresh rates cause instability.","wrongExplain":["","Hard drive noise is unrelated to a display's refresh rate setting.","POST beep codes occur before the OS loads and are unrelated to a running display's refresh rate configuration.","Network latency has no connection to a monitor's video timing settings."],"sub":"3.3"},{"id":"q0136","domain":"Hardware","q":"A technician hears repetitive clicking from an HDD. What action should be taken IMMEDIATELY?","choices":["Back up data and replace the drive","Run disk defragmentation","Update firmware","Change SATA mode"],"correct":0,"explain":"Clicking indicates imminent mechanical failure.","wrongExplain":["","Defragmenting adds extra mechanical stress to a drive that is already showing signs of imminent failure.","A firmware update will not fix a mechanical fault and risks further complications on a failing drive.","Changing the SATA controller mode is a configuration setting that does not address physical, mechanical drive failure."],"sub":"3.3"},{"id":"q0137","domain":"Hardware and Network Troubleshooting","q":"According to CompTIA troubleshooting methodology, what is ALWAYS the first step?","choices":["Identify the problem","Establish a theory","Test the theory","Implement the solution"],"correct":0,"explain":"Problem identification is the foundation of the troubleshooting process.","wrongExplain":["","Establishing a theory of probable cause is the second step and depends on first having identified the problem.","Testing the theory comes after a theory has been established, which itself follows problem identification.","Implementing the solution is one of the final steps and only makes sense after the problem is identified and the cause confirmed."],"sub":"5.1"},{"id":"q0138","domain":"Hardware","q":"A display exhibits ghosting during fast motion scenes. What is the MOST likely technical cause?","choices":["Slow pixel response time","Insufficient disk throughput","Incorrect boot configuration","Depleted CMOS battery"],"correct":0,"explain":"Ghosting results from slow pixel transitions.","wrongExplain":["","Disk throughput has no relationship to real-time on-screen motion rendering.","Boot configuration settings do not affect active display rendering behavior.","A depleted CMOS battery affects BIOS settings retention, not active display behavior."],"sub":"3.4"},{"id":"q0139","domain":"Hardware","q":"Random system freezes begin after a memory upgrade. What should be verified FIRST?","choices":["RAM compatibility, speed, and voltage","Monitor resolution","Disk partition style","BIOS password"],"correct":0,"explain":"Incompatible RAM commonly causes instability.","wrongExplain":["","Monitor resolution has no connection to system instability following a memory upgrade.","Disk partition style does not affect system stability related to a RAM change.","A BIOS password is unrelated to freezing behavior introduced by a memory upgrade."],"sub":"3.4"},{"id":"q0140","domain":"Hardware","q":"Which hardware failure presents the MOST immediate physical safety risk?","choices":["Swollen lithium-ion battery","Failing SSD","Dead CMOS battery","Corrupt operating system"],"correct":0,"explain":"Swollen batteries can rupture or ignite.","wrongExplain":["","A failing SSD can cause data loss but does not present a physical safety hazard like fire or rupture.","A dead CMOS battery only affects BIOS settings and the system clock; it poses no safety risk.","A corrupt operating system is a software problem with no physical safety hazard."],"sub":"3.3"},{"id":"q0141","domain":"Hardware","q":"After installing a discrete GPU, an integrated-graphics system shows no display. What is the FIRST corrective action?","choices":["Connect the monitor to the discrete GPU output","Update the operating system","Clear CMOS","Replace system memory"],"correct":0,"explain":"Motherboard video outputs are typically disabled when a discrete GPU is installed.","wrongExplain":["","Updating the OS will not restore video output when the monitor is still plugged into the now-disabled onboard port.","Clearing CMOS is unnecessary and risks losing other custom BIOS settings when the actual issue is simply using the wrong video output.","System memory is not the cause of a no-display condition that occurs specifically because the monitor remains connected to the integrated graphics port."],"sub":"3.4"},{"id":"q0142","domain":"Hardware","q":"Which component is responsible for heating toner onto the paper in a laser printer?","choices":["Transfer belt","Pickup roller","Fuser assembly","Imaging drum"],"correct":2,"explain":"The fuser assembly uses heat and pressure to permanently bond toner to the paper.","wrongExplain":["The transfer belt moves the toner image from the drum onto the paper; it does not apply heat to fuse it.","The pickup roller feeds paper into the printer from the tray and plays no role in heating toner.","","The imaging drum holds the electrostatic toner image before transfer and does not itself apply heat."],"sub":"3.6"},{"id":"q0143","domain":"Hardware","q":"Streaks or lines on printed pages in a laser printer often indicate a problem with:","choices":["Fuser","Imaging drum","Formatter board","HVPS"],"correct":1,"explain":"Damage or contamination on the imaging drum commonly causes repeated streaks or lines.","wrongExplain":["Fuser problems more commonly cause smearing, poor toner adhesion, or ghosting from heat issues rather than repeating streak lines.","","The formatter board processes print data and would typically cause garbled output or failure to print, not a physical streak pattern.","The high-voltage power supply governs charging voltages broadly; it would not produce the specific repeating line pattern tied to a damaged drum surface."],"sub":"3.6"},{"id":"q0144","domain":"Hardware","q":"What type of printer uses piezoelectric crystals or thermal nozzles?","choices":["Laser","Impact","Inkjet","Thermal"],"correct":2,"explain":"Inkjet printers fire droplets of ink using either thermal bubbles or piezoelectric crystals.","wrongExplain":["Laser printers use a laser and toner-based electrophotographic process, not nozzles or piezoelectric elements.","Impact printers use mechanical pins striking a ribbon, not ink ejection technology.","","Direct thermal printers use heat-sensitive paper directly rather than nozzles firing ink droplets."],"sub":"3.6"},{"id":"q0145","domain":"Hardware","q":"A printer that prints one line at a time using pins striking a ribbon is:","choices":["Laser","Dot-matrix","Inkjet","Thermal"],"correct":1,"explain":"Dot-matrix printers are impact devices that use pins striking an inked ribbon.","wrongExplain":["Laser printers use toner and a laser/drum imaging process, with no pins or ribbon involved.","","Inkjet printers spray liquid ink droplets and use no mechanical pins.","Thermal printers apply heat to special paper and involve no pins or ribbon."],"sub":"3.6"},{"id":"q0146","domain":"Hardware","q":"A common cause of ghosting in laser printers is:","choices":["Low toner","Defective fuser","Dirty paper path","Wrong DPI setting"],"correct":1,"explain":"A failing fuser can leave faint repeated images (ghosting) because toner is not fully fused.","wrongExplain":["Low toner produces faded print output, not a repeated ghost image.","","A dirty paper path typically causes smudging or jams, not the specific repeated-image pattern of ghosting.","An incorrect DPI setting affects print sharpness/resolution, not repeated ghost images."],"sub":"3.6"},{"id":"q0147","domain":"Hardware","q":"Which printer type requires special paper coated with chemicals that react to heat?","choices":["Thermal","Inkjet","Laser","Impact"],"correct":0,"explain":"Direct thermal printers use heat-sensitive paper that darkens where the printhead heats it.","wrongExplain":["","Inkjet printers use standard paper with liquid ink and do not require heat-reactive coating.","Laser printers use standard paper with toner fused by heat; the paper itself is not chemically heat-reactive.","Impact printers use standard paper struck mechanically and involve no chemical heat-reactive coating."],"sub":"3.6"},{"id":"q0148","domain":"Hardware","q":"Which part moves toner from the imaging drum onto the paper?","choices":["Pickup roller","Transfer roller","Fuser","Exit roller"],"correct":1,"explain":"The transfer roller transfers toner from the drum to the paper in the imaging process.","wrongExplain":["The pickup roller feeds paper into the printer from the tray; it does not move toner at all.","","The fuser bonds toner to paper using heat and pressure after transfer has already occurred; it does not move toner between components.","The exit roller moves the finished printed page out of the printer and has no role in moving toner."],"sub":"3.6"},{"id":"q0149","domain":"Hardware","q":"What causes paper jams near the tray?","choices":["Bad fuser","Dirty corona wire","Worn pickup rollers","Low toner"],"correct":2,"explain":"Worn or glazed pickup rollers fail to grab paper correctly, causing jams at the tray.","wrongExplain":["A bad fuser causes poor toner adhesion or smearing, not jams occurring near the paper tray.","A dirty corona wire causes print quality issues such as streaking, not tray-area paper jams.","","Low toner causes faded print output and has no effect on paper feeding or jams."],"sub":"3.6"},{"id":"q0150","domain":"Hardware","q":"An inkjet printer producing faded output usually needs:","choices":["New fuser","New printhead or cartridges","New transfer roller","Firmware update"],"correct":1,"explain":"Low or dried ink and clogged printheads cause faded output; replacing/cleaning them resolves it.","wrongExplain":["Fusers are a laser printer component and are not present in inkjet printers.","","Transfer rollers belong to laser printers, not inkjet printers, which use a printhead and ink cartridges instead.","A firmware update does not resolve a physical ink shortage or clogged nozzle causing faded output."],"sub":"3.6"},{"id":"q0151","domain":"Hardware","q":"Calibration on color printers adjusts:","choices":["Color alignment","Voltage regulation","Fuser temp","Print speed"],"correct":0,"explain":"Calibration aligns colors and registration so CMYK layers line up correctly.","wrongExplain":["","Voltage regulation is a power delivery concept unrelated to color calibration.","Fuser temperature is a heat setting for bonding toner, not a color calibration parameter.","Print speed is a throughput setting, unrelated to color accuracy or alignment."],"sub":"3.6"},{"id":"q0152","domain":"Hardware","q":"Which printer uses toner?","choices":["Inkjet","Laser","Thermal","Impact"],"correct":1,"explain":"Laser printers use powdered toner and an electro-photographic process.","wrongExplain":["Inkjet printers use liquid ink, not powdered toner.","","Thermal printers use heat-sensitive paper or ribbon and do not use toner.","Impact printers use mechanical pins and an inked ribbon, not toner."],"sub":"3.6"},{"id":"q0153","domain":"Hardware","q":"Which issue results from a clogged inkjet nozzle?","choices":["Ghosting","Color gaps","Paper curl","Wrinkling"],"correct":1,"explain":"Clogged nozzles prevent ink from spraying, causing missing lines or color gaps.","wrongExplain":["Ghosting is a laser printer fuser-related repeated image defect, not a symptom of a clogged inkjet nozzle.","","Paper curl results from moisture or heat exposure to the paper, not from a clogged ink nozzle.","Wrinkling is a paper feed/handling issue, not something caused by a blocked ink nozzle."],"sub":"3.6"},{"id":"q0154","domain":"Hardware","q":"What should be cleaned to fix dark vertical streaks in a laser printer?","choices":["Printhead","Fuser","Corona wire","Transfer belt"],"correct":2,"explain":"A dirty or damaged corona wire can cause dark vertical streaks on the page.","wrongExplain":["Printheads are found in inkjet and thermal printers, not laser printers, so cleaning one would not fix a laser printer's streaking issue.","A dirty or failing fuser typically causes toner smearing or poor adhesion to the page, not distinct vertical streaks.","","A damaged transfer belt on color laser printers usually causes color registration issues or repeating marks, not thin vertical streaks."],"sub":"3.6"},{"id":"q0155","domain":"Hardware","q":"Impact printers require regular replacement of:","choices":["Toner","Ink cartridges","Ribbons","Drums"],"correct":2,"explain":"Impact printers use inked ribbons that wear out and must be replaced.","wrongExplain":["Toner is used by laser printers, which use a completely different electrophotographic process than impact printers.","Ink cartridges are consumables for inkjet printers, not impact printers, which strike an inked ribbon against the paper.","","Imaging drums belong to laser printers; impact printers have no photosensitive drum to wear out."],"sub":"3.6"},{"id":"q0156","domain":"Hardware","q":"A printer showing 'Out of Memory' errors likely needs:","choices":["More toner","More RAM","Firmware update","New printhead"],"correct":1,"explain":"Printer memory (RAM) stores print jobs; complex jobs can exceed capacity.","wrongExplain":["Toner level affects print darkness and quality, not the printer's ability to process and buffer a large job.","","A firmware update might fix bugs or add features, but it does not increase the amount of memory available to process large jobs.","A printhead is a mechanical inkjet component and has nothing to do with how much data the printer can buffer."],"sub":"3.6"},{"id":"q0157","domain":"Hardware","q":"What controls the print language like PCL or PostScript?","choices":["Formatter board","Fuser","Transfer roller","Pickup assembly"],"correct":0,"explain":"The formatter board interprets print languages and renders the page image.","wrongExplain":["","The fuser only bonds toner to paper using heat and pressure; it has no role in interpreting page description languages.","The transfer roller moves the toner image from drum to paper and does not process print language commands.","The pickup assembly is a mechanical part that feeds paper into the printer and plays no role in rendering print data."],"sub":"3.6"},{"id":"q0158","domain":"Hardware","q":"Thermal printers often show faded text due to:","choices":["Low toner","Worn printhead","Old thermal paper","Dirty corona wire"],"correct":2,"explain":"Thermal paper degrades over time; old stock prints faintly even with a good head.","wrongExplain":["Thermal printers don't use toner at all; they create images by applying heat to specially coated paper.","A worn thermal printhead can also cause fading, but here the cause specified is aging paper stock, which loses heat-sensitivity even with a healthy head.","","Corona wires are a laser printer component used to charge the drum; thermal printers have no corona wire."],"sub":"3.6"},{"id":"q0159","domain":"Hardware","q":"Which component must be replaced when it reaches its page count limit?","choices":["Fuser","Imaging drum","Pickup roller","Transfer belt"],"correct":1,"explain":"Many laser printers track drum life; worn drums cause quality issues and must be replaced.","wrongExplain":["Fusers do wear out, but they are rated by thermal cycles and temperature stability rather than the strict page-count 'drum life' figure that defines the imaging drum's replacement interval.","","Pickup rollers wear from friction and can cause jams, but they aren't rated with a specific page-count life limit like the imaging drum.","Transfer belts do wear out over time but aren't the component most commonly cited with a rated page-count replacement interval."],"sub":"3.6"},{"id":"q0160","domain":"Hardware","q":"A laser printer's first step in the imaging process is:","choices":["Developing","Cleaning","Charging","Transferring"],"correct":2,"explain":"The drum is uniformly charged first so the laser can selectively discharge areas to form the image.","wrongExplain":["Developing (applying toner to the discharged areas of the drum) happens only after the drum has already been uniformly charged, not first.","Cleaning removes leftover toner from the previous print cycle and occurs at the end of the process, not the beginning of a new one.","","Transferring moves the developed image to the paper and occurs near the end of the process, well after charging."],"sub":"3.6"},{"id":"q0161","domain":"Hardware","q":"If colors do not line up correctly on a color laser printer, perform:","choices":["Firmware update","Calibration","Fuser reset","Drum cleaning"],"correct":1,"explain":"Color misalignment is corrected by running the printer’s color calibration routine.","wrongExplain":["A firmware update may add features or fix software bugs, but it doesn't physically realign the color registration of the print engine.","","The fuser bonds toner to paper with heat and pressure and has no bearing on how accurately the four color layers are registered.","Cleaning the drum removes residual toner but does nothing to correct the physical alignment of the color imaging stations."],"sub":"3.6"},{"id":"q0162","domain":"Hardware","q":"A grinding noise usually indicates:","choices":["Low toner","Mechanical gear failure","Bad fuser","Dirty corona wire"],"correct":1,"explain":"Grinding sounds typically come from worn or broken gears or mechanical assemblies.","wrongExplain":["Low toner produces faded prints or warning messages, not audible grinding noises.","","A failing fuser more commonly causes heat-related print defects like smearing or curling, not a grinding sound.","A dirty corona wire affects charging and produces print artifacts like streaks, not mechanical noise."],"sub":"3.6"},{"id":"q0163","domain":"Hardware","q":"If paper curls after printing, the likely cause is:","choices":["Humidity","Overheated fuser","Low toner","Dirty rollers"],"correct":1,"explain":"Excessive fuser heat can over-dry paper, causing it to curl as it exits.","wrongExplain":["Humidity can affect paper handling and jamming, but curling that appears right after printing and is heat-related points to the fuser, not ambient moisture.","","Low toner causes faded or streaky output, not physical curling of the paper.","Dirty rollers typically cause feeding problems or smudging, not heat-induced curling."],"sub":"3.6"},{"id":"q0164","domain":"Hardware","q":"What is used to clean laser printer internals?","choices":["Regular vacuum","Toner-safe vacuum","Compressed oil","Ammonia spray"],"correct":1,"explain":"Toner-safe (HEPA) vacuums are designed to safely capture fine toner particles.","wrongExplain":["A standard vacuum lacks the fine filtration needed to contain toner particles and can let them escape into the air or damage the vacuum's motor.","","There is no standard cleaning product called 'compressed oil,' and oil-based products are unsafe near heated printer components.","Ammonia-based cleaners can react with toner and damage internal plastics and electronics, so they are not recommended for printer cleaning."],"sub":"3.6"},{"id":"q0165","domain":"Hardware","q":"Ink smearing from an inkjet usually means:","choices":["Bad fuser","Wet ink","Low toner","Bad formatter"],"correct":1,"explain":"If pages are handled before ink dries, or if too much ink is used, smearing occurs.","wrongExplain":["Fusers are a laser printer component; inkjet printers dry ink through absorption and evaporation rather than heat fusing.","","Inkjet printers use liquid ink, not toner, so toner level is irrelevant to an inkjet smearing issue.","The formatter board processes print data and doesn't directly cause physical ink smearing on the page."],"sub":"3.6"},{"id":"q0166","domain":"Hardware","q":"What is the last step of the laser printing process?","choices":["Cleaning","Fusing","Transferring","Developing"],"correct":0,"explain":"After fusing, the drum is cleaned to remove residual toner for the next cycle.","wrongExplain":["","Fusing bonds the toner to the page and happens before the final cleaning step, not last.","Transferring moves the image to paper and occurs earlier in the cycle, well before fusing and cleaning.","Developing applies toner to the drum early in the cycle, long before the final cleaning stage."],"sub":"3.6"},{"id":"q0167","domain":"Hardware","q":"Paper pulled at an angle indicates:","choices":["Bad imaging drum","Worn rollers","Bad fuser","Low toner"],"correct":1,"explain":"Uneven or worn rollers pull paper skewed, causing angled feeds and jams.","wrongExplain":["A bad imaging drum causes print quality defects like spots or streaks, not paper feeding at an angle.","","A failing fuser affects toner adhesion and heat, not the mechanical path paper takes through the feed rollers.","Low toner produces faded printing, not a physical feeding or skew problem."],"sub":"3.6"},{"id":"q0168","domain":"Hardware","q":"Which printer type is best for carbon copy forms?","choices":["Laser","Inkjet","Dot-matrix","Thermal"],"correct":2,"explain":"Impact (dot-matrix) printers physically strike through multi-part forms to create copies.","wrongExplain":["Laser printers use toner fused with heat and never make physical contact strong enough to imprint through multiple carbon layers.","Inkjet printers spray liquid ink onto a single sheet and cannot transfer an impression through multi-part forms.","","Thermal printers use heat-sensitive paper and only print on the top sheet, so they cannot produce carbon copies."],"sub":"3.6"},{"id":"q0169","domain":"Hardware","q":"An inkjet printer showing banding usually needs:","choices":["Alignment","Calibration","New fuser","New transfer belt"],"correct":0,"explain":"Printhead alignment corrects banding caused by misaligned nozzles or carriage.","wrongExplain":["","Calibration typically adjusts color and density balance rather than the physical timing or position of printhead passes that causes banding; alignment is the specific fix for that symptom.","Fusers are a laser printer component; inkjets have no fuser assembly at all.","Transfer belts belong to laser printers, not inkjets, which have no transfer or imaging drum stage."],"sub":"3.6"},{"id":"q0170","domain":"Hardware","q":"Heavy toner on one side of page means:","choices":["Bad transfer roller","Low toner","Bad fuser","Wrong paper type"],"correct":0,"explain":"A failing transfer roller can cause uneven toner distribution across the page.","wrongExplain":["","Low toner produces overall faded output across the whole page, not toner concentrated heavily on just one side.","A bad fuser affects how well toner bonds to paper, not how evenly it's transferred across the page width.","Using the wrong paper can cause jams or poor adhesion, but it wouldn't cause a consistent one-sided heavy toner pattern tied to the print engine."],"sub":"3.6"},{"id":"q0171","domain":"Hardware","q":"A laser printer with toner flaking off pages needs:","choices":["New drum","New fuser","New pickup roller","Firmware update"],"correct":1,"explain":"If toner rubs off easily, the fuser is not properly bonding toner to the paper.","wrongExplain":["A worn drum causes image quality defects like ghosting or streaks, not toner failing to bond to the page after printing.","","Pickup rollers affect paper feeding, not how well toner adheres to the paper once it's printed.","Firmware controls print processing logic, not the physical heat and pressure bonding of toner to paper."],"sub":"3.6"},{"id":"q0172","domain":"Hardware","q":"Thermal printers often require cleaning of:","choices":["Corona wire","Thermal head","Drum","Transfer belt"],"correct":1,"explain":"Residue on the thermal head causes poor print quality and must be cleaned periodically.","wrongExplain":["Corona wires are used in laser printers to charge the drum; thermal printers have no corona wire.","","Thermal printers don't use a photosensitive drum at all; that's a laser printer component.","Transfer belts are found in laser printers to move toner images; thermal printers have no such component."],"sub":"3.4"},{"id":"q0173","domain":"Hardware","q":"What causes repeating marks?","choices":["Drum damage","Bad pickup roller","Low toner","Wet paper"],"correct":0,"explain":"Damage on the drum surface repeats at the drum’s circumference interval on the page.","wrongExplain":["","A bad pickup roller causes feeding issues like jams or multi-feeds, not marks that repeat at a fixed interval down the page.","Low toner causes overall fading, not a defect that repeats at a consistent interval matching the drum's circumference.","Wet paper can cause jams or smearing, but not marks that repeat at a regular, fixed interval characteristic of a drum defect."],"sub":"3.6"},{"id":"q0174","domain":"Hardware","q":"Laser printers require which maintenance kit part?","choices":["Fuser","Pickup rollers","Transfer roller","All of the above"],"correct":3,"explain":"Maintenance kits typically include fuser, rollers, and sometimes transfer components.","wrongExplain":["The fuser is one component included in a maintenance kit, but it's not the only part the kit replaces.","Pickup rollers are included in maintenance kits too, but they're only one of several components replaced.","The transfer roller is also part of typical maintenance kits, but the kit includes more than just this one part.",""],"sub":"3.6"},{"id":"q0175","domain":"Hardware","q":"If a network printer won't print, check:","choices":["DNS","Print queue","Fuser temp","Paper humidity"],"correct":1,"explain":"Jobs stuck or paused in the print queue are a common cause of 'not printing' complaints.","wrongExplain":["A DNS failure could prevent a client from resolving a print server's name in some setups, but a stuck or paused job in the print queue is the far more common and immediate cause of 'won't print' complaints and should be checked first.","","Fuser temperature relates to how toner is bonded to paper during printing, not whether a job is stuck or paused before it even reaches the print engine.","Paper humidity affects print quality and jamming, not whether a network job is queued and processing at all."],"sub":"3.6"},{"id":"q0176","domain":"Hardware","q":"Which port is commonly used for local printers?","choices":["LPT","HDMI","SATA","Ethernet"],"correct":0,"explain":"Legacy local printers often used the parallel LPT port (e.g., LPT1).","wrongExplain":["","HDMI is a display interface for video and audio, not a data connection used by local printers.","SATA is an internal storage interface for hard drives and SSDs, not an external printer connection.","Ethernet is used for network printers, not the legacy local parallel printer connection the question is asking about."],"sub":"3.3"},{"id":"q0177","domain":"Networking","q":"Which device primarily forwards Ethernet frames by consulting a table of learned hardware addresses?","choices":["Hub","Switch","Repeater","Patch panel"],"correct":1,"explain":"A switch learns source MAC addresses and forwards frames only toward the appropriate port rather than repeating traffic everywhere.","wrongExplain":["A hub simply repeats incoming signals out every port and has no concept of MAC addresses or a forwarding table.","","A repeater only regenerates a weak signal at the physical layer; it doesn't read frames or learn addresses.","A patch panel is a passive wiring point with no electronics for learning addresses or forwarding traffic."],"sub":"2.2"},{"id":"q0178","domain":"Networking","q":"A network team wants each subnet to stop receiving broadcast traffic from the others. Which device best accomplishes that separation?","choices":["Bridge","Hub","Managed access point","Router"],"correct":3,"explain":"Routers break up broadcast domains by routing between separate IP networks.","wrongExplain":["A bridge segments collision domains at Layer 2 but still forwards broadcasts across the segments it connects, so it doesn't stop broadcast traffic between subnets.","A hub forwards all traffic, including broadcasts, out every port and provides no segmentation at all.","An access point bridges wireless clients onto the existing LAN and does not create separate broadcast domains between subnets.",""],"sub":"2.3"},{"id":"q0179","domain":"Networking","q":"A small office wants one switch that can assign ports to separate staff and guest segments. Which capability matters most?","choices":["Port mirroring","VLAN configuration","Signal regeneration","Cable termination"],"correct":1,"explain":"VLAN support is what lets a managed switch logically separate traffic on different ports.","wrongExplain":["Port mirroring copies traffic from one port to another for monitoring or capture purposes; it doesn't logically separate users into different segments.","","Signal regeneration is a Layer 1 function for extending cable distance and has nothing to do with segmenting traffic by group.","Cable termination refers to properly ending a cable run at a jack or panel, not logically separating network traffic."],"sub":"2.2"},{"id":"q0180","domain":"Networking","q":"Which device simply rebuilds a weakened electrical signal and sends it onward without interpreting frames or packets?","choices":["Repeater","Firewall","Router","Layer 3 switch"],"correct":0,"explain":"A repeater is a Layer 1 device that regenerates signals only.","wrongExplain":["","A firewall actively inspects and filters traffic based on rules; it doesn't simply regenerate a signal.","A router reads Layer 3 addressing to make forwarding decisions, which is far more than just regenerating an electrical signal.","A Layer 3 switch makes routing decisions based on packet headers, unlike a repeater which does no frame or packet interpretation."],"sub":"2.2"},{"id":"q0181","domain":"Networking","q":"What most clearly separates a switch from a hub during normal Ethernet operation?","choices":["A switch maintains a MAC table","A switch converts copper to fiber","A switch performs analog modulation","A switch terminates punch-down cables"],"correct":0,"explain":"Switches make forwarding decisions using a MAC address table; hubs just flood traffic out all ports.","wrongExplain":["","Converting between copper and fiber is the job of a media converter, not a defining feature that distinguishes switches from hubs.","Analog modulation is what modems perform, not a standard Ethernet switch function.","Punch-down termination is done at patch panels or wall jacks, not something that distinguishes a switch from a hub."],"sub":"2.6"},{"id":"q0182","domain":"Networking","q":"Which device most commonly translates many private inside addresses to a smaller number of public outside addresses?","choices":["Access point","Router","Bridge","Patch panel"],"correct":1,"explain":"NAT is commonly performed on routers or firewall/router combos at the network edge.","wrongExplain":["An access point provides wireless connectivity to an existing LAN; it doesn't translate private addresses to public ones.","","A bridge connects and forwards traffic between two network segments at Layer 2 but doesn't perform address translation.","A patch panel is purely a passive cable termination point with no networking intelligence, let alone NAT capability."],"sub":"2.3"},{"id":"q0183","domain":"Networking","q":"A company already has Ethernet in place and now wants laptops to join the same network wirelessly. Which device adds that function?","choices":["Firewall","Access point","Repeater","Modem"],"correct":1,"explain":"An access point bridges wireless clients onto the wired LAN.","wrongExplain":["A firewall filters and controls traffic based on rules; it doesn't provide wireless connectivity for laptops to join the LAN.","","A wired repeater just regenerates an electrical signal on the same medium; it doesn't add wireless client access.","A modem connects a network to a WAN or ISP circuit; it doesn't provide local wireless access for laptops."],"sub":"2.3"},{"id":"q0184","domain":"Networking","q":"Which security device is best known for tracking connection state while filtering traffic?","choices":["Hub","Firewall","Patch panel","Media converter"],"correct":1,"explain":"Stateful firewalls inspect traffic and track sessions across multiple layers.","wrongExplain":["A hub has no filtering or state-tracking ability; it just repeats signals to all ports.","","A patch panel is passive cabling infrastructure with no ability to inspect or track traffic.","A media converter only translates between physical media types like copper and fiber; it has no security or state-tracking function."],"sub":"2.2"},{"id":"q0185","domain":"Networking","q":"A small office needs switch-based segmentation, monitoring, and policy features. Which switch type fits best?","choices":["Managed switch","Unmanaged switch","Passive switch","Hub"],"correct":0,"explain":"Managed switches provide VLANs, monitoring, ACLs, and other administrative controls.","wrongExplain":["","Unmanaged switches offer plug-and-play connectivity but no configuration options for VLANs, monitoring, or policies.","There is no true intelligent 'passive switch' feature set; this term doesn't describe a device capable of VLANs or ACLs.","A hub has no management capabilities at all and simply repeats traffic to every connected port."],"sub":"2.2"},{"id":"q0186","domain":"Networking","q":"Which device converts between a service provider's signaling method and a customer's digital network equipment?","choices":["Modem","Switch","Access point","Bridge"],"correct":0,"explain":"A modem modulates and demodulates signals for certain WAN technologies.","wrongExplain":["","A switch forwards Ethernet frames between local devices; it doesn't modulate or demodulate signals for WAN service.","An access point provides wireless LAN access; it has no role in converting a provider's WAN signaling.","A bridge joins two network segments at Layer 2; it doesn't handle the modulation used by ISP circuits."],"sub":"2.5"},{"id":"q0187","domain":"Networking","q":"Which edge appliance most often combines routing, security filtering, VPN features, and sometimes content inspection in one box?","choices":["Patch panel","UTM appliance","NIC","PoE injector"],"correct":1,"explain":"Unified Threat Management devices bundle several perimeter and security functions together.","wrongExplain":["A patch panel is passive cable-termination hardware with no routing, security, or VPN capability.","","A network interface card just connects a single host to the network; it doesn't provide routing or security services.","A PoE injector only adds electrical power to an Ethernet cable; it has no routing or security filtering function."],"sub":"2.5"},{"id":"q0188","domain":"Networking","q":"Which device is built to send and receive RF signals for client connectivity?","choices":["Access point","Firewall","Media converter","Patch panel"],"correct":0,"explain":"Wireless access points use radios and antennas to provide Wi‑Fi service.","wrongExplain":["","A firewall filters traffic based on policy; it does not transmit or receive RF signals for wireless clients.","A media converter changes between wired media types like copper and fiber; it has no radio functionality.","A patch panel is passive copper wiring infrastructure and has no radio components."],"sub":"2.3"},{"id":"q0189","domain":"Networking","q":"Which hardware most directly supplies electrical power to compatible phones, cameras, or APs across Ethernet cabling?","choices":["PoE-capable switch","Router","Firewall","Cable modem"],"correct":0,"explain":"A PoE switch injects power onto Ethernet pairs for powered devices.","wrongExplain":["","A standard router routes traffic between networks but doesn't inherently supply electrical power over Ethernet cabling.","A firewall filters traffic for security; it has no built-in capability to deliver power over Ethernet.","A cable modem connects a LAN to an ISP's coaxial network; it does not supply power to connected devices."],"sub":"2.5"},{"id":"q0190","domain":"Networking","q":"Which device most effectively reduces collisions by creating a separate collision domain on each active port?","choices":["Hub","Switch","Repeater","Media converter"],"correct":1,"explain":"Each switch port is its own collision domain, unlike a hub that shares one domain.","wrongExplain":["A hub shares a single collision domain across all connected ports, which is the opposite of what's being asked.","","A repeater extends a single shared segment and does not create separate collision domains per port.","A media converter simply changes the physical medium and does not segment collision domains."],"sub":"2.2"},{"id":"q0191","domain":"Networking","q":"Which device forwards traffic by evaluating destination IP networks rather than destination MAC tables?","choices":["Router","Hub","Patch panel","Bridge"],"correct":0,"explain":"Routers forward based on Layer 3 addressing information.","wrongExplain":["","A hub has no addressing logic whatsoever; it just repeats signals to every port.","A patch panel is passive wiring with no forwarding decisions of any kind.","A bridge forwards traffic based on Layer 2 MAC addresses, not Layer 3 IP network information."],"sub":"2.2"},{"id":"q0192","domain":"Networking","q":"Which component is passive infrastructure used mainly to organize and terminate cabling runs?","choices":["Patch panel","Switch","Firewall","Access point"],"correct":0,"explain":"Patch panels are passive cable-management and termination components.","wrongExplain":["","A switch is active networking equipment that makes forwarding decisions, unlike passive cable-management hardware.","A firewall is an active security device that filters traffic, not a passive cable termination point.","An access point is active wireless equipment, not passive cable infrastructure."],"sub":"2.3"},{"id":"q0193","domain":"Networking","q":"Which device is most appropriate for enforcing a rule that blocks unsolicited traffic from the internet into a LAN?","choices":["Hub","Firewall","Patch panel","Wireless repeater"],"correct":1,"explain":"Firewalls are designed to enforce network access policies between trust boundaries.","wrongExplain":["A hub has no filtering capability and would forward all traffic indiscriminately.","","A patch panel is passive cabling hardware and cannot enforce any traffic rules.","A wireless repeater extends Wi-Fi coverage; it has no capability to enforce traffic filtering policy."],"sub":"2.2"},{"id":"q0194","domain":"Networking","q":"Which hardware is specifically intended to join separate IP networks and move traffic between them?","choices":["Router","Bridge","Repeater","Access point"],"correct":0,"explain":"Routers interconnect distinct networks and choose paths between them.","wrongExplain":["","A bridge connects segments at Layer 2 within the same broadcast domain rather than routing between distinct IP networks.","A repeater only regenerates signals within a single segment and has no concept of separate IP networks.","An access point extends a single wireless network to clients; it does not interconnect distinct IP networks."],"sub":"2.3"},{"id":"q0195","domain":"Networking","q":"An analyst wants to copy all packets from one switch port to another for Wireshark capture. Which device feature supports that?","choices":["Port mirroring on a managed switch","Auto-MDI/MDIX on an unmanaged switch","Collision detection on a hub","Signal regeneration on a repeater"],"correct":0,"explain":"Port mirroring (SPAN) is typically available on managed switches for monitoring.","wrongExplain":["","Auto-MDI/MDIX automatically detects straight-through vs. crossover cabling; it has nothing to do with copying traffic for capture.","Collision detection on a hub relates to managing shared-medium contention, not selectively copying traffic to an analysis port.","Signal regeneration on a repeater just boosts the electrical signal; it doesn't duplicate traffic to a separate capture port."],"sub":"2.2"},{"id":"q0196","domain":"Networking","q":"Which device can split collision domains while still allowing broadcast frames to remain inside the same VLAN?","choices":["Switch","Router","Hub","Gateway"],"correct":0,"explain":"A Layer 2 switch gives each port its own collision domain but forwards broadcasts within the VLAN.","wrongExplain":["","A router separates broadcast domains entirely by routing between networks, rather than keeping ports in the same broadcast domain while only splitting collisions.","A hub doesn't split collision domains at all; every port shares one collision domain.","A gateway sits at the boundary between networks and routes traffic, rather than just splitting collision domains within one VLAN."],"sub":"2.2"},{"id":"q0197","domain":"Networking","q":"Which device most often stores SSID settings and wireless security parameters such as WPA modes?","choices":["Access point","Patch panel","Bridge","Fiber tray"],"correct":0,"explain":"SSIDs and wireless encryption settings are configured on access points or wireless controllers.","wrongExplain":["","A patch panel is passive copper termination hardware with no configuration settings like SSIDs.","A wired bridge connects network segments and typically has no wireless SSID or WPA configuration.","A fiber tray is simply a physical enclosure for managing and protecting fiber cable slack, with no configuration capability."],"sub":"2.6"},{"id":"q0198","domain":"Networking","q":"Which device is used when one side of a link is fiber optic and the other side is copper Ethernet?","choices":["Media converter","Hub","Bridge","Firewall"],"correct":0,"explain":"Media converters translate between different physical media types.","wrongExplain":["","A hub only works with a single electrical medium and can't translate between fiber-optic light signals and copper electrical signals.","A bridge forwards frames between segments logically but doesn't perform the physical media translation between fiber and copper.","A firewall filters traffic by policy; it has no function for converting between physical media types."],"sub":"2.6"},{"id":"q0199","domain":"Networking","q":"Which switch feature logically separates users into distinct networks without changing the physical cabling layout?","choices":["VLANs","PoE","NAT","Load balancing"],"correct":0,"explain":"VLANs create separate broadcast domains on the same switch infrastructure.","wrongExplain":["","Power over Ethernet delivers electrical power to devices; it has nothing to do with logically segmenting users.","NAT translates private IP addresses to public ones; it doesn't create logical segments within a LAN.","Load balancing distributes traffic across multiple servers or links; it doesn't segment users into separate logical networks."],"sub":"2.2"},{"id":"q0200","domain":"Networking","q":"Which device stays at Layer 1 and simply repeats incoming bits to other ports?","choices":["Hub","Router","Layer 3 switch","Firewall"],"correct":0,"explain":"A hub is a physical-layer repeater and does not inspect frame headers.","wrongExplain":["","A router operates at Layer 3, examining IP addressing to make forwarding decisions, far beyond simply repeating bits.","A Layer 3 switch makes routing decisions based on packet headers rather than blindly repeating incoming bits.","A firewall inspects and filters traffic based on rules, which requires far more than the simple bit-repeating a hub performs."],"sub":"2.2"},{"id":"q0201","domain":"Networking","q":"Which hardware type is the primary policy-enforcement point when an organization wants to allow some traffic and deny other traffic between networks?","choices":["Patch panel","Firewall","Unmanaged switch","Repeater"],"correct":1,"explain":"Firewalls enforce permit/deny rules between zones or networks.","wrongExplain":["A patch panel is passive cabling hardware with no ability to permit or deny traffic.","","An unmanaged switch simply forwards frames with no configurable rules for allowing or denying traffic.","A repeater only regenerates signals and has no capability to filter or enforce policy."],"sub":"2.2"},{"id":"q0202","domain":"Networking","q":"On most LANs, which device type provides hosts with the next-hop address they use to reach remote networks?","choices":["Router","Hub","Patch panel","Bridge"],"correct":0,"explain":"The default gateway is typically a router or Layer 3 interface.","wrongExplain":["","A hub operates at Layer 1 and has no concept of IP addressing or default gateways.","A patch panel is passive cabling infrastructure and cannot serve as a gateway address.","A bridge connects segments at Layer 2 and does not provide Layer 3 gateway functionality for reaching remote networks."],"sub":"2.2"},{"id":"q0203","domain":"Networking","q":"Which component inside or attached to a host gives that device a physical and data-link connection to the network medium?","choices":["NIC","Firewall","Patch panel","Router"],"correct":0,"explain":"A network interface card provides the host's Layer 1/Layer 2 connectivity.","wrongExplain":["","A firewall filters traffic between networks; it isn't the component that physically connects a host to the network medium.","A patch panel terminates and organizes cabling in a wiring closet; it isn't installed in an end host as its network adapter.","A router forwards traffic between networks; it isn't the host-side hardware that provides a single device's physical network connection."],"sub":"2.2"},{"id":"q0204","domain":"Networking","q":"Which device is intended to rebroadcast wireless signals to extend coverage farther into weak-signal areas?","choices":["Wireless repeater","Switch","Patch panel","Modem"],"correct":0,"explain":"A wireless repeater/extender rebroadcasts Wi‑Fi to expand coverage.","wrongExplain":["","A switch forwards wired Ethernet frames between ports; it has no radio to rebroadcast a wireless signal.","A patch panel is passive copper cabling infrastructure with no wireless capability.","A modem connects a network to a WAN or ISP circuit; it doesn't rebroadcast Wi-Fi signals to extend coverage."],"sub":"2.2"},{"id":"q0205","domain":"Networking","q":"Which device has the least traffic awareness because it forwards bits without any table lookups or security decisions?","choices":["Hub","Switch","Router","Firewall"],"correct":0,"explain":"A hub simply repeats traffic and lacks switching, routing, or filtering intelligence.","wrongExplain":["","A switch builds and consults a MAC address table to forward frames only to the appropriate port, which is a level of traffic awareness a hub lacks.","A router makes forwarding decisions based on IP routing tables, requiring even more awareness of network topology than a switch.","A firewall inspects traffic against security rules before allowing or blocking it, making it the most traffic-aware device listed."],"sub":"2.2"},{"id":"q0206","domain":"Networking","q":"Which device type is most likely to support interface-based ACLs for controlling traffic inside a LAN?","choices":["Managed switch","Repeater","Patch panel","Hub"],"correct":0,"explain":"Managed switches often support ACLs at the port, interface, or VLAN level.","wrongExplain":["","A repeater just regenerates a signal to extend distance; it has no interface awareness or ability to apply access control rules.","A patch panel is a passive wiring termination point with no electronics or logic to enforce ACLs.","A hub is an unmanaged, protocol-unaware device that repeats signals to all ports and cannot filter traffic."],"sub":"2.2"},{"id":"q0207","domain":"Networking","q":"Which device blends traditional switching with routing functions so it can switch locally and route between VLANs?","choices":["Layer 3 switch","Hub","Patch panel","Media converter"],"correct":0,"explain":"A Layer 3 switch combines Layer 2 switching with Layer 3 routing features.","wrongExplain":["","A hub only repeats electrical signals at Layer 1 and has no switching or routing capability.","A patch panel merely provides a fixed termination point for cabling and performs no switching or routing.","A media converter only translates a signal between two physical media types, such as copper and fiber, without any routing logic."],"sub":"2.2"},{"id":"q0208","domain":"Networking","q":"Which device is commonly positioned at the network edge to connect an internal network to an upstream provider or external network?","choices":["Router","Access switch","Patch panel","Wireless controller"],"correct":0,"explain":"Edge routers connect a local network to WAN or internet services.","wrongExplain":["","An access switch connects end devices within the LAN but does not typically provide WAN connectivity to an external network.","A patch panel only organizes cable terminations and has no networking intelligence to connect networks.","A wireless controller manages access points inside the network and is not positioned at the WAN edge."],"sub":"2.5"},{"id":"q0209","domain":"Networking","q":"Which device can provide inter-VLAN communication without requiring a separate external router-on-a-stick design?","choices":["Layer 3 switch","Hub","Access point","Repeater"],"correct":0,"explain":"A Layer 3 switch can route between VLAN interfaces internally.","wrongExplain":["","A hub operates only at Layer 1 and cannot perform any VLAN routing.","An access point bridges wireless clients to the wired LAN but has no Layer 3 routing function.","A repeater simply regenerates signals and has no awareness of VLANs or IP addressing."],"sub":"2.3"},{"id":"q0210","domain":"Networking","q":"Which hardware must a desktop or laptop have in order to make a direct physical network connection in the first place?","choices":["NIC","Firewall","Patch panel","Router"],"correct":0,"explain":"Without a NIC or embedded network adapter, a host has no network interface to connect with.","wrongExplain":["","A firewall filters traffic between networks but does not provide the physical connection a host uses to reach the network.","A patch panel is passive cabling infrastructure and does not attach to or reside inside the host.","A router forwards traffic between networks but is a separate device, not part of the host's own hardware."],"sub":"2.2"},{"id":"q0211","domain":"Networking","q":"Which wireless infrastructure component centrally manages multiple APs, roaming behavior, and WLAN policy settings across a site?","choices":["Wireless controller","Hub","Patch panel","Bridge"],"correct":0,"explain":"Wireless controllers provide centralized management for many access points and their policies.","wrongExplain":["","A hub is an unmanaged Layer 1 device and has no capability to manage wireless policies or roaming.","A patch panel only handles wired cable terminations and has no role in wireless management.","A bridge connects two network segments at Layer 2 but does not provide centralized multi-AP management or roaming coordination."],"sub":"2.2"},{"id":"q0212","domain":"Networking","q":"A technician needs to verify that a workstation NIC can transmit and receive frames without relying on the live network infrastructure. Which tool should be used?","choices":["Loopback plug.","Cable certifier.","Tone and probe set.","Patch-panel punch tool."],"correct":0,"explain":"A loopback plug reflects the signal back to the NIC so the adapter can be tested without depending on the rest of the network.","wrongExplain":["","A cable certifier measures cabling performance against wiring standards rather than testing whether a NIC can transmit and receive on its own.","A tone and probe set is used to trace a cable run through walls or panels, not to test NIC loopback functionality.","A punchdown tool terminates wires into a patch panel and has no role in testing a NIC's transmit/receive capability."],"sub":"2.2"},{"id":"q0213","domain":"Networking","q":"A user can browse to a website by typing its IP address, but typing the domain name fails. Which protocol and port should the technician check first?","choices":["DNS over UDP 53.","DNS over TCP 53.","HTTPS over TCP 443.","DHCP over UDP 67."],"correct":0,"explain":"If IP-based access works but name-based access fails, the immediate suspect is DNS resolution on UDP port 53.","wrongExplain":["","DNS primarily uses UDP for standard queries; TCP 53 is reserved mainly for zone transfers and oversized responses, not the first thing to check for typical resolution failures.","HTTPS handles encrypted web sessions itself, but the symptom described (IP works, name doesn't) points to name resolution, not the HTTPS session.","DHCP is responsible for assigning IP configuration, not resolving domain names, so it isn't relevant to this symptom."],"sub":"2.1"},{"id":"q0214","domain":"Networking","q":"A workstation has been given a static IP address and subnet mask, but it still cannot communicate with devices on remote networks. Which setting is most likely missing?","choices":["Default gateway.","DNS server.","Preferred hostname.","Alternate IP config."],"correct":0,"explain":"The default gateway provides the route for traffic that must leave the local subnet.","wrongExplain":["","A missing DNS server would prevent name resolution, not the underlying ability to route packets to remote networks.","The local hostname identifies the machine on the network but plays no role in routing traffic to remote networks.","An alternate IP configuration is a backup profile used when DHCP fails; it has no bearing on reaching remote networks with a valid static address already set."],"sub":"2.1"},{"id":"q0215","domain":"Networking","q":"A technician must allow encrypted web browsing through a firewall. Which protocol and port combination should be permitted?","choices":["HTTPS over TCP 443.","HTTP over TCP 80.","SSH over TCP 22.","FTPS over TCP 990."],"correct":0,"explain":"HTTPS uses TCP 443 for encrypted web traffic.","wrongExplain":["","HTTP carries unencrypted web traffic, which does not satisfy the requirement for encrypted browsing.","SSH provides encrypted remote terminal access, not web browsing traffic.","FTPS is used for secure file transfer, not for web page traffic."],"sub":"2.1"},{"id":"q0216","domain":"Networking","q":"A small business already has coaxial cabling installed and wants relatively fast, low-latency internet for video meetings and cloud services. Which connection type is the best fit?","choices":["Cable internet.","Fiber internet.","Fixed wireless.","DSL service."],"correct":0,"explain":"Cable internet uses coaxial infrastructure and generally provides better speed and latency than typical DSL or satellite alternatives.","wrongExplain":["","Fiber would also perform well, but it requires new fiber infrastructure rather than reusing the existing coaxial cabling already in place.","Fixed wireless depends on line-of-sight radio links and typically has less consistent latency than a wired coaxial connection.","DSL runs over telephone copper, not the coaxial cabling already installed, and generally offers lower speeds than cable."],"sub":"2.6"},{"id":"q0217","domain":"Networking","q":"A company wants a separate network designed specifically for high-speed access between servers and shared storage arrays. Which network type matches that requirement?","choices":["SAN.","NAS.","WLAN.","WAN."],"correct":0,"explain":"A SAN, or Storage Area Network, is built to provide dedicated high-speed access to storage resources.","wrongExplain":["","A NAS provides file-level shared storage over a standard network but is not the dedicated high-speed block-storage fabric a SAN provides.","A WLAN is a wireless local network for client connectivity, not a specialized storage network.","A WAN connects geographically distant networks and has nothing to do with dedicated server-to-storage connectivity."],"sub":"2.5"},{"id":"q0218","domain":"Networking","q":"A technician is terminating horizontal cabling into a patch panel and must seat each conductor into the insulation displacement contacts. Which tool is appropriate?","choices":["Punchdown tool.","RJ-45 crimper.","Cable jacket stripper.","Tone generator probe."],"correct":0,"explain":"A punchdown tool is used to terminate twisted-pair conductors into patch panels and keystone jacks.","wrongExplain":["","A crimper attaches RJ-45 connectors onto cable ends for patch cables; it is not used to seat wires into a patch panel's IDC contacts.","A jacket stripper only removes the outer insulation and does not seat individual conductors into contacts.","A tone and probe set is used to trace and identify cables, not to terminate them into a patch panel."],"sub":"2.6"},{"id":"q0219","domain":"Networking","q":"A workstation can reach local devices by IP address but cannot reach websites by name. Which setting should the technician verify first on that workstation?","choices":["DNS server address.","Default gateway.","Subnet mask value.","Proxy bypass list."],"correct":0,"explain":"Domain-name failures with otherwise working local connectivity usually point to a DNS configuration issue.","wrongExplain":["","This scenario describes a name-resolution failure rather than a routing failure, so the gateway is not the first item to check.","An incorrect subnet mask would typically break local subnet communication too, which is working fine in this scenario.","A proxy bypass list affects whether certain addresses skip a proxy server, not basic domain name resolution."],"sub":"2.1"},{"id":"q0220","domain":"Networking","q":"A small office needs wireless coverage throughout one building while still using a wired backbone for switches and printers. Which network type is being implemented?","choices":["WLAN.","LAN.","CAN.","MAN."],"correct":0,"explain":"A WLAN is a wireless local area network used for in-building Wi-Fi connectivity.","wrongExplain":["","A LAN describes a wired or general local network, not specifically the wireless portion of the design being asked about.","A campus area network spans multiple buildings on a campus, which is broader than a single-building wireless deployment.","A metropolitan area network covers a city-sized area, far larger than one building's wireless coverage."],"sub":"2.3"},{"id":"q0221","domain":"Networking","q":"A technician must allow secure remote access to a Windows server's graphical desktop. Which protocol and port should the firewall allow?","choices":["RDP over TCP 3389.","VNC over TCP 5900.","SSH over TCP 22.","SMB over TCP 445."],"correct":0,"explain":"Microsoft Remote Desktop Protocol uses TCP port 3389.","wrongExplain":["","VNC is a cross-platform remote desktop protocol, but it is not the native Windows Remote Desktop protocol referenced here.","SSH provides encrypted command-line access, not a graphical desktop session.","SMB is used for file and printer sharing, not remote desktop access."],"sub":"2.1"},{"id":"q0222","domain":"Networking","q":"Before terminating Ethernet cable, a technician needs to remove the jacket without nicking the internal conductors. Which tool should be used?","choices":["Cable stripper.","RJ-45 crimper.","Punchdown tool.","Cable certifier."],"correct":0,"explain":"A cable stripper is designed to remove the outer jacket while minimizing the chance of damaging internal wires.","wrongExplain":["","A crimper attaches connectors after the wires are already exposed; it does not remove the outer jacket.","A punchdown tool seats individual wires into IDC contacts and is not used for jacket removal.","A cable certifier tests finished cable performance and is not used during the jacket-stripping step."],"sub":"2.6"},{"id":"q0223","domain":"Networking","q":"A user wants a short-range network connecting a phone, smartwatch, and wireless earbuds. Which type of network best describes that setup?","choices":["PAN.","WLAN.","LAN.","MAN."],"correct":0,"explain":"A Personal Area Network is intended for very short-range connections around one user.","wrongExplain":["","A WLAN describes wireless coverage across a building or area, which is a larger scope than a single-user device cluster.","A LAN connects multiple devices across a location such as an office, not just personal devices worn by one user.","A metropolitan area network spans a city, far beyond the range of personal wearable devices."],"sub":"2.1"},{"id":"q0224","domain":"Networking","q":"Which address range is reserved for private IPv4 addressing and is valid for use inside a home or office network?","choices":["192.168.0.0 through 192.168.255.255.","172.32.0.0 through 172.63.255.255.","169.254.0.0 through 169.254.255.255.","198.18.0.0 through 198.19.255.255."],"correct":0,"explain":"The 192.168.0.0/16 range is one of the RFC 1918 private IPv4 address spaces.","wrongExplain":["","This range is outside the actual private range of 172.16.0.0 through 172.31.255.255; 172.32 and above are public address space.","This is the APIPA/link-local range used for self-assigned addresses when DHCP fails, not a general private-use range.","This range is reserved for network benchmarking and testing purposes, not general private addressing."],"sub":"2.1"},{"id":"q0225","domain":"Networking","q":"A rural home has no cable or fiber provider available, and the owner only needs general connectivity rather than low-latency gaming. Which connection type is the most realistic recommendation?","choices":["Satellite internet.","Fixed wireless broadband.","Cellular hotspot service.","DSL over copper."],"correct":0,"explain":"Satellite internet is commonly used where terrestrial broadband is unavailable, though its latency is higher.","wrongExplain":["","Fixed wireless requires a line-of-sight radio link to a nearby tower, which may not be available in a remote area lacking that infrastructure.","A cellular hotspot depends on nearby cell coverage and typically has data caps, making it less suited as a primary connection than satellite where towers are scarce.","DSL requires existing telephone copper infrastructure and proximity to a central office, which the scenario states is unavailable."],"sub":"2.6"},{"id":"q0226","domain":"Networking","q":"A user can send email successfully but cannot retrieve messages to a client that downloads mail locally. Which protocol and port should the technician check first?","choices":["POP3 over TCP 110.","IMAP over TCP 143.","SMTP over TCP 25.","SMTPS over TCP 465."],"correct":0,"explain":"POP3 is used for email retrieval and commonly operates over TCP port 110.","wrongExplain":["","IMAP keeps mail synchronized on the server rather than downloading it locally, which doesn't match the client behavior described.","SMTP handles outbound mail delivery, which the scenario says is already working, so it is not the protocol to investigate for retrieval failures.","SMTPS is a secured variant of the outbound mail protocol and is not involved in downloading messages to a local client."],"sub":"2.1"},{"id":"q0227","domain":"Networking","q":"A company wants to connect multiple branch offices in different cities under one corporate network. Which network type describes that design?","choices":["WAN.","MAN.","CAN.","LAN."],"correct":0,"explain":"A Wide Area Network connects geographically separated locations.","wrongExplain":["","A metropolitan area network typically spans a single city, not multiple branch offices across different cities.","A campus area network connects buildings within one campus, not separate cities.","A LAN is confined to a single site and cannot describe a network spanning multiple cities."],"sub":"2.5"},{"id":"q0228","domain":"Networking","q":"A technician wants to identify signal strength, nearby SSIDs, and channel congestion before adjusting office Wi-Fi settings. Which tool is the best choice?","choices":["Wi-Fi analyzer.","Spectrum analyzer.","Cable certifier.","Tone and probe kit."],"correct":0,"explain":"A Wi-Fi analyzer reveals wireless channel usage, signal levels, and overlapping networks.","wrongExplain":["","A spectrum analyzer measures raw RF energy across frequencies but doesn't identify specific SSIDs or Wi-Fi channel details the way a Wi-Fi analyzer does.","A cable certifier tests wired cabling performance and has no application to wireless signal analysis.","A tone and probe kit is used to trace physical cables, not to analyze wireless signals or SSIDs."],"sub":"2.3"},{"id":"q0229","domain":"Networking","q":"A small office wants devices to receive IP addresses automatically rather than assigning them by hand. Which configuration service should be used?","choices":["DHCP.","APIPA.","DNS.","NAT."],"correct":0,"explain":"DHCP automatically leases IP addresses and related network settings to clients.","wrongExplain":["","APIPA is a fallback self-assigned address used only when DHCP is unavailable, not a service used to intentionally distribute addresses.","DNS resolves names to IP addresses; it does not assign IP addresses to devices.","NAT translates private addresses to public ones for internet access; it does not automatically hand out IP addresses to local devices."],"sub":"2.1"},{"id":"q0230","domain":"Networking","q":"A technician needs to securely transfer files to a Linux server while also allowing encrypted remote management. Which protocol best fits that requirement?","choices":["SFTP over SSH.","SCP over SSH.","FTPS over TLS.","SMB with signing."],"correct":0,"explain":"SFTP runs over SSH and provides encrypted file transfer together with secure remote administration.","wrongExplain":["","SCP also rides on SSH but only supports basic copy operations without the interactive file management, such as listing or renaming, that SFTP provides.","FTPS secures FTP with TLS but does not natively bundle the same encrypted remote administration shell that SSH provides.","SMB with signing protects file sharing integrity on Windows networks but is not the standard secure file-transfer and remote-management combination used with Linux servers."],"sub":"2.1"},{"id":"q0231","domain":"Networking","q":"A workstation is set to obtain an IP address automatically but instead assigns itself 169.254.42.18. What does that indicate?","choices":["The system could not reach a DHCP server.","The workstation received a loopback address.","The subnet mask was manually cleared.","The NIC joined an IPv6-only segment."],"correct":0,"explain":"An APIPA address in the 169.254.0.0/16 range indicates DHCP failed and the client self-assigned an address.","wrongExplain":["","The loopback address is 127.0.0.1, not an address in the 169.254.0.0/16 range.","Clearing a subnet mask wouldn't cause the system to self-assign an APIPA address; that behavior specifically results from a failed DHCP request.","169.254.x.x is an IPv4 APIPA address, unrelated to IPv6-only segments."],"sub":"2.2"},{"id":"q0232","domain":"Networking","q":"Which device primarily forwards traffic between hosts on the same LAN by using destination MAC addresses?","choices":["Switch.","Bridge router.","Wireless router.","Access point."],"correct":0,"explain":"A switch forwards Ethernet frames within a LAN using MAC address tables.","wrongExplain":["","A bridge router (brouter) combines bridging and routing to move traffic between different network segments, going beyond simple same-LAN MAC-based forwarding.","A wireless router's main job is routing between networks and providing wireless access, not switching frames based on MAC address tables.","An access point extends wireless connectivity to the wired LAN but does not perform MAC-address table lookups the way a switch does."],"sub":"2.3"},{"id":"q0233","domain":"Networking","q":"A laptop connects to the office Wi-Fi but reports strong signal and no internet access. Other users are online. Which configuration item should the technician verify first if the laptop also has an APIPA address?","choices":["DHCP communication.","Default gateway entry.","DNS suffix search.","Proxy auto-config."],"correct":0,"explain":"If the device has an APIPA address, the immediate concern is whether it can obtain a lease from DHCP.","wrongExplain":["","With an APIPA address, the device never received real network configuration, including the gateway, so DHCP itself must be checked before the gateway setting matters.","DNS suffix settings only matter for resolving unqualified hostnames and are irrelevant while the device is stuck with a self-assigned APIPA address.","A proxy configuration issue would only matter after basic IP connectivity works, but here the client never even got a valid address, so DHCP is the deeper problem."
